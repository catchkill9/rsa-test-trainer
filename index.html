/driving-test-manoeuvres-ireland.html"},{"id":"sim32","deck":"sim","type":"sim","q":["I want you to pull in and stop on the left / hill.   …then:   When you are ready you can move off.","אני רוצה שתכנסי ותעצרי בצד שמאל / בעלייה.   …ואז:   כשאת מוכנה אפשר לצאת."],"say":"I want you to pull in and stop on the left / hill.   …then:   When you are ready you can move off.","he":"אני רוצה שתכנסי ותעצרי בצד שמאל / בעלייה.   …ואז:   כשאת מוכנה אפשר לצאת.","a":["This is the hill start. Stop, handbrake on (the tester asks you to \"secure the vehicle\" if you forget), cancel the signal. Then prepare: first gear, find the bite point, mirrors, safety glance, release the handbrake and move off without rolling back or stalling.","זה ה-hill start. לעצור, בלם יד (אם שוכחים, הבוחן מבקש \"secure the vehicle\"), לבטל איתות. אחר כך: הילוך ראשון, נקודת אחיזה, מראות, safety glance, לשחרר בלם יד וליסוע בלי לגלוש אחורה ובלי לכבות."],"phase":["The drive and the manoeuvres","הנסיעה והתמרונים"],"phaseKey":"drive","conf":"official","confLabel":["RSA wording (verbatim)","ניסוח רשמי של ה-RSA (מילה במילה)"],"ref":["mv07"],"src":"RSA Standard Procedures (Feb 2026) p.18; smartdrivingacademy.ie/articles/driving-test-manoeuvres-ireland.html"},{"id":"sim33","deck":"sim","type":"sim","q":["We're now coming towards the end of your test, please find a suitable place and park.","אנחנו מתקרבים לסוף המבחן, בבקשה מצאי מקום מתאים וחני."],"say":"We're now coming towards the end of your test, please find a suitable place and park.","he":"אנחנו מתקרבים לסוף המבחן, בבקשה מצאי מקום מתאים וחני.","a":["No parallel or bay parking is requested (you may reverse-park if you wish; Park Assist is not allowed). Park legally and close to the kerb: not on yellow lines, a footpath, a disabled bay or an entrance. Handbrake fully on and engine off – the tester stays in the car until then. If it is a poor spot the tester asks if you are satisfied with the parking position.","לא מבקשים חנייה במקביל או במפרץ (מותר לחנות לאחור אם רוצים; Park Assist אסור). לחנות חוקית וקרוב למדרכה: לא על קווים צהובים, מדרכה, חניית נכים או כניסה. בלם יד מלא ומנוע כבוי – הבוחן נשאר ברכב עד אז. אם המקום גרוע הבוחן שואל אם את מרוצה ממיקום החנייה."],"phase":["The drive and the manoeuvres","הנסיעה והתמרונים"],"phaseKey":"drive","conf":"official","confLabel":["RSA wording (verbatim)","ניסוח רשמי של ה-RSA (מילה במילה)"],"ref":["mv17"],"src":"RSA Standard Procedures (Feb 2026) p.18; smartdrivingacademy.ie/articles/driving-test-manoeuvres-ireland.html"},{"id":"sim34","deck":"sim","type":"sim","q":["We'll now return to the office, and I'll give you the result of the test. Thank you.","עכשיו נחזור למשרד ואתן לך את תוצאת המבחן. תודה."],"say":"We'll now return to the office, and I'll give you the result of the test. Thank you.","he":"עכשיו נחזור למשרד ואתן לך את תוצאת המבחן. תודה.","a":["The result is only announced back at the desk, never in the car.","התוצאה נמסרת רק בחזרה ליד השולחן, לא ברכב."],"ans":["\"Thank you.\"","\"Thank you.\""],"phase":["End of the test and the result","סיום המבחן והתוצאה"],"phaseKey":"end","conf":"official","confLabel":["RSA wording (verbatim)","ניסוח רשמי של ה-RSA (מילה במילה)"],"src":"RSA Standard Procedures (Feb 2026) p.18"},{"id":"sim35","deck":"sim","type":"sim","q":["Unfortunately, on this occasion you have not been successful.   (pass: you sign the Certificate of Competency, then you are told you have passed)","לצערי, הפעם לא עברת את המבחן.   (במקרה של עמידה: חותמים על ה-Certificate of Competency ואז נאמר שעברת)"],"say":"Unfortunately, on this occasion you have not been successful.   (pass: you sign the Certificate of Competency, then you are told you have passed)","he":"לצערי, הפעם לא עברת את המבחן.   (במקרה של עמידה: חותמים על ה-Certificate of Competency ואז נאמר שעברת)","a":["Fail: you get the Driving Test Feedback Form with the key areas circled, the Statement of Driving Test Outcome, a short verbal feedback, and a detailed report later; rebook through MyRoadSafety. Pass: the Certificate of Competency is valid for 2 years, apply for the licence on the NDLS website or at an NDLS office; until then learner restrictions still apply; N-plates for 2 years if it is your first full Irish licence.","אי-עמידה: מקבלים את ה-Driving Test Feedback Form עם האזורים המסומנים, Statement of Driving Test Outcome, משוב בעל פה קצר, ודוח מפורט בהמשך; מזמינים מחדש דרך MyRoadSafety. עמידה: ה-Certificate of Competency תקף שנתיים; מבקשים רישיון באתר NDLS או במשרד NDLS; עד אז חלות מגבלות ה-learner; שלט N לשנתיים אם זה הרישיון הראשון המלא שלך באירלנד."],"phase":["End of the test and the result","סיום המבחן והתוצאה"],"phaseKey":"end","conf":"official","confLabel":["RSA wording (verbatim)","ניסוח רשמי של ה-RSA (מילה במילה)"],"src":"RSA Standard Procedures (Feb 2026) p.19-20"},{"id":"sim36","deck":"sim","type":"sim","q":["(Eyesight check)","(בדיקת ראייה)"],"say":"(Eyesight check)","he":"(בדיקת ראייה)","a":["No eyesight reading step appears in the RSA's procedure from greeting to result (the list above is complete). Eyesight is checked when you get the learner permit. Wear your glasses/lenses if you need them to drive.","אין שלב של בדיקת קריאת ראייה בנוהל של ה-RSA מהקבלה עד התוצאה (הרשימה למעלה שלמה). ראייה נבדקת בהוצאת ה-learner permit. מרכיבים משקפיים/עדשות אם צריך כדי לנהוג."],"phase":["Not in the RSA script (read this)","לא בתסריט של ה-RSA (כדאי לקרוא)"],"phaseKey":"notes","conf":"unverified","confLabel":["Unverified","לא מאומת"],"n":["Your brief lists an eyesight check. I did not find one in the RSA document. If a tester asks, do it; do not worry if none happens.","בבריף מופיעה בדיקת ראייה. לא מצאתי כזו במסמך של ה-RSA. אם בוחן יבקש – לעשות; אם לא קורה – אין מה לדאוג."],"src":"RSA Standard Procedures (Feb 2026) p.5-19 (absence of the step)"},{"id":"sim37","deck":"sim","type":"sim","q":["(Order of the manoeuvres on the road)","(סדר התמרונים בכביש)"],"say":"(Order of the manoeuvres on the road)","he":"(סדר התמרונים בכביש)","a":["Desk → oral questions → car checks → secondary controls → drive (≥ 25 minutes of driving) with the reverse, turnabout and hill start on the route → park near the end → back to the desk. The RSA does not fix the order of reverse / turnabout / hill start; it depends on the route.","שולחן → שאלות בעל פה → בדיקות ברכב → בקרות משניות → נסיעה (לפחות 25 דקות נהיגה) עם reverse, turnabout ו-hill start במסלול → חנייה לקראת הסוף → חזרה לשולחן. ה-RSA לא קובע סדר לתמרונים; זה תלוי במסלול."],"phase":["Not in the RSA script (read this)","לא בתסריט של ה-RSA (כדאי לקרוא)"],"phaseKey":"notes","conf":"official-para","confLabel":["RSA procedure (paraphrased)","נוהל ה-RSA (פרפרזה)"],"n":["The sequence of the stages is official; the order of the three manoeuvres is inferred (route dependent).","סדר השלבים רשמי; סדר שלושת התמרונים הוא מסקנה (תלוי מסלול)."],"src":"RSA Standard Procedures (Feb 2026) p.15-18; order of manoeuvres inferred"},{"id":"sim38","deck":"sim","type":"sim","q":["(Where this wording comes from, and what I could not check)","(מאיפה הניסוח, ומה לא הצלחתי לבדוק)"],"say":"(Where this wording comes from, and what I could not check)","he":"(מאיפה הניסוח, ומה לא הצלחתי לבדוק)","a":["The tester's lines marked \"official\" are quoted from the RSA's own procedure that testers must follow (\"The wording as set out in these procedures should be followed at all times\"). Instructor sites (advancedrivingschool.ie, smartdrivingacademy.ie, drivingtesttips.ie, drivinglessontallaght.ie) repeat these lines and add typical questions. I could NOT read candidate threads on Reddit, boards.ie or YouTube (blocked or rate-limited), so candidates' own recollections are not included. One instructor blog (drivinglessontallaght.ie) puts the car checks before the oral part; the RSA procedure puts the desk and oral part first, and this simulation follows the RSA.","השורות של הבוחן המסומנות \"official\" מצוטטות מהנוהל של ה-RSA שהבוחנים חייבים לפעול לפיו (\"The wording as set out in these procedures should be followed at all times\"). אתרי מורים (advancedrivingschool.ie, smartdrivingacademy.ie, drivingtesttips.ie, drivinglessontallaght.ie) חוזרים על השורות האלה ומוסיפים שאלות אופייניות. לא הצלחתי לקרוא שרשורי נבחנים ב-Reddit, boards.ie או YouTube (חסום או הגבלת קצב), ולכן אין כאן זכרונות של נבחנים עצמם. בלוג אחד של מורה (drivinglessontallaght.ie) מקדים את בדיקות הרכב לחלק בעל פה; נוהל ה-RSA מציב קודם את השולחן והחלק בעל פה, והסימולציה כאן עוקבת אחרי ה-RSA."],"phase":["Not in the RSA script (read this)","לא בתסריט של ה-RSA (כדאי לקרוא)"],"phaseKey":"notes","conf":"official","confLabel":["RSA wording (verbatim)","ניסוח רשמי של ה-RSA (מילה במילה)"],"src":"RSA Standard Procedures (Feb 2026) p.5 (\"Notes\"); advancedrivingschool.ie/tester-s-terminology; smartdrivingacademy.ie/articles/driving-test-manoeuvres-ireland.html"},{"id":"ck01","deck":"checks","type":"text","q":["Tyres: what do you check, and what do you say?","צמיגים: מה בודקים ומה אומרים?"],"a":["Three things: (1) tread depth – legal minimum 1.6 mm across the main treads, all round the tyre; (2) general condition – no cuts, bulges or uneven wear; (3) pressure – the manufacturer's recommended pressure. Say you would check all four tyres and the spare.","שלושה דברים: (1) עומק חריצים – מינימום חוקי 1.6 מ\"מ בחריצים הראשיים, בכל היקף הצמיג; (2) מצב כללי – בלי חתכים, בליטות או שחיקה לא אחידה; (3) לחץ אוויר – לפי המלצת היצרן. אומרים שבודקים את כל ארבעת הצמיגים ואת הרזרבי."],"src":"RSA vehicle page + RSA-B (tyres are listed); wording from instructor sources"},{"id":"ck02","deck":"checks","type":"text","q":["How would you check your tyre tread depth?","איך בודקים את עומק החריצים?"],"a":["With a tread-depth gauge, or by looking at the tread-wear indicators in the grooves. The legal minimum is 1.6 mm (the RSA recommends changing earlier, around 3 mm).","עם מד עומק חריצים, או בעזרת מחווני השחיקה שבחריצים. המינימום החוקי 1.6 מ\"מ (ה-RSA ממליץ להחליף מוקדם יותר, בסביבות 3 מ\"מ)."],"n":["The 3 mm advice is from instructor sites, not the RSA pages I read.","ההמלצה ל-3 מ\"מ היא מאתרי מורים ולא מדפי ה-RSA שקראתי."],"src":"RSA vehicle page (1.6 mm); 3 mm advice from instructor sources"},{"id":"ck03","deck":"checks","type":"text","q":["Where do you find the correct tyre pressure?","איפה מוצאים את לחץ האוויר הנכון?"],"a":["In the car handbook, or on a sticker (usually in the driver's door frame or fuel flap). Check with a gauge when the tyres are cold.","בספר הרכב או במדבקה (בדרך כלל במשקוף דלת הנהג או בפתח מילוי הדלק). בודקים עם מד לחץ כשהצמיגים קרים."],"src":"General motoring knowledge (Inf) – check your own car"},{"id":"ck04","deck":"checks","type":"text","q":["Lights: which do you check?","אורות: מה בודקים?"],"a":["Dipped headlights, main beam, sidelights, rear lights, number-plate lights, brake lights, indicators and hazards; and the red reflectors at the back. Walk round the car (or use a reflection) to check each one works.","אורות נמוכים, אורות גבוהים, אורות חנייה, אורות אחוריים, תאורת לוחית רישוי, אורות בלימה, איתות וארבעת המהבהבים; וגם המחזירי אור האדומים מאחור. הולכים סביב הרכב (או משתמשים בהשתקפות) ובודקים שכל אחד פועל."],"src":"RSA-B (lights are listed); detail from instructor sources"},{"id":"ck05","deck":"checks","type":"text","q":["How do you check the indicators?","איך בודקים את האיתות?"],"a":["Operate each side in turn and check front, side and rear lights flash amber; the dashboard arrow should flash at a normal rate – a fast flash usually means a bulb has failed. All indicator lights must clearly show amber.","מפעילים כל צד לחוד ובודקים שהאורות הקדמיים, הצדדיים והאחוריים מהבהבים בכתום; חץ הלוח צריך להבהב בקצב רגיל – הבהוב מהיר בדרך כלל אומר שנורה נשרפה. כל אורות האיתות חייבים להיות כתומים בבירור."],"src":"RSA-C p.5 (indicators amber); rest Inf"},{"id":"ck06","deck":"checks","type":"text","q":["How would you check that the brake lights work?","איך בודקים שאורות הבלימה עובדים?"],"a":["Ask someone to stand behind the car while you press the brake pedal, or reverse close to a wall/window and look at the reflection, or check in the mirror with the engine on. Say what you would do clearly.","מבקשים ממישהו לעמוד מאחורי הרכב ולוחצים על דוושת הבלם, או מתקרבים אחורה לקיר/חלון ורואים את ההשתקפות. אומרים בבירור מה הייתם עושים."],"src":"Instructor sources (Inf); the test itself requires working brake lights (RSA-C p.5)"},{"id":"ck07","deck":"checks","type":"text","q":["How do you check the engine oil level?","איך בודקים את רמת שמן המנוע?"],"a":["Park on level ground with the engine off for a few minutes. Pull out the dipstick, wipe it, push it back fully, pull it out again and read the level – it should be between MIN and MAX. Top up if low.","חונים על קרקע ישרה כשהמנוע כבוי כמה דקות. שולפים את מקל המדידה, מנגבים, מחזירים עד הסוף, שולפים שוב וקוראים את הרמה – היא צריכה להיות בין MIN ל-MAX. מוסיפים שמן אם נמוך."],"src":"RSA-B (oil levels listed); steps from instructor sources"},{"id":"ck08","deck":"checks","type":"text","q":["How do you check the coolant level?","איך בודקים את רמת נוזל הקירור?"],"a":["Look at the coolant expansion tank: the level should be between MIN and MAX. Check with the engine cold. Never open the cap on a hot engine.","מסתכלים על מיכל ההתפשטות של נוזל הקירור: הרמה צריכה להיות בין MIN ל-MAX. בודקים כשהמנוע קר. אף פעם לא פותחים את המכסה כשהמנוע חם."],"src":"Instructor sources / general (Inf)"},{"id":"ck09","deck":"checks","type":"text","q":["How do you check the brake fluid? What if it is low?","איך בודקים את נוזל הבלמים? ומה אם הוא נמוך?"],"a":["Find the brake-fluid reservoir and check the level is between MIN and MAX. A low level can mean worn brake pads or a leak – get it checked straight away.","מוצאים את מיכל נוזל הבלמים ובודקים שהרמה בין MIN ל-MAX. רמה נמוכה יכולה להצביע על רפידות שחוקות או נזילה – לבדוק מיד."],"src":"Instructor sources / general (Inf)"},{"id":"ck10","deck":"checks","type":"text","q":["How do you check the power steering?","איך בודקים את ההגה הכוח (power steering)?"],"a":["Hydraulic systems: check the fluid reservoir level (MIN–MAX). Test: with the engine off, steering feels heavy; start the engine and it should lighten. Electric systems have no fluid.","מערכות הידראוליות: בודקים את רמת הנוזל במיכל (MIN–MAX). בדיקה: כשהמנוע כבוי ההגה כבד; מניעים והוא צריך להיות קל. במערכות חשמליות אין נוזל."],"src":"Instructor sources (Inf)"},{"id":"ck11","deck":"checks","type":"text","q":["How do you check the windscreen washer fluid?","איך בודקים את נוזל שמשות (washer)?"],"a":["Locate the washer reservoir (symbol of a windscreen with a spray) and check it is topped up; operate the washers to show they spray.","מוצאים את מיכל נוזל השמשות (סמל של שמשה עם התזה) ובודקים שהוא מלא; מפעילים את המרססים להראות שהם מתיזים."],"src":"RSA-C p.4 (wipers and washer fluid must work)"},{"id":"ck12","deck":"checks","type":"text","q":["How would you know if you have a problem with your steering?","איך תדע שיש בעיה בהגה?"],"a":["The steering feels too loose (excess play) or too stiff, the car pulls to one side, the wheel vibrates, or you hear noises when turning.","ההגה רפוי מדי (משחק יתר) או קשיח מדי, הרכב מושך לצד, ההגה רועד, או נשמעים רעשים בפנייה."],"src":"Instructor sources (Inf)"},{"id":"ck13","deck":"checks","type":"text","q":["How do you check the handbrake?","איך בודקים את בלם היד?"],"a":["Apply it: it should hold firmly and not travel too far. With the car in gear on level ground, try gently to move off with the handbrake on – it should hold the car. It must be in good working order for the test.","מפעילים אותו: הוא צריך להחזיק חזק ולא לעלות יותר מדי. כשהרכב בהילוך על קרקע ישרה מנסים בעדינות לנסוע כשבלם היד מופעל – הוא צריך להחזיק. הוא חייב להיות תקין למבחן."],"src":"RSA-C p.5; method from instructor sources"},{"id":"ck14","deck":"checks","type":"text","q":["How do you check the footbrake (service brake)?","איך בודקים את הבלם (דוושת הבלימה)?"],"a":["When stationary: the pedal should feel firm and not sink to the floor. When moving slowly (in a safe place): brake gently – the car should stop in a straight line without pulling.","בעמידה: הדוושה צריכה להיות יציבה ולא שוקעת לרצפה. בנסיעה איטית (במקום בטוח): בולמים בעדינות – הרכב צריך לעצור בקו ישר בלי למשוך."],"src":"Instructor sources (Inf)"},{"id":"ck15","deck":"checks","type":"text","q":["What do you check about the horn?","מה בודקים בצופר?"],"a":["Press it briefly to show it works (not in a built-up area between 11.30 pm and 7 am).","לוחצים בקצרה כדי להראות שהוא עובד (לא באזור בנוי בין 23:30 ל-7:00)."],"src":"Instructor sources; horn rule RoR p.66"},{"id":"ck16","deck":"checks","type":"text","q":["How do you adjust the head restraint correctly?","איך מכוונים נכון את משענת הראש?"],"a":["Adjust it so the top is at least level with the top of your ears (ideally the top of your head) and close behind your head, not at your neck.","מכוונים כך שהחלק העליון לפחות בגובה החלק העליון של האוזניים (עדיף גובה הראש) וקרוב לראש מאחור, לא ברמת הצוואר."],"src":"General road-safety advice (Inf) – ask your instructor to show you in your car"},{"id":"ck17","deck":"checks","type":"text","q":["Which warning lights stay on after you turn the ignition on (engine not started)?","אילו נורות אזהרה נשארות דולקות אחרי הפעלת הסוויץ' (לפני התנעה)?"],"a":["Typically the battery/charging, oil-pressure and handbrake/brake warning lights come on and then go out once the engine runs (the handbrake light stays until you release it). A warning light that stays on while driving can stop the test.","בדרך כלל נורות המצבר/טעינה, לחץ שמן ובלם היד/בלמים נדלקות ונכבות אחרי שהמנוע פועל (נורת בלם היד נשארת עד שמשחררים). נורת אזהרה שנשארת דולקת בנסיעה עלולה לעצור את המבחן."],"n":["It differs per car – check yours.","משתנה בין רכבים – לבדוק ברכב שלך."],"src":"RSA-C p.5 (warning lights); first part is Inf"},{"id":"ck18","deck":"checks","type":"text","q":["In-car checks before you drive off: what are they?","בדיקות בתוך הרכב לפני נסיעה: מה הן?"],"a":["Doors closed; seat adjusted; seat belt on; head restraint set; interior and external mirrors adjusted; handbrake on, gear in neutral (or P). The tester also watches this.","דלתות סגורות; מושב מכוון; חגורה; משענת ראש; מראות פנימית וחיצוניות מכוונות; בלם יד פעיל, הילוך בניוטרל (או P). הבוחן גם מסתכל על זה."],"src":"RSA-B (\"In-car checks – including seat and mirror adjustments\"), RSA-M (Rules/Checks)"},{"id":"ck19","deck":"checks","type":"text","q":["Windscreen wipers and washers: what must be true for the test?","מגבים ומרססים: מה צריך להתקיים למבחן?"],"a":["The wipers and washer system must be fully operational; the windscreen clean and free from visual obstructions including excessive cracks.","המגבים והמרססים חייבים לפעול במלואם; השמשה נקייה וחופשית ממכשולי ראייה, כולל סדקים רבים."],"src":"RSA-C p.4"},{"id":"ck20","deck":"checks","type":"text","q":["What does the RSA say about the spare wheel?","מה ה-RSA אומר על הגלגל הרזרבי?"],"a":["Space-saver (emergency) spare wheels are not acceptable for the test because their speed rating doesn't meet test requirements.","גלגל רזרבי קטן (space-saver) לא מתקבל למבחן כי דירוג המהירות שלו לא עומד בדרישות."],"src":"RSA-C p.4"},{"id":"ck21","deck":"checks","type":"text","q":["How many technical-check questions can you get wrong?","כמה שאלות בדיקה טכנית מותר לטעות?"],"a":["One slip is not marked. If you can't answer or describe 3 or more checks, a single Grade 2 fault is recorded for Rules/Checks (never more than 1 fault, never a Grade 3).","טעות אחת לא נרשמת. אם לא עונים/לא מתארים 3 בדיקות או יותר – נרשם ליקוי Grade 2 אחד ב-Rules/Checks (לא יותר מליקוי אחד, ולא Grade 3)."],"src":"RSA-M p.5, p.24"},{"id":"sc01","deck":"secondary","type":"text","q":["Show me: front windscreen wipers and washers.","הראי: מגבים ומרססי שמשה קדמית."],"a":["Use the wiper stalk: show slow, fast and intermittent; pull the stalk towards you (or press the button) to spray washer fluid, and let the wipers clear it.","משתמשים בידית המגבים: מראים מהיר, איטי וחלקי (intermittent); מושכים את הידית אליכם (או לוחצים על הכפתור) להתזת נוזל, והמגבים מנקים."],"src":"RSA-B (secondary controls: washers, wipers, lights)"},{"id":"sc02","deck":"secondary","type":"text","q":["Show me: rear window wiper / washer (if fitted).","הראי: מגב ומתיז אחורי (אם יש)."],"a":["Use the rear wiper control (often a ring on the same stalk or a dashboard switch). Know where it is in YOUR car.","משתמשים בבקר המגב האחורי (לעיתים טבעת על אותה ידית או מתג בלוח). לדעת איפה זה ברכב שלכם."],"src":"Instructor sources (Inf)"},{"id":"sc03","deck":"secondary","type":"text","q":["Show me: front demister (windscreen).","הראי: מפשיר שמשה קדמית (demister)."],"a":["Switch on the blower directed at the windscreen (often a \"windscreen\" button), with warm air or A/C. The RSA says driving while condensation restricts visibility is a fault.","מפעילים את המפוח לכיוון השמשה (לעיתים כפתור \"windscreen\"), עם אוויר חם או מזגן. לפי ה-RSA נהיגה כשהעיבוי מגביל ראות היא ליקוי."],"src":"RSA-M (Vehicle Controls: secondary controls)"},{"id":"sc04","deck":"secondary","type":"text","q":["Show me: rear demister (heated rear window).","הראי: מפשיר אחורי (חלון אחורי מחומם)."],"a":["Press the button with the rectangle and wavy arrows; the indicator light confirms it is on. Many cars also heat the mirrors with it.","לוחצים על הכפתור עם המלבן והחיצים המסולסלים; נורית חיווי מאשרת שהוא פעיל. ברכבים רבים זה מחמם גם את המראות."],"src":"Instructor sources (Inf)"},{"id":"sc05","deck":"secondary","type":"text","q":["Show me: dipped headlights.","הראי: אורות נמוכים."],"a":["Turn the light switch to dipped headlights and confirm the dashboard light is on. Say when you use them (see Room deck).","מסובבים את מתג האורות לאורות נמוכים ומאשרים שנורית הלוח דולקת. אפשר לציין מתי משתמשים בהם."],"src":"RSA-B; RoR p.64"},{"id":"sc06","deck":"secondary","type":"text","q":["Show me: main (full) beam.","הראי: אורות גבוהים."],"a":["From dipped, push or pull the stalk (depends on the car) – the blue symbol lights up. Switch back to dipped when other traffic approaches.","מאורות נמוכים דוחפים או מושכים את הידית (תלוי ברכב) – הסמל הכחול נדלק. חוזרים לנמוכים כשמגיעה תנועה."],"src":"Instructor sources (Inf)"},{"id":"sc07","deck":"secondary","type":"text","q":["Show me: fog lights (front / rear).","הראי: פנסי ערפל (קדמיים/אחוריים)."],"a":["Know the switch in your car. Use fog lights only in dense fog or falling snow and switch them off otherwise.","לדעת איפה המתג ברכב. משתמשים בפנסי ערפל רק בערפל כבד או בשלג, ומכבים בשאר הזמן."],"src":"RoR p.64"},{"id":"sc08","deck":"secondary","type":"text","q":["Show me: hazard warning lights.","הראי: מהבהבי חירום (hazards)."],"a":["Press the red triangle button: all four indicators flash together. Switch off again safely.","לוחצים על כפתור המשולש האדום: ארבעת האיתותים מהבהבים יחד. מכבים שוב בבטחה."],"src":"Instructor sources (Inf)"},{"id":"sc09","deck":"secondary","type":"text","q":["Show me: air vents and heater / air conditioning.","הראי: פתחי אוויר, חימום / מזגן."],"a":["Direct air to the face, feet or windscreen; adjust temperature and fan speed; know the recirculation and A/C buttons.","מכוונים אוויר לפנים, לרגליים או לשמשה; מתאימים טמפרטורה ומהירות מפוח; מכירים את כפתורי הסירקולציה והמזגן."],"src":"Instructor sources (Inf)"},{"id":"sc10","deck":"secondary","type":"text","q":["Show me: indicators and horn.","הראי: איתות וצופר."],"a":["Push the stalk up for right, down for left, and check the dashboard arrow flashes; cancel it afterwards. Press the horn briefly.","דוחפים את הידית למעלה לימין ולמטה לשמאל ובודקים שחץ הלוח מהבהב; מבטלים אחר כך. לוחצים בקצרה על הצופר."],"src":"Instructor sources (Inf)"},{"id":"sc11","deck":"secondary","type":"text","q":["What happens if you misuse or cannot show secondary controls?","מה קורה אם לא יודעים להפעיל בקרים משניים?"],"a":["Not being able to demonstrate one control isn't marked. Not being able to demonstrate 3 secondary controls is a Grade 2 fault. A serious misuse during the practical drive (for example driving with a misted-up windscreen) can also be a Grade 2.","חוסר יכולת להפעיל בקר אחד לא נרשם. חוסר יכולת להפעיל 3 בקרים משניים = ליקוי Grade 2. שימוש שגוי חמור בזמן הנהיגה (למשל נסיעה עם שמשה מעובה) יכול גם הוא להיות Grade 2."],"src":"RSA-M p.24, p.26"},{"id":"sc12","deck":"secondary","type":"text","q":["Where must you learn the controls?","איפה חייבים ללמוד את הבקרים?"],"a":["In the car you will take the test in. Switches differ between models; if you test in an instructor's or hired car, sit in it 10–15 minutes before the test and go through every control.","ברכב שבו תיבחנו. המתגים שונים בין דגמים; אם נבחנים ברכב של מורה או שכור – לשבת בו 10–15 דקות לפני המבחן ולעבור על כל בקר."],"src":"Instructor sources (Inf)"},{"id":"td01","deck":"days","type":"text","q":["Arrive and wait where?","מגיעים ומחכים איפה?"],"a":["Be in the test-centre waiting room/area before your appointed time. Do not wait in your vehicle. If you are late the test will not go ahead and you lose the fee.","להיות בחדר ההמתנה של מרכז המבחנים לפני השעה שנקבעה. לא לחכות ברכב. אם מאחרים – המבחן לא מתקיים ומפסידים את האגרה."],"src":"RSA-C p.3, RSA-B p.7"},{"id":"td02","deck":"days","type":"text","q":["What must your learner permit be?","מה צריך להיות ב-learner permit?"],"a":["Valid (in date, check the expiry beside the category on the back), for the correct category (B), and matching your identity. Bring the actual card.","תקף (תאריך תפוגה ליד הקטגוריה בגב), בקטגוריה הנכונה (B), ותואם לזהות שלך. מביאים את הכרטיס עצמו."],"src":"RSA-C p.3"},{"id":"td03","deck":"days","type":"text","q":["Training requirement","דרישת הכשרה"],"a":["All required EDT lessons must be completed and uploaded by your ADI on MyEDT before the test (reduced EDT for some foreign-licence holders). Otherwise the test is cancelled 5 days before.","כל שיעורי ה-EDT הנדרשים חייבים להיות מושלמים ומועלים על ידי המורה ב-MyEDT לפני המבחן (EDT מופחת לחלק ממחזיקי רישיון זר). אחרת המבחן מבוטל 5 ימים לפני."],"src":"RSA-B p.5, RSA-C p.3, RSA FAQs"},{"id":"td04","deck":"days","type":"text","q":["Insurance documents","מסמכי ביטוח"],"a":["Display the original insurance disc (white with a green band on the left; shows registration and policy dates). Also bring a valid certificate of motor insurance naming you as a driver of the test car (digital OK). If you are not named: the certificate plus a letter/email on headed paper from the insurer stating you are insured to drive that car.","להציג דיסק ביטוח מקורי (לבן עם פס ירוק משמאל; מציג מספר רישוי ותאריכי פוליסה). וגם להביא תעודת ביטוח תקפה שמציינת אותך כנהגת הרכב (דיגיטלי מותר). אם אינך מופיעה: התעודה + מכתב/מייל על נייר רשמי של חברת הביטוח שמאשר שאת מבוטחת לנהוג ברכב."],"src":"RSA-C p.3-4; RSA vehicle page (from 9 March 2026)"},{"id":"td05","deck":"days","type":"text","q":["Discs and plates on the car","דיסקים ושלטים ברכב"],"a":["Valid original insurance disc, valid original motor tax disc, valid NCT disc if applicable, and L-plates at the front and rear: red L on white, at least 15 cm high, with a border of at least 2 cm, not faded.","דיסק ביטוח מקורי ותקף, דיסק מס רכב מקורי ותקף, דיסק NCT תקף אם נדרש, ושלטי L מלפנים ומאחור: L אדום על לבן, גובה לפחות 15 ס\"מ, מסגרת לפחות 2 ס\"מ, לא דהויים."],"src":"RSA-C p.4; RSA vehicle page"},{"id":"td06","deck":"days","type":"text","q":["The statement you sign","ההצהרה שחותמים עליה"],"a":["You read a statement that the vehicle is roadworthy and the insurance cover is in place and adequate, and confirm it (under the 2026 RSA procedure the tester taps the confirmation on the tablet; the paper you sign is the Feedback Form). Tester's words: \"Would you please read this statement and confirm all is in order.\"","קוראים הצהרה שהרכב כשיר לנסיעה והכיסוי הביטוחי קיים ומספיק, ומאשרים (לפי נוהל ה-RSA מ-2026 הבוחן לוחץ את האישור בטאבלט; מה שחותמים עליו על נייר הוא ה-Feedback Form). דברי הבוחן: \"Would you please read this statement and confirm all is in order.\""],"src":"RSA-C p.4; RSA vehicle page; RSA Standard Procedures (Feb 2026) p.8"},{"id":"td07","deck":"days","type":"text","q":["Footwear","הנעלה"],"a":["Suitable shoes: no flip-flops, sandals, backless footwear or driving barefoot.","נעליים מתאימות: לא כפכפים, סנדלים, נעליים בלי עקב סגור, ולא נהיגה יחפה."],"src":"RSA-C p.3"},{"id":"td08","deck":"days","type":"text","q":["Who can be in the car?","מי יכול להיות ברכב?"],"a":["Only you and the tester (sometimes an RSA official observing the tester – you cannot opt out and they take no part in the assessment). No other passengers, no pets.","רק את והבוחן (לפעמים נציג RSA שמפקח על הבוחן – אי אפשר לסרב והוא לא משתתף בהערכה). אין נוסעים אחרים ואין חיות."],"src":"RSA-C p.3, p.5"},{"id":"td09","deck":"days","type":"text","q":["What must be true about the car?","מה צריך להיות נכון לגבי הרכב?"],"a":["Roadworthy; no dashboard warning lights; tyres legal and no bulges/cuts; clean windscreen with working wipers/washers; brake and indicator lights, handbrake and horn working; front passenger seat belt, head restraint, door and windows working; no loose objects; no smoke/vape smell; reasonably clean seats.","כשיר לנסיעה; בלי נורות אזהרה; צמיגים חוקיים בלי בליטות/חתכים; שמשה נקייה, מגבים/מרססים עובדים; אורות בלימה ואיתות, בלם יד וצופר תקינים; חגורה, משענת ראש, דלת וחלונות במושב הנוסע הקדמי תקינים; בלי חפצים רופפים; בלי ריח עישון/אידוי; מושבים נקיים יחסית."],"src":"RSA-C p.4-5"},{"id":"td10","deck":"days","type":"text","q":["No recording equipment","ציוד הקלטה"],"a":["No audio or visual recording during the test: remove dash-cams or power them off and make sure they are not recording.","אין הקלטת קול או וידאו במבחן: להוריד dashcam או לכבות ולוודא שאינו מקליט."],"src":"RSA-C p.5"},{"id":"td11","deck":"days","type":"text","q":["Hired car or ADI's car?","רכב שכור או רכב של המורה?"],"a":["Hire-agreement vehicles are generally not insured for a test: you need a stamped note from the hire company that it was hired with a valid Irish learner permit and is insured for a driving test. A car from an ADI is fine (an ADI can hire you one). Cars registered outside the State are not accepted.","רכבים בהסכם שכירות בדרך כלל לא מבוטחים למבחן: צריך מכתב מוחתם מחברת ההשכרה. רכב מ-ADI בסדר (מורה יכול להשכיר). רכבים שרשומים מחוץ לאירלנד לא מתקבלים."],"src":"RSA-C p.5; RSA FAQs"},{"id":"td12","deck":"days","type":"text","q":["Interpreter and special needs","מתורגמן ובקשות מיוחדות"],"a":["If English is not your first language you may bring an interpreter to the oral part, but you must tell the RSA when booking, otherwise the test won't go ahead and you lose the fee. Special accommodations must also be requested when booking.","אם אנגלית אינה שפת האם אפשר להביא מתורגמן לחלק בעל פה, אבל חייבים ליידע את ה-RSA בזמן ההזמנה, אחרת המבחן לא יתקיים והאגרה תלך לאיבוד. גם התאמות מיוחדות צריך לבקש בהזמנה."],"n":["The candidate reads English – this is only relevant if she wants an interpreter.","המועמדת קוראת אנגלית – רלוונטי רק אם רוצה מתורגמן."],"src":"RSA-B p.6-7"},{"id":"td13","deck":"days","type":"text","q":["Automatic or manual?","אוטומטי או ידני?"],"a":["You need not tell the RSA, but if you pass in an automatic your licence only allows automatics (code 78). Pass in a manual and you can drive both.","לא חייבים להודיע ל-RSA, אבל אם עוברים באוטומט הרישיון מתיר רק אוטומט (קוד 78). עוברים בידני – אפשר לנהוג בשניהם."],"src":"RSA FAQs; RSA vehicle page"},{"id":"td14","deck":"days","type":"text","q":["Rescheduling / cancelling","שינוי או ביטול מועד"],"a":["More than 10 days before: you can reschedule or cancel twice without losing the fee, via MyRoadSafety. If the RSA cancels (tester ill, weather) you get a free rebooking.","יותר מ-10 ימים מראש: אפשר לשנות/לבטל פעמיים בלי לאבד את האגרה, דרך MyRoadSafety. אם ה-RSA מבטל (בוחן חולה, מזג אוויר) מקבלים הזמנה חוזרת חינם."],"src":"RSA FAQs; RSA-C p.8"},{"id":"td15","deck":"days","type":"text","q":["Eyesight","ראייה"],"a":["I found no eyesight reading test at the test centre in the RSA material (eyesight is checked for the learner permit). Wear your glasses/contact lenses if you need them to drive.","לא מצאתי בחומרי ה-RSA בדיקת קריאת ראייה במרכז המבחנים (ראייה נבדקת בהוצאת ה-permit). מרכיבים משקפיים/עדשות אם צריך כדי לנהוג."],"n":["Unverified: UK tests read a number plate at 20 m; I did not find the same in RSA docs.","לא מאומת: במבחן הבריטי קוראים לוחית רישוי ב-20 מ'; לא מצאתי כך במסמכי ה-RSA."],"src":"Not in RSA test material (inferred)"},{"id":"td16","deck":"days","type":"text","q":["The declaration / documents routine in the room","שגרת המסמכים בחדר"],"a":["The tester checks your learner permit (valid, right category), you show the insurance certificate (since 9 March 2026) and confirm the declaration that the insurance is adequate and the vehicle roadworthy. Then the oral part at the desk: 14 questions – 6 Rules of the Road, 6 road signs, 2 hand signals.","הבוחן בודק את ה-learner permit (תקף, קטגוריה נכונה), את מראה את תעודת הביטוח (מאז 9 במרץ 2026) ומאשרת את ההצהרה שהביטוח מספק והרכב כשיר. אחר כך החלק בעל פה ליד השולחן: 14 שאלות – 6 על חוקי הדרך, 6 תמרורים, 2 סימני יד."],"n":["The RSA procedure confirms: desk first (permit, declaration, oral part), then the car. The 6 + 6 + 2 split is now official, not just instructor lore. Obligatory topics: pedestrian crossings, traffic lights, headlights (dipping), road markings, right of way, road signs.","נוהל ה-RSA מאשר: קודם השולחן (permit, הצהרה, חלק בעל פה) ואז הרכב. החלוקה 6 + 6 + 2 היא עכשיו רשמית ולא רק מפי מורים. נושאי חובה: מעברי חציה, רמזורים, אורות (dipping), סימוני כביש, זכות קדימה, תמרורים."],"src":"RSA-B p.7-8; RSA Standard Procedures (Feb 2026) p.5-11"},{"id":"td17","deck":"days","type":"text","q":["Airbag recall (if relevant)","ריקול כריות אוויר (אם רלוונטי)"],"a":["Certain Citroën C3 (2008–2017) and DS 3 (2009–2019) models have a safety recall: don't drive them until the airbag is replaced; use another car, reschedule, or show proof of repair.","לדגמי Citroën C3 (2008–2017) ו-DS 3 (2009–2019) מסוימים יש ריקול: לא לנהוג עד החלפת כרית האוויר; להשתמש ברכב אחר, לדחות מועד, או להציג הוכחת תיקון."],"src":"RSA vehicle page"},{"id":"td18","deck":"days","type":"text","q":["Attitude on the day","גישה ביום המבחן"],"a":["Nerves are normal. The tester is formal and gives no encouragement – that's the rule, not a bad sign. One mistake is usually just a minor fault. Keep going.","לחץ זה נורמלי. הבוחן רשמי ולא מעודד – זה הכלל ולא סימן רע. טעות אחת היא בדרך כלל ליקוי קל. ממשיכים."],"src":"RSA-B p.9"},{"id":"mv01","deck":"manoeuvres","type":"text","q":["How is the Irish test structured?","איך בנוי המבחן האירי?"],"a":["Total 50–100 min. Oral part (Rules of the Road, road signs) → practical: technical checks, in-car checks, secondary controls → about 8 km of driving in a variety of traffic with a reverse around a corner, a turnabout and a hill start.","סך הכל 50–100 דקות. חלק בעל פה (חוקי הדרך, תמרורים) ← חלק מעשי: בדיקות טכניות, בדיקות בתוך הרכב, בקרים משניים ← כ-8 ק\"מ נהיגה בתנאי תנועה שונים, עם נסיעה אחורה סביב פינה, turnabout ו-hill start."],"src":"RSA-B p.8 (\"Your test\")"},{"id":"mv02","deck":"manoeuvres","type":"text","q":["What does the tester assess while you drive?","מה הבוחן בודק בזמן הנהיגה?"],"a":["Moving off, driving in traffic, stopping/reversing around a corner, turning about, starting on a hill. Aspects: road position, overtaking and passing, anticipation and observation, use of mirrors and signals, progress and speed, compliance with lights/signs/markings, use of vehicle controls.","יציאה לדרך, נהיגה בתנועה, עצירה/נסיעה אחורה סביב פינה, turnabout, יציאה בעלייה. היבטים: מיקום בכביש, עקיפה ומעבר, צפייה וצפייה מוקדמת, שימוש במראות ובאיתות, התקדמות ומהירות, ציות לרמזורים/תמרורים/סימונים, שימוש בבקרי הרכב."],"src":"RSA-B p.8"},{"id":"mv03","deck":"manoeuvres","type":"text","q":["Moving off: what is the routine?","יציאה לדרך: מה השגרה?"],"a":["Mirrors, signal if needed, then a safety glance over your shoulder (blind spot), then move off when clear. \"Not looking around when moving off\" is a recorded observation fault.","מראות, איתות אם צריך, ואז safety glance מעל הכתף (שטח מת), ואז יוצאים כשפנוי. \"לא להסתכל מסביב ביציאה לדרך\" הוא ליקוי תצפית."],"src":"RSA-M p.8-9, p.22"},{"id":"mv04","deck":"manoeuvres","type":"text","q":["What is a \"safety glance\"?","מהו \"safety glance\"?"],"a":["The last check over the left or right shoulder to cover the blind spot that mirrors can't show, made just before a change of direction: moving off, changing lane, turning left or right, overtaking, at roundabouts.","הבדיקה האחרונה מעל הכתף השמאלית או הימנית כדי לכסות את השטח המת שהמראות לא מראות, ממש לפני שינוי כיוון: יציאה לדרך, החלפת נתיב, פנייה, עקיפה, בכיכרות."],"src":"RSA-M p.22"},{"id":"mv05","deck":"manoeuvres","type":"text","q":["Reverse around a corner: how is it done and judged?","נסיעה אחורה סביב פינה: איך עושים ואיך שופטים?"],"a":["For a car (Cat B): along the LEFT-hand kerb. Take direct observations (front, sides, rear, over both shoulders) throughout, give way to other traffic, go slowly. After the corner continue reversing straight for about 3 car lengths. Hitting/mounting the kerb, going off course, or excessive speed are faults. If you are out of position you may ask to repeat; if seriously out of position the tester may say \"it won't be necessary\".","ברכב פרטי (Cat B): לאורך המדרכה השמאלית. מבצעים תצפית ישירה (קדימה, צדדים, אחורה, מעל שתי הכתפיים) לאורך כל הדרך, נותנים זכות קדימה, בנסיעה איטית. אחרי הפינה ממשיכים ישר אחורה כ-3 אורכי רכב. פגיעה במדרכה/עלייה עליה, סטייה מהמסלול או מהירות גבוהה הם ליקויים. אם יצאתם ממקום אפשר לבקש לחזור; אם הרכב רחוק מאוד מהמקום הנכון, הבוחן עשוי לומר \"it won't be necessary\"."],"n":["A reversing camera/sensors are OK only in addition to your own observation.","מצלמה/חיישנים מותרים רק בנוסף לתצפית שלך."],"src":"RSA-M p.18-19"},{"id":"mv06","deck":"manoeuvres","type":"text","q":["Turnabout: what is it and what is marked?","Turnabout: מה זה ומה נבדק?"],"a":["Turning the car around in the road (a multi-point turn) competently: take observations, give way to others, no kerb hits, adequate progress, good control. Turning the steering wheel while stationary (\"dry steering\") is NOT penalised. Only one fault per aspect is recorded.","הפיכת הרכב בכביש (סיבוב רב-שלבי) בצורה מיומנת: תצפית, מתן זכות קדימה, בלי פגיעה במדרכה, התקדמות סבירה, שליטה טובה. סיבוב ההגה בעמידה (\"dry steering\") לא נענש. נרשם רק ליקוי אחד לכל היבט."],"src":"RSA-M p.19"},{"id":"mv07","deck":"manoeuvres","type":"text","q":["Hill start: what must you show?","Hill start: מה צריך להראות?"],"a":["Stop on a slope, secure the car with the handbrake (or electronic parking brake), find the bite point, check mirrors and blind spot, release smoothly and move off without rolling back. Rolling back is a vehicle-control fault; always secure the car with the parking brake when stopped.","עוצרים בשיפוע, מבטיחים את הרכב עם בלם היד (או בלם חניה חשמלי), מוצאים את נקודת האחיזה, בודקים מראות ושטח מת, משחררים חלק ויוצאים בלי להתגלגל לאחור. התגלגלות אחורה היא ליקוי בשליטה ברכב; תמיד מבטיחים את הרכב בבלם חניה כשעומדים."],"src":"RSA-B p.8, RSA-M p.15"},{"id":"mv20","deck":"manoeuvres","type":"text","q":["Road position on the straight","מיקום בכביש בנסיעה ישרה"],"a":["Drive reasonably close to the left side – about midway between the central dividing line and the left kerb. Don't weave around parked cars unnecessarily and don't drive too close to either side.","נוסעים קרוב לצד שמאל – בערך באמצע בין קו ההפרדה המרכזי למדרכה השמאלית. לא מתחמקים בין רכבים חונים שלא לצורך ולא נוסעים קרוב מדי לאף צד."],"src":"RSA-M p.5"},{"id":"mv08","deck":"manoeuvres","type":"text","q":["Roundabouts: what does the tester look for?","כיכרות: מה הבוחן בודק?"],"a":["Right approach lane (golden rule), mirrors, correct signals, yield to traffic from the right, observations before/on/exiting, stay in your lane (don't take the shortest route across lanes), exit in the left lane if clear, no kerb mounting.","נתיב התקרבות נכון (כלל הזהב), מראות, איתות נכון, מתן זכות קדימה לתנועה מימין, תצפית לפני/בתוך/ביציאה, להישאר בנתיב (לא לחתוך), לצאת בנתיב שמאל אם פנוי, בלי לעלות על מדרכה."],"src":"RSA-M p.6; RoR p.135-137"},{"id":"mv09","deck":"manoeuvres","type":"text","q":["Turning right at traffic lights – what do Irish testers expect?","פנייה ימינה ברמזור – מה הבוחנים באירלנד מצפים?"],"a":["If you are first at the lights turning right: on a full green, move into the junction and wait there for a gap in oncoming traffic (don't just wait behind the line). Waiting behind the line on green is a Grade 2 progress fault; missing the whole green/arrow sequence can be a Grade 3. If there is a green arrow, take it.","אם אתה ראשון ברמזור ופונה ימינה: בירוק מלא נכנסים לצומת וממתינים שם לרווח בתנועה הנגדית (לא רק מאחורי הקו). המתנה מאחורי הקו בירוק היא ליקוי התקדמות Grade 2; החמצת כל רצף הירוק/החץ יכולה להיות Grade 3. אם יש חץ ירוק – משתמשים בו."],"src":"RSA-M p.13-15 (Progress at Traffic Lights)"},{"id":"mv10","deck":"manoeuvres","type":"text","q":["Progress: what counts as too slow or too cautious?","התקדמות: מה נחשב איטי או זהיר מדי?"],"a":["Stopping short at a junction for no reason, stopping too far back from the car in front, waiting unnecessarily at a turn when there is a safe gap, driving too slowly on the straight, not taking an acceptable gap, slow progress on the approach to a turn the tester has directed.","עצירה מוקדמת בצומת בלי סיבה, עצירה רחוקה מדי מהרכב שלפניך, המתנה מיותרת בפנייה כשיש רווח בטוח, נסיעה איטית מדי בישר, אי ניצול רווח סביר, התקדמות איטית לקראת פנייה שהבוחן הורה."],"src":"RSA-M p.13"},{"id":"mv11","deck":"manoeuvres","type":"text","q":["Speed: when is speed a fault?","מהירות: מתי היא ליקוי?"],"a":["Exceeding the limit; or a speed not suited to the conditions on the approach to roundabouts, junctions, turns or traffic controls.","חריגה מהמגבלה; או מהירות לא מתאימה לתנאים בהתקרבות לכיכרות, צמתים, פניות או אמצעי בקרת תנועה."],"src":"RSA-M p.16"},{"id":"mv12","deck":"manoeuvres","type":"text","q":["Signals: what is marked?","איתות: מה נבדק?"],"a":["No signal, a late signal, not cancelling a signal, or a misleading signal (e.g. signalling left too early when there is an entrance before your turn; the wrong direction). Beckoning to other drivers is also a signal fault. Courtesy: letting a car emerge or turn right in slow traffic is fine.","חוסר איתות, איתות מאוחר, אי ביטול איתות, או איתות מטעה (למשל איתות שמאלה מוקדם מדי כשיש כניסה לפני הפנייה שלך; כיוון שגוי). סימון ידני לנהגים אחרים הוא גם ליקוי איתות. אדיבות: לתת לרכב לצאת או לפנות ימינה בתנועה איטית – מותר ורצוי."],"src":"RSA-M p.12-13"},{"id":"mv13","deck":"manoeuvres","type":"text","q":["Handbrake use: what can lose marks?","שימוש בבלם יד: מה עלול לגרום לליקוי?"],"a":["Not applying it on an incline/decline or when stopped for a while (where the car could roll); applying it before the car stops; driving off with it still on; not applying it at the end of the test.","אי הפעלה בעלייה/ירידה או כשעומדים זמן מה (כשהרכב עלול להתגלגל); הפעלה לפני שהרכב עצר; נסיעה כשהוא עדיין מופעל; אי הפעלה בסוף המבחן."],"src":"RSA-M p.15"},{"id":"mv14","deck":"manoeuvres","type":"text","q":["Steering, clutch and gears: what's a fault?","הגה, מצמד והילוכים: מה ליקוי?"],"a":["Both hands off the wheel at the same time or steering one-handed for a long distance; coasting (clutch down or neutral for a distance); sharp/jerky clutch use; resting your foot on the clutch; wrong gear for a long distance; changing gear without the clutch.","שתי ידיים מהגה בו-זמנית או הגה ביד אחת לאורך זמן; coasting (מצמד לחוץ/ניוטרל לאורך זמן); שימוש חד/מקפץ במצמד; רגל על המצמד; הילוך לא נכון לאורך זמן; החלפת הילוך בלי מצמד."],"src":"RSA-M p.15"},{"id":"mv15","deck":"manoeuvres","type":"text","q":["Automatic car: what is different?","רכב אוטומטי: מה שונה?"],"a":["If you pass in an automatic your licence is restricted to automatics (code 78); to drive a manual you must take the test again in a manual. Brake with the RIGHT foot in normal driving (left foot allowed only for slow manoeuvres in confined areas if done competently; if you keep using the left foot the tester may take you back).","אם עוברים באוטומט הרישיון מוגבל לאוטומט (קוד 78); כדי לנהוג בידני חייבים לעבור מבחן שוב בידני. בולמים ברגל ימין בנהיגה רגילה (רגל שמאל מותרת רק במניפולציות איטיות במקום צר אם נעשה היטב; אם ממשיכים בשמאל הבוחן עלול לחזור לתחנה)."],"src":"RSA vehicle page; RSA-M p.20"},{"id":"mv16","deck":"manoeuvres","type":"text","q":["Parking assist, cameras, dash-cams","חיישני חניה, מצלמות ו-dashcam"],"a":["\"Park Assist\" is not permitted. Reversing cameras/sensors may be used only in addition to the required observation. Dash-cams and other recording equipment must be removed or powered off (the car is the tester's workplace).","Park Assist אסור. מצלמה/חיישנים מותרים רק בנוסף לתצפית הנדרשת. dashcam וציוד הקלטה אחר חייבים להיות מוסרים או כבויים (הרכב הוא מקום העבודה של הבוחן)."],"src":"RSA-M p.19-20; RSA-C p.5"},{"id":"mv17","deck":"manoeuvres","type":"text","q":["Parking at the end of the test","חניה בסוף המבחן"],"a":["Park legally and safely: not on yellow lines, not on a footpath or causing an obstruction, not too far from the kerb. The tester may ask \"are you satisfied with your parking position?\" – if you move, a fault other than Grade 3 may be recorded. Apply the handbrake at the end.","חונים חוקית ובבטחה: לא על קווים צהובים, לא על מדרכה, לא חוסמים, לא רחוק מהמדרכה. הבוחן עשוי לשאול \"are you satisfied with your parking position?\" – אם זזים עלול להירשם ליקוי שאינו Grade 3. מפעילים בלם יד בסוף."],"n":["The RSA material I read lists no parallel/bay parking exercise for the car test (a fake summary mentioned one – ignore it).","בחומר ה-RSA שקראתי אין תרגיל חניה מקבילה/בשיפוע במבחן רכב (סיכום מומצא הזכיר – להתעלם)."],"src":"RSA-M p.20"},{"id":"mv18","deck":"manoeuvres","type":"text","q":["If you don't understand a direction – what do you do?","אם לא הבנתי הוראה – מה עושים?"],"a":["Just ask the tester to repeat it. This will not reflect negatively on your result. The tester gives no encouragement or advice during the test – that is normal and fair.","פשוט מבקשים מהבוחן לחזור עליה. זה לא ישפיע לרעה על התוצאה. הבוחן לא מעודד ולא נותן עצות במהלך המבחן – זה נורמלי והוגן."],"src":"RSA-B p.9"},{"id":"mv19","deck":"manoeuvres","type":"text","q":["Observation & clearance: what else is checked?","תצפית ומרווחים: מה עוד נבדק?"],"a":["Observation before moving off, overtaking, lane changes, junctions, roundabouts and turns; check the inside of an oncoming vehicle before turning right across it; allow enough clearance to cyclists, pedestrians and parked cars (more on a wet/windy day); don't overtake close to a junction or on a bend.","תצפית לפני יציאה, עקיפה, החלפת נתיב, צמתים, כיכרות ופניות; בדיקת הצד הפנימי של רכב נגדי לפני פנייה ימינה מולו; מרווח מספק מרוכבי אופניים, הולכי רגל ורכבים חונים (יותר ביום גשום/סוער); לא עוקפים ליד צומת או בעיקול."],"src":"RSA-M p.8-9, p.11-12"},{"id":"fl01","deck":"fails","type":"text","q":["Why do most people fail? (1) Observation","למה רוב הנכשלים נכשלים? (1) תצפית"],"a":["Inadequate observation moving off, at junctions, at roundabouts and when changing lanes.","תצפית לא מספקת ביציאה לדרך, בצמתים, בכיכרות ובהחלפת נתיב."],"src":"RSA-B p.10; RSA repeating-your-test page"},{"id":"fl02","deck":"fails","type":"text","q":["(2) Anticipation","(2) צפייה מוקדמת"],"a":["Failure to anticipate the actions of other drivers.","אי צפייה מראש לפעולות של נהגים אחרים."],"src":"RSA-B p.10"},{"id":"fl03","deck":"fails","type":"text","q":["(3) Road position","(3) מיקום בכביש"],"a":["Incorrect road position on the straight, on bends, turning left, turning right, at roundabouts and when overtaking.","מיקום שגוי בכביש: בישר, בעיקולים, בפנייה שמאלה/ימינה, בכיכרות ובעקיפה."],"src":"RSA-B p.10"},{"id":"fl04","deck":"fails","type":"text","q":["(4) Progress","(4) התקדמות"],"a":["Inadequate progress at junctions, roundabouts, on the straight and when overtaking.","התקדמות לא מספקת בצמתים, בכיכרות, בישר ובעקיפה."],"src":"RSA-B p.10"},{"id":"fl05","deck":"fails","type":"text","q":["(5) Mirrors and signals","(5) מראות ואיתות"],"a":["Incorrect, inadequate or inappropriate use of mirrors and signals.","שימוש שגוי, לא מספק או לא הולם במראות ובאיתות."],"src":"RSA-B p.10"},{"id":"fl06","deck":"fails","type":"text","q":["(6) Traffic controls","(6) אמצעי בקרת תנועה"],"a":["Non-compliance with traffic controls: road signs, road markings and traffic lights.","אי ציות לתמרורים, סימוני כביש ורמזורים."],"src":"RSA-B p.10"},{"id":"fl07","deck":"fails","type":"text","q":["(7) Vehicle controls","(7) בקרי הרכב"],"a":["Incorrect, inadequate or inappropriate use of gears, clutch, accelerator, steering, handbrake, footbrake and secondary controls.","שימוש שגוי, לא מספק או לא הולם בהילוכים, מצמד, דוושת גז, הגה, בלם יד, בלם ובקרים משניים."],"src":"RSA-B p.10"},{"id":"fl08","deck":"fails","type":"text","q":["(8) Speed","(8) מהירות"],"a":["Excessive speed for the road or traffic conditions.","מהירות מופרזת לתנאי הכביש או התנועה."],"src":"RSA-B p.10"},{"id":"fl09","deck":"fails","type":"text","q":["(9) Right of way","(9) זכות קדימה"],"a":["Failure to yield the right of way to others.","אי מתן זכות קדימה לאחרים."],"src":"RSA-B p.10"},{"id":"fl10","deck":"fails","type":"text","q":["(10) Reverse and turnabout","(10) נסיעה אחורה ו-turnabout"],"a":["Lack of competence in the reverse and turnabout (U-turn) manoeuvres.","חוסר מיומנות בנסיעה אחורה סביב פינה ובסיבוב (turnabout)."],"src":"RSA-B p.10"},{"id":"fl11","deck":"fails","type":"text","q":["How are faults graded?","איך מדרגים ליקויים?"],"a":["Grade 2 = a serious fault. Grade 3 = dangerous / potentially dangerous, or total disregard of traffic controls. Faults that are only slight (0–35% on the marking scale) are not recorded at all.","Grade 2 = ליקוי חמור. Grade 3 = מסוכן/פוטנציאלית מסוכן, או התעלמות מוחלטת מאמצעי בקרה. ליקויים קלים בלבד (0–35% בסקאלת הסימון) לא נרשמים כלל."],"src":"RSA-M p.4 (RSA marking guidelines)"},{"id":"fl12","deck":"fails","type":"text","q":["When do you FAIL?","מתי נכשלים?"],"a":["Any of: 1 or more Grade 3 faults; 4 of the same Grade 2 fault for a single aspect; 6 or more Grade 2 faults under the same heading; 9 or more Grade 2 faults overall.","כל אחד מאלה: ליקוי Grade 3 אחד או יותר; 4 ליקויי Grade 2 זהים באותו היבט; 6 ליקויי Grade 2 או יותר תחת אותה כותרת; 9 ליקויי Grade 2 או יותר בסך הכל."],"n":["So up to 8 Grade 2 faults can still be a pass if none of the other limits is hit.","כלומר עד 8 ליקויי Grade 2 עדיין יכולים להיות מעבר אם לא חורגים מהמגבלות האחרות."],"src":"RSA-M p.4 (RSA marking guidelines)"},{"id":"fl13","deck":"fails","type":"text","q":["If I get the oral (room) questions wrong, do I fail?","אם אטעה בשאלות בעל פה – אכשל?"],"a":["No. Wrong answers on Rules/Hand signals/technical checks only matter if you get 3 or more wrong or unanswered – then ONE Grade 2 fault is recorded (never more than one, never a Grade 3). Fewer than 3 wrong = no mark.","לא. תשובות שגויות על חוקים/סימני יד/בדיקות טכניות משפיעות רק אם 3 או יותר שגויות/לא נענו – אז נרשם ליקוי Grade 2 אחד (לעולם לא יותר מאחד ולא Grade 3). פחות מ-3 טעויות = אין סימון."],"src":"RSA-M p.5, p.24"},{"id":"fl14","deck":"fails","type":"text","q":["What if the tester gets worried and stops the test?","מה אם הבוחן עוצר את המבחן?"],"a":["The test is stopped if the car fails any requirement (before or during), or if you can't proceed. You must then book another test and pay the fee again. A dangerous (Grade 3) fault is an automatic fail.","המבחן נעצר אם הרכב לא עומד בדרישה כלשהי (לפני או במהלכו) או אם אי אפשר להמשיך. אז צריך להזמין מבחן חדש ולשלם שוב. ליקוי Grade 3 = כישלון אוטומטי."],"src":"RSA-C p.8; RSA-M p.4"},{"id":"fl15","deck":"fails","type":"text","q":["What are the most common reasons a test does NOT go ahead?","מהן הסיבות הנפוצות שבגללן מבחן לא מתקיים?"],"a":["An invalid or wrong-category learner permit; a fault with the test vehicle; incorrect documentation; arriving late; arriving at the wrong time or centre. You lose the fee and must rebook.","permit לא תקף או בקטגוריה שגויה; תקלה ברכב; מסמכים שגויים; איחור; הגעה בשעה/מרכז שגויים. מפסידים את האגרה וצריך להזמין מחדש."],"src":"RSA-C p.3"},{"id":"fl16","deck":"fails","type":"text","q":["If I fail – what then?","אם נכשלתי – מה עושים?"],"a":["The tester gives a statement of driving test outcome and goes through the main points. Re-apply on MyRoadSafety and you'll be invited to book when your place in the queue is reached. You can appeal to the District Court (Road Traffic Act 1961) or complain via the RSA online form within 3 months.","הבוחן נותן הצהרת תוצאה וסוקר את הנקודות העיקריות. נרשמים מחדש ב-MyRoadSafety ויזמינו אותך לקבוע מועד כשתגיע שורתך בתור. אפשר לערער לבית משפט מחוזי (Road Traffic Act 1961) או להגיש תלונה בטופס המקוון של ה-RSA תוך 3 חודשים."],"n":["the project note says a 15-day wait after a fail – I did not find that on the RSA pages; check at myroadsafety.ie.","ברשומת הפרויקט כתוב 15 ימי המתנה אחרי כישלון – לא מצאתי זאת בדפי ה-RSA; לבדוק ב-myroadsafety.ie."],"src":"RSA-B p.10; RSA repeating-your-test page"}],"decks":[{"id":"sim","icon":"🎙️","name":["Test simulation, step by step","סימולציית המבחן צעד אחר צעד"]},{"id":"room","icon":"🗣️","name":["Room questions (Rules of the Road)","שאלות בחדר (חוקי הדרך)"]},{"id":"signs","icon":"🛑","name":["Road signs","תמרורים"]},{"id":"marks","icon":"🛣️","name":["Road markings","סימוני כביש"]},{"id":"hands","icon":"✋","name":["Hand signals","סימני יד"]},{"id":"checks","icon":"🔧","name":["Car checks (show me / tell me)","בדיקות טכניות ברכב"]},{"id":"secondary","icon":"🎛️","name":["Secondary controls","בקרים משניים"]},{"id":"days","icon":"📋","name":["Test day & documents","יום המבחן ומסמכים"]},{"id":"manoeuvres","icon":"🔄","name":["Test structure & manoeuvres","מבנה המבחן ותמרונים"]},{"id":"fails","icon":"⚠️","name":["Why people fail","למה נכשלים"]}]}</script>
<script>
'use strict';
/* RSA driving-test trainer - core: data, storage, i18n, helpers */
const KEY_ = 'rsa-trainer-v1', KEY = KEY_;
const DATA = JSON.parse(document.getElementById('data').textContent);
const CARDS = DATA.cards, DECKS = DATA.decks, BYID = {};
CARDS.forEach(c => { BYID[c.id] = c; });
const REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* storage adapter: window.storage (Claude.ai artifact, async) -> localStorage -> memory. Never throws. */
const store = (() => {
  const cache = {}; let backend = 'memory', art = null;
  const withTimeout = (p, ms) => Promise.race([Promise.resolve(p), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
  return {
    get persistent() { return backend !== 'memory'; },
    get backend() { return backend; },
    async init() {
      try {
        const ws = window.storage;
        if (ws && typeof ws.get === 'function' && typeof ws.set === 'function') {
          try { const r = await withTimeout(ws.get(KEY_), 2500); art = ws; backend = 'artifact'; if (r && r.value != null) cache[KEY_] = r.value; return; } catch (e) { /* try next */ }
        }
      } catch (e) { /* ignore */ }
      try {
        const ls = window.localStorage; ls.setItem('__t', '1'); ls.removeItem('__t');
        backend = 'local'; const v = ls.getItem(KEY_); if (v != null) cache[KEY_] = v;
      } catch (e) { backend = 'memory'; }
    },
    get(k) { return k in cache ? cache[k] : null; },
    set(k, v) {
      cache[k] = v;
      try {
        if (backend === 'artifact') { const p = art.set(k, v); if (p && p.catch) p.catch(() => { }); }
        else if (backend === 'local') window.localStorage.setItem(k, v);
      } catch (e) { /* ignore: memory copy stays */ }
    }
  };
})();
function loadState() {
  let o = null;
  try { o = JSON.parse(store.get(KEY) || 'null'); } catch (e) { o = null; }
  const d = { lang: 'he', xp: 0, streak: { last: '', n: 0, max: 0 }, cards: {}, badges: {}, exams: [], tts: false, rate: 1, answered: 0, correct: 0, bestCombo: 0 };
  return Object.assign(d, o && typeof o === 'object' ? o : {});
}
let ST = loadState();
const save = () => { try { store.set(KEY, JSON.stringify(ST)); } catch (e) { /* ignore */ } };

/* i18n */
const T = {

  show: ['Show answer', 'הצג תשובה'],
  again: ['Again', 'שוב'], hard: ['Hard', 'קשה'], good: ['Good', 'טוב'], easy: ['Easy', 'קל'],
  correct: ['Correct!', 'נכון!'], wrong: ['Not quite', 'לא בדיוק'],

  noStore: ['This page cannot save to the device here, so progress lasts until you close it. Use "Copy progress code" to keep it.', 'הדף לא יכול לשמור במכשיר כאן, אז ההתקדמות נשמרת עד לסגירת הדף. אפשר להשתמש ב"העתקת קוד התקדמות".'],

const cardProg = id => (ST.cards[id] ? Math.min(ST.cards[id].b, 2) / 2 : 0);

  const cs = deckCards(d); let p = 0, due = 0;
  cs.forEach(c => { p += cardProg(c.id); if (isDue(c.id)) due++; });

    correct = c.name;

    if (pool.length < 3) pool = CARDS.filter(x => x.id !== c.id && x.name && x.type === c.type && x.name[0] !== c.name[0]);
    wrongs = shuffle(pool).slice(0, 3).map(x => x.name);

}

const TTS = {
  ok: !!(window.speechSynthesis && window.SpeechSynthesisUtterance),
  voice(lang) {
    const vs = speechSynthesis.getVoices() || [];
    const pref = lang === 'he' ? ['he-IL', 'he'] : ['en-IE', 'en-GB', 'en-US', 'en'];
    for (const p of pref) { const v = vs.find(x => x.lang && x.lang.replace('_', '-').toLowerCase().startsWith(p.toLowerCase())); if (v) return v; }
    return null;
  },
  say(text, lang) {
    if (!this.ok) { toast(t('noTts')); return; }
    try {
      speechSynthesis.cancel();
      const clean = String(text).replace(/[←-⇿☀-➿\u{1F300}-\u{1FAFF}]/gu, ' ').replace(/\s+/g, ' ').trim();
      if (!clean) return;
      const u = new SpeechSynthesisUtterance(clean);
      u.lang = lang === 'he' ? 'he-IL' : 'en-IE'; u.rate = ST.rate || 1;
      const v = this.voice(lang);
      if (v) { u.voice = v; u.lang = v.lang; } else if ((speechSynthesis.getVoices() || []).length) toast(t('noVoice'));
      speechSynthesis.speak(u);
    } catch (e) { /* ignore */ }
  },
  stop() { try { if (this.ok) speechSynthesis.cancel(); } catch (e) { /* ignore */ } }
};

}

function viewBadges() {
  const acc = ST.answered ? Math.round(100 * ST.correct / ST.answered) : 0, ms = CARDS.filter(c => isMastered(c.id)).length;
  let h = '<h2 class="h">🏅 ' + esc(t('badges')) + '</h2><div class="kpis"><div><b>' + ST.answered + '</b><small>' + esc(t('answered')) + '</small></div><div><b>' + acc + '%</b><small>' + esc(t('accuracy')) + '</small></div><div><b>' + ms + '/' + CARDS.length + '</b><small>' + esc(t('mastered')) + '</small></div><div><b>' + ST.bestCombo + '</b><small>' + esc(t('bestCombo')) + '</small></div></div>';
  h += '<div class="bgrid">' + BADGES.map(b => { const got = !!ST.badges[b[0]]; return '<div class="badge' + (got ? ' got' : '') + '"><span class="bi">' + (got ? b[1] : '🔒') + '</span><b>' + esc(pick(b[2], ST.lang)) + '</b><small>' + esc(pick(b[3], ST.lang)) + '</small></div>'; }).join('') + '</div>';
  h += '<h3 class="h">' + esc(t('exams')) + '</h3>' + (ST.exams.length ? '<ul class="hist">' + ST.exams.slice(-8).reverse().map(e => '<li>' + new Date(e.t).toLocaleDateString() + ' - <b>' + e.score + '/' + e.total + '</b></li>').join('') + '</ul>' : '<p class="muted">' + esc(t('noExams')) + '</p>');
  h += '<h3 class="h">' + esc(t('mastered')) + '</h3>' + DECKS.map(d => { const s = deckStats(d.id); return '<div class="drow"><span>' + d.icon + ' ' + esc(pick(d.name, ST.lang)) + '</span><b>' + s.pct + '%</b></div>' + bar(s.pct); }).join('');
  return h;
}
function viewSettings() {
  return '<h2 class="h">⚙️ ' + esc(t('settings')) + '</h2>' +
    '<label class="set"><span>' + esc(t('autoRead')) + '</span><input type="checkbox" id="autoread"' + (ST.tts ? ' checked' : '') + '></label>' +
    '<div class="set"><span>' + esc(t('rate')) + '</span><span class="seg">' + [0.8, 1, 1.2].map(r => '<button class="' + (ST.rate === r ? 'on' : '') + '" data-act="rate" data-r="' + r + '">' + r + 'x</button>').join('') + '</span></div>' +
    '<div class="actions"><button class="btn" data-act="testvoice"><b>🔊 ' + esc(t('testVoice')) + '</b></button><button class="btn" data-act="export"><b>📋 ' + esc(t('export')) + '</b></button></div>' +
    '<textarea id="code" class="code" rows="3" placeholder="' + esc(t('importPh')) + '" dir="ltr"></textarea><div class="actions"><button class="btn" data-act="import"><b>♻️ ' + esc(t('import')) + '</b></button><button class="btn danger" data-act="reset"><b>🗑 ' + esc(t('reset')) + '</b></button></div>' +
    (store.persistent ? '' : '<p class="warn">' + esc(t('noStore')) + '</p>') + '<p class="muted small">' + esc(t('inferred')) + '</p>';
}

function render() {
  const r = document.documentElement; r.lang = ST.lang; r.dir = dirOf(ST.lang);
  let body = '';
  switch (VIEW.screen) {
    case 'deck': body = viewDeck(); break;
    case 'study': body = viewStudy(); break;
    case 'result': body = viewResult(); break;
    case 'browse': body = viewBrowse(); break;
    case 'badges': body = viewBadges(); break;
    case 'settings': body = viewSettings(); break;
    default: body = viewHome();
  }
  $('#app').innerHTML = header() + '<main class="main">' + body + '</main>';
  window.scrollTo(0, 0);
}

/* study sessions, exam, events */
function prio(c) {
  const s = ST.cards[c.id];
  if (!s || !s.s) return 2;           /* new */
  if (isDue(c.id) && s.b < 2) return 0; /* weak and due */
  if (isDue(c.id)) return 1;
  return s.b < 2 ? 1.5 : 3;
}
function pickIds(pool, n) {
  const sorted = shuffle(pool).sort((a, b) => prio(a) - prio(b));
  return shuffle(sorted.slice(0, n)).map(c => c.id);
}
function buildExam() {
  const room = CARDS.filter(c => c.deck === 'room' && hasMC(c));
  const of = ty => CARDS.filter(c => c.type === ty);
  return shuffle(shuffle(room).slice(0, 10).concat(shuffle(of('sign')).slice(0, 4), shuffle(of('mark')).slice(0, 3), shuffle(of('hand')).slice(0, 3))).map(c => c.id);
}
function startSession(kind, deck, mode) {
  let ids;
  if (kind === 'daily') ids = pickIds(CARDS, 20);
  else if (kind === 'exam') ids = buildExam();
  else if (deck === 'sim') ids = deckCards('sim').map(c => c.id);
  else ids = pickIds(deckCards(deck), 15);
  SES = { kind, deck, mode: mode || 'quiz', queue: ids, i: 0, combo: 0, xp: 0, right: 0, wrong: 0, log: [], retried: {}, lvl0: levelOf(ST.xp).i, answeredIds: {} };
  VIEW.screen = 'study';
  showCard();
}
function showCard() {
  const c = BYID[SES.queue[SES.i]];
  VIEW.cardLang = null;
  const wantMC = SES.kind === 'exam' || SES.mode === 'quiz';
  SES.cur = { mc: wantMC && hasMC(c) ? optionsFor(c) : null, picked: null, revealed: false, gain: 0, shake: false };
  render();
  if (ST.tts) { if (c.type === 'sim') TTS.say(c.say, 'en'); else TTS.say(qText(c, clang()), clang()); }
}
function mult(combo) { return combo >= 10 ? 3 : combo >= 6 ? 2 : combo >= 3 ? 1.5 : 1; }
function record(g) {
  const id = SES.queue[SES.i], ok = g >= 1, first = !SES.answeredIds[id];
  SES.answeredIds[id] = 1;
  applyGrade(id, g);
  if (first) { ST.answered++; if (ok) ST.correct++; }
  touchStreak();
  let gain = 0;
  if (SES.kind !== 'exam') {
    if (g === 0) SES.combo = 0;
    else if (g === 1) gain = first ? 4 : 0;
    else { SES.combo++; gain = first ? Math.round(10 * mult(SES.combo)) + (g === 3 ? 2 : 0) : 2; }
    ST.bestCombo = Math.max(ST.bestCombo, SES.combo);
    ST.xp += gain; SES.xp += gain;
  }
  if (first) { if (ok) SES.right++; else SES.wrong++; SES.log.push({ id, ok }); } else if (ok) { const e = SES.log.find(x => x.id === id); if (e && !e.ok) { /* stays a mistake for review */ } }
  if (g === 0 && !SES.retried[id] && SES.kind !== 'exam') { SES.retried[id] = 1; SES.queue.splice(Math.min(SES.i + 4, SES.queue.length), 0, id); }
  return { gain, ok };
}
function afterRecord(res) {
  const lvl = levelOf(ST.xp).i, newBadges = checkBadges();
  save();
  if (res.ok) confetti(SES.combo && SES.combo % 5 === 0 ? 40 : 8);
  if (lvl > SES.lvl0) { SES.lvl0 = lvl; confetti(70); toast('🎊 ' + t('levelUp') + ' ' + pick(levelOf(ST.xp).name, ST.lang), 3600); }
  newBadges.forEach(b => { confetti(40); toast(b[1] + ' ' + t('newBadge') + ': ' + pick(b[2], ST.lang), 3600); });
}
function pickAnswer(k) {
  const cur = SES.cur; if (cur.picked != null) return;
  cur.picked = k;
  const ok = k === cur.mc.ok;
  if (SES.kind === 'exam') {
    record(ok ? 2 : 0); save();
    render();
    setTimeout(() => { if (SES && SES.kind === 'exam') nextCard(); }, 350);
    return;
  }
  const res = record(ok ? 2 : 0);
  cur.gain = res.gain; cur.shake = !ok; cur.revealed = true;
  afterRecord(res);
  render();
  if (ST.tts) { const c = BYID[SES.queue[SES.i]]; TTS.say(c.name ? pick(c.name, clang()) + '. ' + pick(c.mean, clang()) : pick(c.a, clang()), clang()); }
}
function gradeCard(g) {
  const res = record(g);
  afterRecord(res);
  nextCard();
}
function nextCard() {
  TTS.stop();
  SES.i++;
  if (SES.i >= SES.queue.length) return finishSession();
  showCard();
}
function finishSession() {
  const total = SES.right + SES.wrong;
  let xp = SES.xp, pass = false;
  if (SES.kind === 'exam') {
    xp = SES.right * 5 + (SES.wrong === 0 ? 50 : 0);
    ST.xp += xp; pass = SES.right >= 16;
    ST.exams.push({ t: Date.now(), score: SES.right, total });
  } else if (total && SES.wrong === 0) { xp += 20; ST.xp += 20; }
  const lvl = levelOf(ST.xp).i, nb = checkBadges();
  save();
  SES.result = { right: SES.right, total, xp, pass };
  VIEW.screen = 'result';
  render();
  confetti(pass || SES.wrong === 0 ? 60 : 16);
  if (lvl > SES.lvl0) toast('🎊 ' + t('levelUp') + ' ' + pick(levelOf(ST.xp).name, ST.lang), 3600);
  nb.forEach(b => toast(b[1] + ' ' + t('newBadge') + ': ' + pick(b[2], ST.lang), 3600));
}

/* events */
const speakCard = () => {
  if (!SES || VIEW.screen !== 'study') return;
  const c = BYID[SES.queue[SES.i]], L = clang(), cur = SES.cur;
  let txt = qText(c, L);
  if (c.type === 'sim' && !cur.revealed) { TTS.say(c.say, 'en'); return; }
  if (cur.mc && cur.picked == null) txt += '. ' + cur.mc.opts.map(o => pick(o, L)).join('. ');
  if (cur.revealed || (cur.mc && cur.picked != null && SES.kind !== 'exam')) txt = c.name ? pick(c.name, L) + '. ' + pick(c.mean, L) : pick(c.a, L) + (c.ans ? '. ' + pick(c.ans, L) : '');
  TTS.say(txt, L);
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  switch (a) {
    case 'home': TTS.stop(); SES = null; VIEW.screen = 'home'; render(); break;
    case 'lang': ST.lang = ST.lang === 'he' ? 'en' : 'he'; VIEW.cardLang = null; save(); render(); break;
    case 'cflip': VIEW.cardLang = clang() === 'he' ? 'en' : 'he'; render(); break;
    case 'settings': VIEW.screen = 'settings'; render(); break;
    case 'badges': VIEW.screen = 'badges'; render(); break;
    case 'deck': VIEW.deck = el.dataset.id; VIEW.screen = 'deck'; render(); break;
    case 'simulate': startSession('deck', 'sim', 'flip'); break;
    case 'daily': startSession('daily', null, 'quiz'); break;
    case 'exam': startSession('exam', null, 'quiz'); break;
    case 'practice': startSession('deck', VIEW.deck, 'quiz'); break;
    case 'flashdeck': startSession('deck', VIEW.deck, 'flip'); break;
    case 'browse': VIEW.filter = ''; VIEW.screen = 'browse'; render(); break;
    case 'again2': startSession(SES.kind, SES.deck, SES.mode); break;
    case 'pick': pickAnswer(+el.dataset.i); break;
    case 'reveal': SES.cur.revealed = true; render(); if (ST.tts) speakCard(); break;
    case 'grade': gradeCard(+el.dataset.g); break;
    case 'next': nextCard(); break;
    case 'speak': speakCard(); break;
    case 'speakid': { const c = BYID[el.dataset.id]; TTS.say(c.name ? pick(c.name, ST.lang) + '. ' + pick(c.mean, ST.lang) : pick(c.a, ST.lang), ST.lang); break; }
    case 'rate': ST.rate = +el.dataset.r; save(); render(); break;
    case 'testvoice': TTS.say(ST.lang === 'he' ? 'שלום, בהצלחה במבחן הנהיגה' : 'Hello, good luck with the driving test', ST.lang); break;
    case 'export': {
      const code = btoa(unescape(encodeURIComponent(JSON.stringify(ST))));
      const box = $('#code'); if (box) { box.value = code; box.select(); }
      try { navigator.clipboard.writeText(code).then(() => toast(t('copied')), () => { }); } catch (err) { /* ignore */ }
      break;
    }
    case 'import': {
      try { const o = JSON.parse(decodeURIComponent(escape(atob($('#code').value.trim())))); if (!o || typeof o.xp !== 'number' || !o.cards) throw 0; ST = Object.assign(loadState(), o); save(); toast(t('restored')); render(); } catch (err) { toast(t('badCode')); }
      break;
    }
    case 'reset': if (confirm(t('resetAsk'))) { ST = Object.assign(loadState(), { xp: 0, streak: { last: '', n: 0, max: 0 }, cards: {}, badges: {}, exams: [], answered: 0, correct: 0, bestCombo: 0, lang: ST.lang }); save(); render(); } break;
  }
});
document.addEventListener('change', e => { if (e.target.id === 'autoread') { ST.tts = e.target.checked; save(); if (ST.tts && !TTS.ok) toast(t('noTts')); } });
document.addEventListener('input', e => {
  if (e.target.id === 'flt') { VIEW.filter = e.target.value; const p = e.target.selectionStart; render(); const f = $('#flt'); if (f) { f.focus(); try { f.setSelectionRange(p, p); } catch (err) { /* ignore */ } } }
});
document.addEventListener('keydown', e => {
  if (VIEW.screen !== 'study' || !SES || /INPUT|TEXTAREA/.test((e.target.tagName || ''))) return;
  if (e.key === 'Enter' || e.key === ' ') { const cur = SES.cur; if (cur.mc && cur.picked != null && SES.kind !== 'exam') { e.preventDefault(); nextCard(); } else if (!cur.mc && !cur.revealed) { e.preventDefault(); cur.revealed = true; render(); } }
  if (/^[1-4]$/.test(e.key) && SES.cur.mc && SES.cur.picked == null) pickAnswer(+e.key - 1);
});
window.addEventListener('error', () => { /* keep UI alive */ });
(async () => { try { await store.init(); ST = loadState(); } catch (e) { /* defaults */ } render(); })();

</script>
