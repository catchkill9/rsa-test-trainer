 כשמחליפים נתיב, תנועה בדרך ציבורית כשיוצאים מכניסה פרטית"],"w":[["Only vehicles bigger than yours","רק רכבים גדולים משלך"],["Only traffic coming from your left","רק תנועה שמגיעה משמאלך"],["Nobody, if you signalled first","אף אחד, אם אותתת קודם"]],"src":"RoR p.128"},{"id":"r80","deck":"room","type":"room","q":["What is the correct procedure when overtaking?","מהו הנוהל הנכון לעקיפה?"],"a":["Make sure the road ahead is clear for the whole manoeuvre; never directly follow another overtaking vehicle; give way to faster traffic already overtaking from behind; check mirror and blind spot, signal in good time, move out, accelerate and overtake with minimum delay; when well past, check the mirror, signal and move in gradually. You must not break the speed limit, even when overtaking.","מוודאים שהכביש פנוי לכל אורך העקיפה; לא נצמדים לרכב אחר שעוקף; נותנים זכות קדימה לרכב מהיר שכבר עוקף מאחור; בודקים מראה ושטח מת, מאותתים בזמן, יוצאים, מאיצים ועוקפים במינימום עיכוב; כשעברנו היטב – מראה, איתות וחוזרים בהדרגה. אסור לעבור את מגבלת המהירות גם בעקיפה."],"s":["Be sure the road ahead is clear, check mirror and blind spot, signal, overtake on the right, return left without cutting in; never follow another overtaker","לוודא שהדרך פנויה, מראה ושטח מת, איתות, עוקפים מימין, חוזרים שמאלה בלי לחתוך; לא נצמדים לרכב שעוקף"],"w":[["Overtake close to a bend to save time","עוקפים ליד עיקול כדי לחסוך זמן"],["Flash your lights and expect the car ahead to pull over","מהבהבים והרכב שלפנינו אמור לפנות דרך"],["Follow the car ahead that is already overtaking","נצמדים לרכב שלפנינו שכבר עוקף"]],"src":"RoR p.56-57"},{"id":"r81","deck":"room","type":"room","q":["You see red tail lights in front of you at night. What should you do with your headlights?","בלילה את רואה אורות אדומים לפניך. מה עושים עם האורות שלך?"],"a":["Dip your headlights so you do not dazzle the driver ahead. Also don't \"drive on the tail lights\" of the vehicle in front: it gives a false sense of security and may lure you into driving too close or too fast.","מנמיכים את האורות כדי לא לסנוור את הנהג שלפניך. וגם לא \"נוסעים על האורות האחוריים\" של הרכב שלפניך: זה נותן תחושת ביטחון כוזבת ועלול להוביל לנסיעה קרובה או מהירה מדי."],"s":["Dip them","להנמיך"],"w":[["Switch to full beam to see further","לעבור לאורות גבוהים כדי לראות רחוק"],["Switch off the headlights","לכבות את האורות"],["Flash them to warn the driver","להבהב כדי להזהיר את הנהג"]],"src":"RoR p.65"},{"id":"sg01","deck":"signs","type":"sign","q":["What is this sign? What must you do?","איזה תמרור זה? מה צריך לעשות?"],"name":["Stop","עצור (Stop)"],"mean":["Red octagon – the only regulatory sign with this shape. Stop completely at the sign or the stop line, even if the road looks empty, then give way to traffic on the major road.","מתומן אדום – התמרור היחיד בצורה הזו. עוצרים לגמרי בתמרור או בקו העצירה גם אם הכביש נראה ריק, ואז נותנים זכות קדימה לתנועה בדרך הראשית."],"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003cpolygon points=\"92.5,67.6 67.6,92.5 32.4,92.5 7.5,67.6 7.5,32.4 32.4,7.5 67.6,7.5 92.5,32.4\" fill=\"#d71920\" stroke=\"#fff\" stroke-width=\"3\"/>\u003cpolygon points=\"92.5,67.6 67.6,92.5 32.4,92.5 7.5,67.6 7.5,32.4 32.4,7.5 67.6,7.5 92.5,32.4\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" transform=\"translate(50 50) scale(.9) translate(-50 -50)\"/>\u003ctext x=\"50\" y=\"60\" text-anchor=\"middle\" font-family=\"Arial,Helvetica,sans-serif\" font-weight=\"700\" font-size=\"27\" fill=\"#fff\" >STOP\u003c/text>\u003c/svg>","cat":"reg","src":"RoR p.70"},{"id":"sg02","deck":"signs","type":"sign","q":["What is this sign? What must you do?","איזה תמרור זה? מה צריך לעשות?"],"name":["Yield (Géill Slí)","תן זכות קדימה (Yield / Géill Slí)"],"mean":["Inverted triangle with a red border. Slow down and give way to traffic on the major road or roundabout; you stop only if you need to wait.","משולש הפוך עם מסגרת אדומה. מאטים ונותנים זכות קדימה לתנועה בדרך הראשית או בכיכר; עוצרים רק אם צריך להמתין."],"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003cpolygon points=\"8,12 92,12 50,88\" fill=\"#fff\" stroke=\"#d71920\" stroke-width=\"9\" stroke-linejoin=\"round\"/>\u003ctext x=\"50\" y=\"38\" text-anchor=\"middle\" font-family=\"Arial,Helvetica,sans-serif\" font-weight=\"700\" font-size=\"14\" fill=\"#111\" >YIELD\u003c/text>\u003c/svg>","cat":"reg","src":"RoR p.70"},{"id":"sg03","deck":"signs","type":"sign","q":["What is this sign? What must you do?","איזה תמרור זה? מה צריך לעשות?"],"name":["No entry","אין כניסה (No entry)"],"mean":["Red disc with a white bar. You must not enter this road from where you are (e.g. the exit of a one-way street).","עיגול אדום עם פס לבן. אסור להיכנס לכביש הזה מהכיוון שבו אתה נמצא (למשל יציאה מרחוב חד-סטרי)."],"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003ccircle cx=\"50\" cy=\"50\" r=\"46\" fill=\"#d71920\"/>\u003crect x=\"20\" y=\"43\" width=\"60\" height=\"14\" fill=\"#fff\"/>\u003c/svg>","cat":"reg","src":"RoR p.68"},{"id":"sg04","deck":"signs","type":"sign","q":["What is this sign? What must you do?","איזה תמרור זה? מה צריך לעשות?"],"name":["Pedestrianised street – no entry to vehicles","רחוב הולכי רגל – אין כניסה לרכבים"],"mean":["Plain red ring with an empty white centre (official name: Pedestrianised street, RUS 021). No vehicles may enter, in either direction. On the street it usually has a plate underneath with the hours it applies (e.g. 11:00–18:00), sometimes also the words Pedestrian Street / Sráid Coisithe; outside those hours, e.g. deliveries, vehicles may enter. Ignoring it is a fixed-charge offence (€60).","טבעת אדומה עם מרכז לבן ריק (השם הרשמי: Pedestrianised street – רחוב הולכי רגל, RUS 021). אסורה כניסה לכל הרכבים, משני הכיוונים. ברחוב בדרך כלל יש מתחתיו לוחית עם השעות שבהן הוא חל (למשל 11:00–18:00), ולפעמים גם הכיתוב Pedestrian Street / Sráid Coisithe; מחוץ לשעות האלה (למשל לפריקה וטעינה) מותר להיכנס. התעלמות היא עבירת קנס קבוע (60 אירו)."],"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003ccircle cx=\"50\" cy=\"50\" r=\"44\" fill=\"#fff\" stroke=\"#d71920\" stroke-width=\"9\"/>\u003c/svg>","cat":"reg","src":"RoR p.68; Traffic Signs Manual RUS 021","ex":[{"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003ccircle cx=\"50\" cy=\"30\" r=\"26\" fill=\"#fff\" stroke=\"#d71920\" stroke-width=\"6\"/>\u003crect x=\"34\" y=\"56\" width=\"3\" height=\"40\" fill=\"#999\"/>\u003crect x=\"63\" y=\"56\" width=\"3\" height=\"40\" fill=\"#999\"/>\u003crect x=\"14\" y=\"60\" width=\"72\" height=\"30\" rx=\"3\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2.5\"/>\u003ctext x=\"50\" y=\"72\" text-anchor=\"middle\" font-family=\"Arial,Helvetica,sans-serif\" font-weight=\"700\" font-size=\"7\" fill=\"#111\">PEDESTRIAN STREET\u003c/text>\u003ctext x=\"50\" y=\"84\" text-anchor=\"middle\" font-family=\"Arial,Helvetica,sans-serif\" font-weight=\"700\" font-size=\"9\" fill=\"#111\">11.00 - 18.00\u003c/text>\u003c/svg>","l":["With a times plate","עם לוחית שעות"]}]},{"id":"sg05","deck":"signs","type":"sign","q":["What is this sign? What must you do?","איזה תמרור זה? מה צריך לעשות?"],"name":["Speed limit 30 km/h","הגבלת מהירות 30 קמ\"ש"],"mean":["Maximum speed 30 km/h. Used for special zones such as housing estates (urban slow zones) and near schools. A maximum, not a target.","מהירות מקסימלית 30 קמ\"ש. משמש לאזורים מיוחדים כמו שכונות מגורים ובסמוך לבתי ספר. מקסימום, לא יעד."],"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003ccircle cx=\"50\" cy=\"50\" r=\"44\" fill=\"#fff\" stroke=\"#d71920\" stroke-width=\"9\"/>\u003ctext x=\"50\" y=\"63\" text-anchor=\"middle\" font-family=\"Arial,Helvetica,sans-serif\" font-weight=\"700\" font-size=\"40\" fill=\"#111\" >30\u003c/text>\u003c/svg>","cat":"reg","src":"RoR p.117"},{"id":"sg06","deck":"signs","type":"sign","q":["What is this sign? What must you do?","איזה תמרור זה? מה צריך לעשות?"],"name":["Speed limit 50 km/h","הגבלת מהירות 50 קמ\"ש"],"mean":["Maximum 50 km/h. This is the default limit in built-up areas (cities, towns).","מקסימום 50 קמ\"ש. מגבלת ברירת המחדל באזור בנוי (ערים ויישובים)."],"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003ccircle cx=\"50\" cy=\"50\" r=\"44\" fill=\"#fff\" stroke=\"#d71920\" stroke-width=\"9\"/>\u003ctext x=\"50\" y=\"63\" text-anchor=\"middle\" font-family=\"Arial,Helvetica,sans-serif\" font-weight=\"700\" font-size=\"40\" fill=\"#111\" >50\u003c/text>\u003c/svg>","cat":"reg","src":"RoR p.117"},{"id":"sg07","deck":"signs","type":"sign","q":["What is this sign? What must you do?","איזה תמרור זה? מה צריך לעשות?"],"name":["Speed limit 60 km/h","הגבלת מהירות 60 קמ\"ש"],"mean":["Maximum 60 km/h. This is the default limit on local roads.","מקסימום 60 קמ\"ש. מגבלת ברירת המחדל בכבישים מקומיים (local)."],"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003ccircle cx=\"50\" cy=\"50\" r=\"44\" fill=\"#fff\" stroke=\"#d71920\" stroke-width=\"9\"/>\u003ctext x=\"50\" y=\"63\" text-anchor=\"middle\" font-family=\"Arial,Helvetica,sans-serif\" font-weight=\"700\" font-size=\"40\" fill=\"#111\" >60\u003c/text>\u003c/svg>","cat":"reg","src":"RoR p.117"},{"id":"sg08","deck":"signs","type":"sign","q":["What is this sign? What must you do?","איזה תמרור זה? מה צריך לעשות?"],"name":["Speed limit 80 km/h","הגבלת מהירות 80 קמ\"ש"],"mean":["Maximum 80 km/h. This is the default limit on regional roads.","מקסימום 80 קמ\"ש. מגבלת ברירת המחדל בכבישים אזוריים (regional)."],"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003ccircle cx=\"50\" cy=\"50\" r=\"44\" fill=\"#fff\" stroke=\"#d71920\" stroke-width=\"9\"/>\u003ctext x=\"50\" y=\"63\" text-anchor=\"middle\" font-family=\"Arial,Helvetica,sans-serif\" font-weight=\"700\" font-size=\"40\" fill=\"#111\" >80\u003c/text>\u003c/svg>","cat":"reg","src":"RoR p.117"},{"id":"sg09","deck":"signs","type":"sign","q":["What is this sign? What must you do?","איזה תמרור זה? מה צריך לעשות?"],"name":["Speed limit 100 km/h","הגבלת מהירות 100 קמ\"ש"],"mean":["Maximum 100 km/h. Default on national roads (green signs, N numbers).","מקסימום 100 קמ\"ש. ברירת המחדל בכבישים לאומיים (שלטים ירוקים, מספרי N)."],"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003ccircle cx=\"50\" cy=\"50\" r=\"44\" fill=\"#fff\" stroke=\"#d71920\" stroke-width=\"9\"/>\u003ctext x=\"50\" y=\"60\" text-anchor=\"middle\" font-family=\"Arial,Helvetica,sans-serif\" font-weight=\"700\" font-size=\"33\" fill=\"#111\" >100\u003c/text>\u003c/svg>","cat":"reg","src":"RoR p.117"},{"id":"sg10","deck":"signs","type":"sign","q":["What is this sign? What must you do?","איזה תמרור זה? מה צריך לעשות?"],"name":["Speed limit 120 km/h","הגבלת מהירות 120 קמ\"ש"],"mean":["Maximum 120 km/h. Motorways (blue signs, M numbers). Learner permit holders may not use motorways.","מקסימום 120 קמ\"ש. כבישים מהירים (שלטים כחולים, מספרי M). מי שיש לו רק permit ללמוד לא רשאי להיכנס אליהם."],"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003ccircle cx=\"50\" cy=\"50\" r=\"44\" fill=\"#fff\" stroke=\"#d71920\" stroke-width=\"9\"/>\u003ctext x=\"50\" y=\"60\" text-anchor=\"middle\" font-family=\"Arial,Helvetica,sans-serif\" font-weight=\"700\" font-size=\"33\" fill=\"#111\" >120\u003c/text>\u003c/svg>","cat":"reg","src":"RoR p.117"},{"id":"sg11","deck":"signs","type":"sign","q":["What is this sign? What must you do?","איזה תמרור זה? מה צריך לעשות?"],"name":["Turn left (mandatory)","פנייה שמאלה חובה"],"mean":["Blue ci d\"/>\u003crect x=\"45\" y=\"40\" width=\"10\" height=\"42\" fill=\"#111\"/>\u003crect x=\"20\" y=\"34\" width=\"60\" height=\"10\" fill=\"#111\"/>\u003c/svg>","cat":"warn","src":"RoR p.76, p.127"},{"id":"sg28","deck":"signs","type":"sign","q":["What is this sign? What must you do?","איזה תמרור זה? מה צריך לעשות?"],"name":["Roundabout ahead","כיכר לפנים (Roundabout)"],"mean":["Yellow diamond with three arrows in a circle: a roundabout is ahead. Choose your lane, yield to traffic already on it (from your right).","מעוין צהוב עם שלושה חצים במעגל: כיכר לפנים. בחרו נתיב ותנו זכות קדימה לתנועה שכבר בכיכר (מימין)."],"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003cpolygon points=\"50,3 97,50 50,97 3,50\" fill=\"#ffd400\" stroke=\"#111\" stroke-width=\"5\" stroke-linejoin=\"round\"/>\u003ccircle cx=\"50\" cy=\"50\" r=\"19\" fill=\"none\" stroke=\"#111\" stroke-width=\"6\" stroke-dasharray=\"26 8\"/>\u003cpolygon points=\"67.3,38.0 63.5,26.6 55.5,40.5\" fill=\"#111\"/>\u003cpolygon points=\"51.7,71.0 63.5,73.4 55.5,59.5\" fill=\"#111\"/>\u003cpolygon points=\"31.0,41.0 23.0,50.0 39.0,50.0\" fill=\"#111\"/>\u003c/svg>","cat":"warn","src":"RoR p.76"},{"id":"sg29","deck":"signs","type":"sign","q":["What is this sign? What must you do?","איזה תמרור זה? מה צריך לעשות?"],"name":["School ahead","בית ספר לפנים (School)"],"mean":["Yellow diamond with children: a school is ahead. Slow down; watch for children and school wardens.","מעוין צהוב עם ילדים: בית ספר לפנים. מאטים, שימו לב לילדים ולשומרי מעבר."],"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003cpolygon points=\"50,3 97,50 50,97 3,50\" fill=\"#ffd400\" stroke=\"#111\" stroke-width=\"5\" stroke-linejoin=\"round\"/>\u003cg transform=\"translate(38 46) scale(1)\" fill=\"#111\" stroke=\"#111\">\u003ccircle cx=\"0\" cy=\"-12\" r=\"4.5\" stroke=\"none\"/>\u003cpath d=\"M0 -7 V8 M0 -4 L-8 4 M0 -4 L8 2 M0 8 L-6 20 M0 8 L7 20\" stroke-width=\"3.6\" fill=\"none\" stroke-linecap=\"round\"/>\u003c/g>\u003cg transform=\"translate(62 50) scale(0.8)\" fill=\"#111\" stroke=\"#111\">\u003ccircle cx=\"0\" cy=\"-12\" r=\"4.5\" stroke=\"none\"/>\u003cpath d=\"M0 -7 V8 M0 -4 L-8 4 M0 -4 L8 2 M0 8 L-6 20 M0 8 L7 20\" stroke-width=\"3.6\" fill=\"none\" stroke-linecap=\"round\"/>\u003c/g>\u003c/svg>","cat":"warn","src":"RoR p.76"},{"id":"sg30","deck":"signs","type":"sign","q":["What is this sign? What must you do?","איזה תמרור זה? מה צריך לעשות?"],"name":["Pedestrian crossing ahead","מעבר חציה לפנים"],"mean":["Yellow diamond with a pedestrian on stripes: a pedestrian crossing is ahead. Be ready to yield; no overtaking near it.","מעוין צהוב עם הולך רגל על פסים: מעבר חציה לפנים. היו מוכנים לתת זכות קדימה; אין לעקוף ליד מעבר."],"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003cpolygon points=\"50,3 97,50 50,97 3,50\" fill=\"#ffd400\" stroke=\"#111\" stroke-width=\"5\" stroke-linejoin=\"round\"/>\u003cg transform=\"translate(50 38) scale(1)\" fill=\"#111\" stroke=\"#111\">\u003ccircle cx=\"0\" cy=\"-12\" r=\"4.5\" stroke=\"none\"/>\u003cpath d=\"M0 -7 V8 M0 -4 L-8 4 M0 -4 L8 2 M0 8 L-6 20 M0 8 L7 20\" stroke-width=\"3.6\" fill=\"none\" stroke-linecap=\"round\"/>\u003c/g>\u003cg fill=\"#111\">\u003crect x=\"26\" y=\"66\" width=\"48\" height=\"5\"/>\u003crect x=\"26\" y=\"75\" width=\"48\" height=\"5\"/>\u003c/g>\u003c/svg>","cat":"warn","n":["Schematic drawing.","ציור סכמטי."],"src":"RoR (warning signs, Section 22)"},{"id":"sg31","deck":"signs","type":"sign","q":["What is this sign? What must you do?","איזה תמרור זה? מה צריך לעשות?"],"name":["Road narrows","הכביש מצטמצם"],"mean":["Yellow diamond: the road narrows ahead. Slow down and be ready to give way to oncoming traffic.","מעוין צהוב: הכביש מצטמצם לפנים. מאטים ומוכנים לתת זכות קדימה לתנועה נגדית."],"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003cpolygon points=\"50,3 97,50 50,97 3,50\" fill=\"#ffd400\" stroke=\"#111\" stroke-width=\"5\" stroke-linejoin=\"round\"/>\u003cpath d=\"M32 82 Q44 50 32 20\" stroke=\"#111\" stroke-width=\"9\" fill=\"none\"/>\u003cpath d=\"M68 82 Q56 50 68 20\" stroke=\"#111\" stroke-width=\"9\" fill=\"none\"/>\u003c/svg>","cat":"warn","n":["Schematic drawing.","ציור סכמטי."],"src":"RoR (warning signs, Section 22)"},{"id":"sg32","deck":"signs","type":"sign","q":["What is this sign? What must you do?","איזה תמרור זה? מה צריך לעשות?"],"name":["Chevron board (sharp change of direction)","לוח Chevron (שינוי כיוון חד)"],"mean":["Yellow board with black chevrons at a sharp bend. Follow the direction the chevrons point (here: right).","לוח צהוב עם חיצים שחורים בעיקול חד. עוקבים אחרי הכיוון שהחיצים מצביעים עליו (כאן: ימינה)."],"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003crect x=\"12\" y=\"6\" width=\"76\" height=\"88\" rx=\"4\" fill=\"#ffd400\" stroke=\"#111\" stroke-width=\"4\"/>\u003cpolyline points=\"30,28 62,50 30,72\" fill=\"none\" stroke=\"#111\" stroke-width=\"12\" stroke-linejoin=\"miter\"/>\u003c/svg>","cat":"warn","src":"RoR p.76"},{"id":"sg33","deck":"signs","type":"text","q":["What are the three categories of traffic signs?","מהן שלוש קטגוריות התמרורים?"],"a":["Regulatory (what you must do – the law), Warning (hazards ahead), Information (directions and distances).","Regulatory (מה חייבים – חוק), Warning (אזהרה מסכנות), Information (הכוונה ומרחקים)."],"src":"RoR p.67","ex":[{"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003ccircle cx=\"50\" cy=\"50\" r=\"46\" fill=\"#d71920\"/>\u003crect x=\"20\" y=\"43\" width=\"60\" height=\"14\" fill=\"#fff\"/>\u003c/svg>","l":["Regulatory","חובה/איסור"]},{"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003cpolygon points=\"50,3 97,50 50,97 3,50\" fill=\"#ffd400\" stroke=\"#111\" stroke-width=\"5\" stroke-linejoin=\"round\"/>\u003crect x=\"45\" y=\"18\" width=\"10\" height=\"64\" fill=\"#111\"/>\u003crect x=\"18\" y=\"45\" width=\"64\" height=\"10\" fill=\"#111\"/>\u003c/svg>","l":["Warning","אזהרה"]},{"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003crect x=\"4\" y=\"22\" width=\"92\" height=\"56\" rx=\"5\" fill=\"#0b7a3e\" stroke=\"#fff\" stroke-width=\"3\"/>\u003ctext x=\"50\" y=\"55\" text-anchor=\"middle\" font-family=\"Arial,Helvetica,sans-serif\" font-weight=\"700\" font-size=\"26\" fill=\"#fff\" >N7\u003c/text>\u003ctext x=\"50\" y=\"70\" text-anchor=\"middle\" font-family=\"Arial,Helvetica,sans-serif\" font-weight=\"700\" font-size=\"10\" fill=\"#fff\" >Limerick\u003c/text>\u003c/svg>","l":["Information","מידע"]}]},{"id":"sg34","deck":"signs","type":"text","q":["What do WARNING signs look like?","איך נראים תמרורי אזהרה (Warning)?"],"a":["Diamond or rectangular, yellow background, black border, black symbol of the hazard. (Not red triangles like in Israel/Europe!)","מעוין או מלבן, רקע צהוב, מסגרת שחורה וסמל שחור של הסכנה. (לא משולשים אדומים כמו בישראל/אירופה!)"],"src":"RoR p.76","ex":[{"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003cpolygon points=\"50,3 97,50 50,97 3,50\" fill=\"#ffd400\" stroke=\"#111\" stroke-width=\"5\" stroke-linejoin=\"round\"/>\u003cpath d=\"M40 80 V54 Q40 38 60 32\" stroke=\"#111\" stroke-width=\"10\" fill=\"none\"/>\u003cpolygon points=\"54,18 78,28 62,46\" fill=\"#111\"/>\u003c/svg>","l":["Yellow diamond","מעוין צהוב"]},{"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003cpolygon points=\"50,3 97,50 50,97 3,50\" fill=\"#ffd400\" stroke=\"#111\" stroke-width=\"5\" stroke-linejoin=\"round\"/>\u003cg transform=\"tra ue\">\u003ccircle cx=\"50\" cy=\"50\" r=\"44\" fill=\"#fff\" stroke=\"#d71920\" stroke-width=\"9\"/>\u003ctext x=\"50\" y=\"63\" text-anchor=\"middle\" font-family=\"Arial,Helvetica,sans-serif\" font-weight=\"700\" font-size=\"40\" fill=\"#111\" >50\u003c/text>\u003c/svg>","l":["White + red border","לבן + מסגרת אדומה"]},{"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003ccircle cx=\"50\" cy=\"50\" r=\"44\" fill=\"#fff\" stroke=\"#d71920\" stroke-width=\"9\"/>\u003cpath d=\"M38 78 V50 H60\" stroke=\"#111\" stroke-width=\"9\" fill=\"none\"/>\u003cpolygon points=\"58,34 78,50 58,66\" fill=\"#111\"/>\u003cline x1=\"24\" y1=\"24\" x2=\"76\" y2=\"76\" stroke=\"#d71920\" stroke-width=\"8\" stroke-linecap=\"round\"/>\u003c/svg>","l":["No right turn","אסור לפנות ימינה"]},{"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003ccircle cx=\"50\" cy=\"50\" r=\"46\" fill=\"#0b4ea2\"/>\u003cpolygon points=\"18,50 46,24 46,40 80,40 80,60 46,60 46,76\" fill=\"#fff\"/>\u003c/svg>","l":["Blue + white","כחול + לבן"]},{"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003cpolygon points=\"92.5,67.6 67.6,92.5 32.4,92.5 7.5,67.6 7.5,32.4 32.4,7.5 67.6,7.5 92.5,32.4\" fill=\"#d71920\" stroke=\"#fff\" stroke-width=\"3\"/>\u003cpolygon points=\"92.5,67.6 67.6,92.5 32.4,92.5 7.5,67.6 7.5,32.4 32.4,7.5 67.6,7.5 92.5,32.4\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" transform=\"translate(50 50) scale(.9) translate(-50 -50)\"/>\u003ctext x=\"50\" y=\"60\" text-anchor=\"middle\" font-family=\"Arial,Helvetica,sans-serif\" font-weight=\"700\" font-size=\"27\" fill=\"#fff\" >STOP\u003c/text>\u003c/svg>","l":["Stop (octagon)","עצור (מתומן)"]},{"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003cpolygon points=\"8,12 92,12 50,88\" fill=\"#fff\" stroke=\"#d71920\" stroke-width=\"9\" stroke-linejoin=\"round\"/>\u003ctext x=\"50\" y=\"38\" text-anchor=\"middle\" font-family=\"Arial,Helvetica,sans-serif\" font-weight=\"700\" font-size=\"14\" fill=\"#111\" >YIELD\u003c/text>\u003c/svg>","l":["Yield (triangle)","זכות קדימה (משולש)"]},{"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003crect x=\"14\" y=\"8\" width=\"72\" height=\"84\" rx=\"4\" fill=\"#0b4ea2\" stroke=\"#fff\" stroke-width=\"3\"/>\u003ctext x=\"50\" y=\"40\" text-anchor=\"middle\" font-family=\"Arial,Helvetica,sans-serif\" font-weight=\"700\" font-size=\"20\" fill=\"#fff\">BUS\u003c/text>\u003ctext x=\"50\" y=\"62\" text-anchor=\"middle\" font-family=\"Arial,Helvetica,sans-serif\" font-weight=\"700\" font-size=\"16\" fill=\"#fff\">LANE\u003c/text>\u003ctext x=\"50\" y=\"82\" text-anchor=\"middle\" font-family=\"Arial,Helvetica,sans-serif\" font-weight=\"700\" font-size=\"13\" fill=\"#fff\">7-10\u003c/text>\u003c/svg>","l":["Rectangular","מלבני"]}]},{"id":"sg36","deck":"signs","type":"text","q":["What colours are information signs, and roadworks signs?","מה צבעי שלטי המידע ושלטי העבודות?"],"a":["Blue with white letters: motorways. Green with white letters: national roads. White with black letters: regional and local roads. Roadworks signs: orange with black border and symbols.","כחול עם אותיות לבנות: כבישים מהירים. ירוק עם אותיות לבנות: כבישים לאומיים. לבן עם אותיות שחורות: כבישים אזוריים ומקומיים. שלטי עבודות: כתום עם מסגרת וסמלים שחורים."],"src":"RoR p.77, p.79","ex":[{"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003crect x=\"4\" y=\"22\" width=\"92\" height=\"56\" rx=\"5\" fill=\"#0b4ea2\" stroke=\"#fff\" stroke-width=\"3\"/>\u003ctext x=\"50\" y=\"55\" text-anchor=\"middle\" font-family=\"Arial,Helvetica,sans-serif\" font-weight=\"700\" font-size=\"26\" fill=\"#fff\" >M50\u003c/text>\u003ctext x=\"50\" y=\" -width=\"3\" />\u003cline x1=\"54\" y1=\"0\" x2=\"54\" y2=\"100\" stroke=\"#fff\" stroke-width=\"3\" />\u003cg transform=\"translate(26 70) scale(1)\">\u003crect x=\"-7\" y=\"-13\" width=\"14\" height=\"26\" rx=\"4\" fill=\"#2e6fd8\"/>\u003crect x=\"-5\" y=\"-6\" width=\"10\" height=\"7\" rx=\"1.5\" fill=\"#cfe5ff\"/>\u003c/g>\u003cg transform=\"translate(74 30) scale(1)\">\u003crect x=\"-7\" y=\"-13\" width=\"14\" height=\"26\" rx=\"4\" fill=\"#c0392b\"/>\u003crect x=\"-5\" y=\"-6\" width=\"10\" height=\"7\" rx=\"1.5\" fill=\"#cfe5ff\"/>\u003c/g>\u003c/svg>","cat":"mark","src":"RoR p.75"},{"id":"mk02","deck":"marks","type":"mark","q":["What does this road marking mean?","מה משמעות סימון הכביש הזה?"],"name":["Short broken white centre line","קו לבן מקוטע קצר באמצע"],"mean":["Divides traffic in opposite directions. Do not cross unless it is safe to do so.","מפריד בין כיוונים מנוגדים. לא חוצים אלא אם בטוח."],"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003crect width=\"100\" height=\"100\" fill=\"#4a4a4a\"/>\u003cline x1=\"50\" y1=\"0\" x2=\"50\" y2=\"100\" stroke=\"#fff\" stroke-width=\"3\" stroke-dasharray=\"10 14\"/>\u003cg transform=\"translate(26 70) scale(1)\">\u003crect x=\"-7\" y=\"-13\" width=\"14\" height=\"26\" rx=\"4\" fill=\"#2e6fd8\"/>\u003crect x=\"-5\" y=\"-6\" width=\"10\" height=\"7\" rx=\"1.5\" fill=\"#cfe5ff\"/>\u003c/g>\u003cg transform=\"translate(74 30) scale(1)\">\u003crect x=\"-7\" y=\"-13\" width=\"14\" height=\"26\" rx=\"4\" fill=\"#c0392b\"/>\u003crect x=\"-5\" y=\"-6\" width=\"10\" height=\"7\" rx=\"1.5\" fill=\"#cfe5ff\"/>\u003c/g>\u003c/svg>","cat":"mark","src":"RoR p.75"},{"id":"mk03","deck":"marks","type":"mark","q":["What does this road marking mean?","מה משמעות סימון הכביש הזה?"],"name":["Long lines, short gaps (warning line)","קווים ארוכים עם רווחים קצרים (קו אזהרה)"],"mean":["Alerts you to a hazard ahead – restricted vision, a junction, roundabout, hill, crest, bend, or a continuous white line ahead. Do not cross unless safe.","מתריע על סכנה לפנים – ראות מוגבלת, צומת, כיכר, גבעה, פסגה, עיקול, או קו רצוף בהמשך. לא חוצים אלא אם בטוח."],"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003crect width=\"100\" height=\"100\" fill=\"#4a4a4a\"/>\u003cline x1=\"50\" y1=\"0\" x2=\"50\" y2=\"100\" stroke=\"#fff\" stroke-width=\"3\" stroke-dasharray=\"26 7\"/>\u003cg transform=\"translate(26 70) scale(1)\">\u003crect x=\"-7\" y=\"-13\" width=\"14\" height=\"26\" rx=\"4\" fill=\"#2e6fd8\"/>\u003crect x=\"-5\" y=\"-6\" width=\"10\" height=\"7\" rx=\"1.5\" fill=\"#cfe5ff\"/>\u003c/g>\u003cg transform=\"translate(74 30) scale(1)\">\u003crect x=\"-7\" y=\"-13\" width=\"14\" height=\"26\" rx=\"4\" fill=\"#c0392b\"/>\u003crect x=\"-5\" y=\"-6\" width=\"10\" height=\"7\" rx=\"1.5\" fill=\"#cfe5ff\"/>\u003c/g>\u003c/svg>","cat":"mark","src":"RoR p.75"},{"id":"mk04","deck":"marks","type":"mark","q":["What does this road marking mean?","מה משמעות סימון הכביש הזה?"],"name":["Double broken white lines","שני קווים לבנים מקוטעים"],"mean":["A warning that continuous white lines begin a short distance ahead. Do not cross unless safe.","אזהרה שבהמשך מתחילים קווים לבנים רצופים. לא חוצים אלא אם בטוח."],"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003crect width=\"100\" height=\"100\" fill=\"#4a4a4a\"/>\u003cline x1=\"46\" y1=\"0\" x2=\"46\" y2=\"100\" stroke=\"#fff\" stroke-width=\"3\" stroke-dasharray=\"10 14\"/>\u003cline x1=\"54\" y1=\"0\" x2=\"54\" y2=\"100\" stroke=\"#fff\" stroke-width=\"3\" stroke-dasharray=\"10 14\"/>\u003cg transform=\"translate(26 70) scale(1)\">\u003crect x=\"-7\" y=\"-13\" width=\"14\" height=\"26\" rx=\"4\" fill=\"#2e6fd8\"/>\u003crect x=\"-5\" y=\"-6\" width=\"10\" height=\"7\" rx=\"1.5\" fill=\"#cfe5ff\"/>\u003c/g>\u003cg transform=\"translate(74 30) scale(1)\">\u003crect x=\"-7\" y=\"-13\" width=\"14\" height=\"26\" rx=\"4\" fill=\"#c0392b\"/>\u003crect x=\"-5\" y=\"-6\" width=\"10\" height=\"7\" rx=\"1.5\" fill=\"#cfe5ff\"/>\u003c/g>\u003c/svg>","cat":"mark","src":"RoR p.75"},{"id":"mk05","deck":"marks","type":"mark","q":["What does this road marking mean?","מה משמעות סימון הכביש הזה?"],"name":["Continuous line + broken line","קו רצוף + קו מקוטע"],"mean":["Obey the line that is nearest to you. If the continuous line is on your side you must stay left of it; if the broken line is on your side you may cross when safe.","מצייתים לקו הקרוב אליך. אם הקו הרצוף בצד שלך – נשארים משמאלו; אם המקוטע בצד שלך – מותר לחצות כשבטוח."],"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003crect width=\"100\" height=\"100\" fill=\"#4a4a4a\"/>\u003cline x1=\"46\" y1=\"0\" x2=\"46\" y2=\"100\" stroke=\"#fff\" stroke-width=\"3\" />\u003cline x1=\"54\" y1=\"0\" x2=\"54\" y2=\"100\" stroke=\"#fff\" stroke-width=\"3\" stroke-dasharray=\"10 12\"/>\u003cg transform=\"translate(26 70) scale(1)\">\u003crect x=\"-7\" y=\"-13\" width=\"14\" height=\"26\" rx=\"4\" fill=\"#2e6fd8\"/>\u003crect x=\"-5\" y=\"-6\" width=\"10\" height=\"7\" rx=\"1.5\" fill=\"#cfe5ff\"/>\u003c/g>\u003cg transform=\"translate(74 70) scale(1)\">\u003crect x=\"-7\" y=\"-13\" width=\"14\" height=\"26\" rx=\"4\" fill=\"#c0392b\"/>\u003crect x=\"-5\" y=\"-6\" width=\"10\" height=\"7\" rx=\"1.5\" fill=\"#cfe5ff\"/>\u003c/g>\u003c/svg>","cat":"mark","src":"RoR p.75"},{"id":"mk06","deck":"marks","type":"mark","q":["What does this road marking mean?","מה משמעות סימון הכביש הזה?"],"name":["Single broken yellow line at the road edge","קו צהוב מקוטע בקצה הכביש"],"mean":["A hard shoulder for pedestrians and cyclists. You may pull in briefly to let faster traffic pass if no pedestrians/cyclists/junctions are near – don't keep driving on it.","שול לרוכבים והולכי רגל. מותר להיכנס לרגע כדי לתת לרכב מהיר לעבור אם אין בסביבה הולכי רגל/אופניים/צמתים – לא ממשיכים ל riangles across the lane: give way to traffic on the road ahead; stop only if needed.","שורת משולשים לרוחב הנתיב: נותנים זכות קדימה לתנועה בכביש שלפניך; עוצרים רק אם צריך."],"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003crect width=\"100\" height=\"100\" fill=\"#4a4a4a\"/>\u003cg fill=\"#fff\">\u003cpolygon points=\"14,38 26,38 20,48\"/>\u003cpolygon points=\"30,38 42,38 36,48\"/>\u003cpolygon points=\"46,38 58,38 52,48\"/>\u003cpolygon points=\"62,38 74,38 68,48\"/>\u003cpolygon points=\"78,38 90,38 84,48\"/>\u003c/g>\u003cg transform=\"translate(50 85) scale(1)\">\u003crect x=\"-7\" y=\"-13\" width=\"14\" height=\"26\" rx=\"4\" fill=\"#2e6fd8\"/>\u003crect x=\"-5\" y=\"-6\" width=\"10\" height=\"7\" rx=\"1.5\" fill=\"#cfe5ff\"/>\u003c/g>\u003c/svg>","cat":"mark","n":["Schematic drawing of a yield line.","ציור סכמטי של קו Yield."],"src":"RoR p.126"},{"id":"mk15","deck":"marks","type":"mark","q":["What does this road marking mean?","מה משמעות סימון הכביש הזה?"],"name":["\"NO ENTRY\" road marking","סימון \"NO ENTRY\" על הכביש"],"mean":["A continuous and a broken white line with the words NO ENTRY: you may not enter this way.","קו רצוף וקו מקוטע עם הכתובת NO ENTRY: אסור להיכנס מכיוון זה."],"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003crect width=\"100\" height=\"100\" fill=\"#4a4a4a\"/>\u003cline x1=\"40\" y1=\"0\" x2=\"40\" y2=\"100\" stroke=\"#fff\" stroke-width=\"3\" />\u003cline x1=\"60\" y1=\"0\" x2=\"60\" y2=\"100\" stroke=\"#fff\" stroke-width=\"3\" stroke-dasharray=\"10 12\"/>\u003ctext x=\"50\" y=\"52\" text-anchor=\"middle\" font-family=\"Arial\" font-weight=\"700\" font-size=\"11\" fill=\"#fff\" transform=\"rotate(-90 50 52)\">NO ENTRY\u003c/text>\u003c/svg>","cat":"mark","src":"Bank (book Q38), RoR"},{"id":"mk16","deck":"marks","type":"mark","q":["What does this road marking mean?","מה משמעות סימון הכביש הזה?"],"nam ne x1=\"50\" y1=\"0\" x2=\"50\" y2=\"100\" stroke=\"#fff\" stroke-width=\"3\" stroke-dasharray=\"10 14\"/>\u003c/svg>","cat":"mark","src":"RoR p.143"},{"id":"hs01","deck":"hands","type":"hand","q":["Hand signal to traffic BEHIND: what does this mean?","סימן יד לתנועה שמאחור: מה זה אומר?"],"name":["Turning / moving out RIGHT","פונה / סוטה ימינה"],"mean":["To traffic behind: the RIGHT arm held straight out horizontally through the driver's window. (\"I am going to move out or turn to my right.\")","לתנועה מאחור: הזרוע הימנית פשוטה אופקית החוצה דרך חלון הנהג. (\"I am going to move out or turn to my right.\")"],"svg":"\u003csvg viewBox=\"0 0 120 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003crect x=\"18\" y=\"52\" width=\"70\" height=\"30\" rx=\"7\" fill=\"#7f8c99\"/>\u003crect x=\"28\" y=\"26\" width=\"50\" height=\"30\" rx=\"7\" fill=\"#9aa7b4\"/>\u003crect x=\"34\" y=\"31\" width=\"38\" height=\"20\" rx=\"3\" fill=\"#dbe9f5\"/>\u003ccircle cx=\"58\" cy=\"42\" r=\"6\" fill=\"#e0b48a\"/>\u003crect x=\"26\" y=\"80\" width=\"12\" height=\"8\" fill=\"#222\"/>\u003crect x=\"68\" y=\"80\" width=\"12\" height=\"8\" fill=\"#222\"/>\u003cline x1=\"84\" y1=\"42\" x2=\"114\" y2=\"42\" stroke=\"#e0b48a\" stroke-width=\"7\" stroke-linecap=\"round\"/>\u003ccircle cx=\"114\" cy=\"42\" r=\"5\" fill=\"#e0b48a\"/>\u003c/svg>","cat":"hand","src":"RoR p.112"},{"id":"hs02","deck":"hands","type":"hand","q":["Hand signal to traffic BEHIND: what does this mean?","סימן יד לתנועה שמאחור: מה זה אומר?"],"name":["Turning LEFT","פונה שמאלה"],"mean":["To traffic behind: the RIGHT arm out of the window, with the arm and hand moving in an anti-clockwise (circular) direction. A car driver uses the right arm for all signals.","לתנועה מאחור: הזרוע הימנית מחוץ לחלון, כשהזרוע והיד נעות בכיוון נגד כיוון השעון (תנועה מעגלית). נהג ברכב משתמש בזרוע הימנית לכל הסימנים."],"svg":"\u003csvg viewBox=\"0 0 120 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003crect x=\"18\" y=\"52\" width=\"70\" height=\"30\" rx=\"7\" fill=\"#7f8c99\"/>\u003crect x=\"28\" y=\"26\" width=\"50\" height=\"30\" rx=\"7\" fill=\"#9aa7b4\"/>\u003crect x=\"34\" y=\"31\" width=\"38\" height=\"20\" rx=\"3\" fill=\"#dbe9f5\"/>\u003ccircle cx=\"58\" cy=\"42\" r=\"6\" fill=\"#e0b48a\"/>\u003crect x=\"26\" y=\"80\" width=\"12\" height=\"8\" fill=\"#222\"/>\u003crect x=\"68\" y=\"80\" width=\"12\" height=\"8\" fill=\"#222\"/>\u003cline x1=\"84\" y1=\"42\" x2=\"108\" y2=\"42\" stroke=\"#e0b48a\" stroke-width=\"7\" stroke-linecap=\"round\"/>\u003ccircle cx=\"108\" cy=\"42\" r=\"5\" fill=\"#e0b48a\"/>\u003cpath d=\"M94 28 A14 14 0 1 0 118 28\" fill=\"none\" stroke=\"#d71920\" stroke-width=\"3\"/>\u003cpolygon points=\"112,20 124,30 110,34\" fill=\"#d71920\"/>\u003c/svg>","cat":"hand","src":"RoR p.112"},{"id":"hs03","deck":"hands","type":"hand","q":["Hand signal to traffic BEHIND: what does this mean?","סימן יד לתנועה שמאחור: מה זה אומר?"],"name":["Slowing down or STOPPING","מאט או עוצר"],"mean":["To traffic behind: the RIGHT arm out of the window, moving up and down (palm facing down). (\"I am going to slow down or stop.\")","לתנועה מאחור: הזרוע הימנית מחוץ לחלון, נעה מעלה ומטה (כף היד כלפי מטה). (\"I am going to slow down or stop.\")"],"svg":"\u003csvg viewBox=\"0 0 120 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003crect x=\"18\" y=\"52\" width=\"70\" height=\"30\" rx=\"7\" fill=\"#7f8c99\"/>\u003crect x=\"28\" y=\"26\" width=\"50\" height=\"30\" rx=\"7\" fill=\"#9aa7b4\"/>\u003crect x=\"34\" y=\"31\" width=\"38\" height=\"20\" rx=\"3\" fill=\"#dbe9f5\"/>\u003ccircle cx=\"58\" cy=\"42\" r=\"6\" fill=\"#e0b48a\"/>\u003crect x=\"26\" y=\"80\" width=\"12\" height=\"8\" fill=\"#222\"/>\u003crect x=\"68\" y=\"80\" width=\"12\" height=\"8\" fill=\"#222\"/>\u003cline x1=\"84\" y1=\"44\" x2=\"108\" y2=\"44\" stroke=\"#e0b48a\" stroke-width=\"7\" stroke-linecap=\"round\"/>\u003ccircle cx=\"108\" cy=\"44\" r=\"5\" fill=\"#e0b48a\"/>\u003cpath d=\"M114 30 V58\" stroke=\"#d71920\" stroke-width=\"3\"/>\u003cpolygon points=\"109,32 119,32 114,22\" fill=\"#d71920\"/>\u003cpolygon points=\"109,56 119,56 114,66\" fill=\"#d71920\"/>\u003c/svg>","cat":"hand","n":["\"Palm down\" is from instructor sources; the RoR drawing shows the up-and-down movement.","\"כף יד כלפי מטה\" לפי מורים; האיור בספר מראה את התנועה מעלה-מטה."],"src":"RoR p.112"},{"id":"hs04","deck":"hands","type":"hand","q":["Hand signal to a GARDA / TRAFFIC CONTROLLER: what does this mean?","סימן יד לשוטר / מכוון תנועה: מה זה אומר?"],"name":["\"I want to go STRAIGHT ON\"","\"אני רוצה להמשיך ישר\""],"mean":["To a Garda / traffic controller (pointsman) and oncoming traffic: right hand raised, palm facing forward.","לשוטר/מכוון תנועה ולתנועה נגדית: יד ימין מורמת, כף היד קדימה."],"svg":"\u003csvg viewBox=\"0 0 120 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003crect x=\"32\" y=\"52\" width=\"70\" height=\"30\" rx=\"7\" fill=\"#7f8c99\"/>\u003crect x=\"42\" y=\"26\" width=\"50\" height=\"30\" rx=\"7\" fill=\"#9aa7b4\"/>\u003crect x=\"48\" y=\"31\" width=\"38\" height=\"20\" rx=\"3\" fill=\"#dbe9f5\"/>\u003ccircle cx=\"56\" cy=\"42\" r=\"6\" fill=\"#e0b48a\"/>\u003crect x=\"40\" y=\"80\" width=\"12\" height=\"8\" fill=\"#222\"/>\u003crect x=\"82\" y=\"80\" width=\"12\" height=\"8\" fill=\"#222\"/>\u003cpath d=\"M44 44 H18 V16\" fill=\"none\" stroke=\"#e0b48a\" stroke-width=\"7\" stroke-linecap=\"round\"/>\u003crect x=\"12\" y=\"6\" width=\"12\" height=\"12\" rx=\"3\" fill=\"#e0b48a\"/>\u003c/svg>","cat":"hand","n":["Described from the study-book page that was photographed – confirm against RoR p.113.","לפי עמוד הספר שצולם – לוודא מול RoR עמ' 113."],"src":"RoR p.113; the study-book page"},{"id":"hs05","deck":"hands","type":"hand","q":["Hand signal to a GARDA / TRAFFIC CONTROLLER: what does this mean?","סימן יד לשוטר / מכוון תנועה: מה זה אומר?"],"name":["\"I want to turn LEFT\"","\"אני רוצה לפנות שמאלה\""],"mean":["To a Garda / pointsman: the car driver points the right forearm and hand with the fingers extended to the left (across the body).","לשוטר / מכוון תנועה: נהג הרכב מצביע עם האמה וכף היד הימנית, כשהאצבעות פרושות שמאלה (מעבר לגוף)."],"svg":"\u003csvg viewBox=\"0 0 120 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003crect x=\"32\" y=\"52\" width=\"70\" height=\"30\" rx=\"7\" fill=\"#7f8c99\"/>\u003crect x=\"42\" y=\"26\" width=\"50\" height=\"30\" rx=\"7\" fill=\"#9aa7b4\"/>\u003crect x=\"48\" y=\"31\" width=\"38\" height=\"20\" rx=\"3\" fill=\"#dbe9f5\"/>\u003ccircle cx=\"56\" cy=\"42\" r=\"6\" fill=\"#e0b48a\"/>\u003crect x=\"40\" y=\"80\" width=\"12\" height=\"8\" fill=\"#222\"/>\u003crect x=\"82\" y=\"80\" width=\"12\" height=\"8\" fill=\"#222\"/>\u003cpath d=\"M46 44 H22\" stroke=\"#e0b48a\" stroke-width=\"7\" stroke-linecap=\"round\" fill=\"none\"/>\u003cpath d=\"M22 44 L56 36\" stroke=\"#e0b48a\" stroke-width=\"6\" stroke-linecap=\"round\"/>\u003cpolygon points=\"58,31 70,37 58,43\" fill=\"#d71920\"/>\u003c/svg>","cat":"hand","src":"RoR p.113 (note)"},{"id":"hs06","deck":"hands","type":"hand","q":["Hand signal to a GARDA / TRAFFIC CONTROLLER: what does this mean?","סימן יד לשוטר / מכוון תנועה: מה זה אומר?"],"name":["\"I want to turn RIGHT\"","\"אני רוצה לפנות ימינה\""],"mean":["To a Garda / pointsman: the right arm held out of the window.","לשוטר / מכוון תנועה: הזרוע הימנית מושטת מחוץ לחלון."],"svg":"\u003csvg viewBox=\"0 0 120 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003crect x=\"32\" y=\"52\" width=\"70\" height=\"30\" rx=\"7\" fill=\"#7f8c99\"/>\u003crect x=\"42\" y=\"26\" width=\"50\" height=\"30\" rx=\"7\" fill=\"#9aa7b4\"/>\u003crect x=\"48\" y=\"31\" width=\"38\" height=\"20\" rx=\"3\" fill=\"#dbe9f5\"/>\u003ccircle cx=\"56\" cy=\"42\" r=\"6\" fill=\"#e0b48a\"/>\u003crect x=\"40\" y=\"80\" width=\"12\" height=\"8\" fill=\"#222\"/>\u003crect x=\"82\" y=\"80\" width=\"12\" height=\"8\" fill=\"#222\"/>\u003cline x1=\"44\" y1=\"44\" x2=\"8\" y2=\"44\" stroke=\"#e0b48a\" stroke-width=\"7\" stroke-linecap=\"round\"/>\u003ccircle cx=\"8\" cy=\"44\" r=\"5\" fill=\"#e0b48a\"/>\u003c/svg>","cat":"hand","n":["Confirm against RoR p.113.","לוודא מול RoR עמ' 113."],"src":"RoR p.113; the study-book page"},{"id":"hs07","deck":"hands","type":"hand","q":["Hand signal to a GARDA / TRAFFIC CONTROLLER: what does this mean?","סימן יד לשוטר / מכוון תנועה: מה זה אומר?"],"name":["\"I want to SLOW or STOP\"","\"אני רוצה להאט או לעצור\""],"mean":["To a Garda / pointsman: the RoR shows a slow/stop signal (the arm is moved up and down). Check the exact picture on RoR p.113.","לשוטר / מכוון תנועה: בספר מופיע סימן האטה/עצירה (הזרוע נעה מעלה ומטה). לבדוק את התמונה המדויקת ב-RoR עמ' 113."],"svg":"\u003csvg viewBox=\"0 0 120 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003crect x=\"32\" y=\"52\" width=\"70\" height=\"30\" rx=\"7\" fill=\"#7f8c99\"/>\u003crect x=\"42\" y=\"26\" width=\"50\" height=\"30\" rx=\"7\" fill=\"#9aa7b4\"/>\u003crect x=\"48\" y=\"31\" width=\"38\" height=\"20\" rx=\"3\" fill=\"#dbe9f5\"/>\u003ccircle cx=\"56\" cy=\"42\" r=\"6\" fill=\"#e0b48a\"/>\u003crect x=\"40\" y=\"80\" width=\"12\" height=\"8\" fill=\"#222\"/>\u003crect x=\"82\" y=\"80\" width=\"12\" height=\"8\" fill=\"#222\"/>\u003cline x1=\"44\" y1=\"44\" x2=\"18\" y2=\"44\" stroke=\"#e0b48a\" stroke-width=\"7\" stroke-linecap=\"round\"/>\u003ccircle cx=\"18\" cy=\"44\" r=\"5\" fill=\"#e0b48a\"/>\u003cpath d=\"M10 30 V58\" stroke=\"#d71920\" stroke-width=\"3\"/>\u003cpolygon points=\"5,32 15,32 10,22\" fill=\"#d71920\"/>\u003cpolygon points=\"5,56 15,56 10,66\" fill=\"#d71920\"/>\u003c/svg>","cat":"hand","n":["The exact arm position for this one is the least certain – learn it from the book picture.","המיקום המדויק של הזרוע בסימן הזה הוא הכי פחות ודאי – ללמוד מהתמונה בספר."],"src":"RoR p.113"},{"id":"sim01","deck":"sim","type":"sim","q":["Good morning / good evening / hello. I will be your Driver Tester today, my name is … , please come this way.","בוקר טוב / ערב טוב / שלום. אני הבוחן שלך היום, שמי … , בבקשה בואי איתי."],"say":"Good morning / good evening / hello. I will be your Driver Tester today, my name is … , please come this way.","he":"בוקר טוב / ערב טוב / שלום. אני הבוחן שלך היום, שמי … , בבקשה בואי איתי.","a":["Stand up, greet back, and follow the tester to the desk. Wait in the waiting area, not in the car, before your appointment time.","לקום, להחזיר ברכה ולעקוב אחרי הבוחן לשולחן. לפני המבחן מחכים באזור ההמתנה ולא ברכב."],"ans":["\"Good morning.\"","\"Good morning.\""],"phase":["In the test-centre room (the desk)","בחדר במרכז המבחנים (ליד השולחן)"],"phaseKey":"room","conf":"official","confLabel":["RSA wording (verbatim)","ניסוח רשמי של ה-RSA (מילה במילה)"],"src":"RSA Standard Procedures (Feb 2026) p.5"},{"id":"sim02","deck":"sim","type":"sim","q":["May I have your address, please?","אפשר לקבל את הכתובת שלך, בבקשה?"],"say":"May I have your address, please?","he":"אפשר לקבל את הכתובת שלך, בבקשה?","a":["Say your address clearly, as it is on your learner permit. The tester checks it against the details on the tablet.","להגיד את הכתובת בבירור, כפי שהיא רשומה ב-learner permit. הבוחן משווה לפרטים בטאבלט."],"phase":["In the test-centre room (the desk)","בחדר במרכז המבחנים (ליד השולחן)"],"phaseKey":"room","conf":"official","confLabel":["RSA wording (verbatim)","ניסוח רשמי של ה-RSA (מילה במילה)"],"src":"RSA Standard Procedures (Feb 2026) p.5"},{"id":"sim03","deck":"sim","type":"sim","q":["May I see your Learner Permit, please?","אפשר לראות את ה-Learner Permit שלך, בבקשה?"],"say":"May I see your Learner Permit, please?","he":"אפשר לראות את ה-Learner Permit שלך, בבקשה?","a":["Hand over the physical card. The tester checks the photo, that it is in date, that it is valid for category B, and the driver number. You are then asked to sign the Feedback Form (it is handed back to you at the end) and the signature is compared with the permit.","למסור את הכרטיס עצמו. הבוחן בודק תמונה, תוקף, קטגוריה B ומספר נהג. מבקשים ממך לחתום על ה-Feedback Form (תקבלי אותו בסוף) והחתימה מושווית לזו שב-permit."],"phase":["In the test-centre room (the desk)","בחדר במרכז המבחנים (ליד השולחן)"],"phaseKey":"room","conf":"official","confLabel":["RSA wording (verbatim)","ניסוח רשמי של ה-RSA (מילה במילה)"],"n":["Only the question itself is verbatim; the signature request is described, not quoted, in the RSA text.","רק השאלה עצמה מצוטטת מילה במילה; בקשת החתימה מתוארת בטקסט של ה-RSA ולא מצוטטת."],"src":"RSA Standard Procedures (Feb 2026) p.5-6"},{"id":"sim04","deck":"sim","type":"sim","q":["That's fine, thanks.","בסדר גמור, תודה."],"say":"That's fine, thanks.","he":"בסדר גמור, תודה.","a":["The permit is accepted and handed back. (If not: \"Sorry, I am not permitted to conduct your test as your Permit is e.g. out of date, or not valid for the category of vehicle you propose to use.\")","ה-permit התקבל והוחזר אלייך. (אם לא: \"Sorry, I am not permitted to conduct your test as your Permit is e.g. out of date, or not valid for the category of vehicle you propose to use.\")"],"phase":["In the test-centre room (the desk)","בחדר במרכז המבחנים (ליד השולחן)"],"phaseKey":"room","conf":"official","confLabel":["RSA wording (verbatim)","ניסוח רשמי של ה-RSA (מילה במילה)"],"src":"RSA Standard Procedures (Feb 2026) p.6"},{"id":"sim05","deck":"sim","type":"sim","q":["Please show me the certificate of insurance for the vehicle you will be using.","בבקשה הראי לי את תעודת הביטוח של הרכב שבו תבצעי את המבחן."],"say":"Please show me the certificate of insurance for the vehicle you will be using.","he":"בבקשה הראי לי את תעודת הביטוח של הרכב שבו תבצעי את המבחן.","a":["Hand over the certificate. If you test in an instructor's car it must show cover for driving-test purposes (usually on the back, paragraph 6 (Z)) or come with a letter on headed paper. If you are not named on the certificate, an email or letter from the insurer saying you are insured is accepted. The tester returns it and does not copy or keep it.","למסור את התעודה. ברכב של מורה היא צריכה להראות כיסוי למטרות מבחן (בדרך כלל בגב, סעיף 6 (Z)) או לבוא עם מכתב על נייר מכתבים רשמי. אם השם שלך לא מופיע – מייל או מכתב מחברת הביטוח שמאשרים שאת מבוטחת. הבוחן מחזיר ולא מצלם ולא שומר."],"phase":["In the test-centre room (the desk)","בחדר במרכז המבחנים (ליד השולחן)"],"phaseKey":"room","conf":"official-para","confLabel":["RSA procedure (paraphrased)","נוהל ה-RSA (פרפרזה)"],"n":["Required since 9 March 2026 as an interim measure. The RSA text says the tester \"should ask\" – the exact words are not given; this is a paraphrase. At this point the tester must NOT ask the registration number or manual/automatic.","נדרש מאז 9 במרץ 2026 כצעד ביניים. הטקסט של ה-RSA אומר שהבוחן \"יבקש\" – הניסוח המדויק לא ניתן; זו פרפרזה. בשלב הזה הבוחן לא שואל מספר רישוי או ידני/אוטומטי."],"src":"RSA Standard Procedures (Feb 2026) p.8-9"},{"id":"sim06","deck":"sim","type":"sim","q":["Would you please read this statement and confirm all is in order.","בבקשה קראי את ההצהרה הזו ואשרי שהכול בסדר."],"say":"Would you please read this statement and confirm all is in order.","he":"בבקשה קראי את ההצהרה הזו ואשרי שהכול בסדר.","a":["Read the declaration (the car is roadworthy and the insurance cover is in place) and confirm. The tester taps the confirmation on the tablet. If you will not confirm, the test cannot go ahead. If reading is hard, the tester reads it aloud.","לקרוא את ההצהרה (הרכב כשיר לנסיעה והכיסוי הביטוחי קיים) ולאשר. הבוחן לוחץ על האישור בטאבלט. אם לא מאשרים – אי אפשר לבצע את המבחן. אם קשה לקרוא, הבוחן יקרא בקול."],"ans":["\"Yes, all is in order.\"","\"Yes, all is in order.\""],"phase":["In the test-centre room (the desk)","בחדר במרכז המבחנים (ליד השולחן)"],"phaseKey":"room","conf":"official","confLabel":["RSA wording (verbatim)","ניסוח רשמי של ה-RSA (מילה במילה)"],"n":["Older RSA leaflets say you \"sign\" this statement; the 2026 procedure has the tester tap it on the tablet. The paper you sign is the Feedback Form.","עלונים ישנים של ה-RSA אומרים שחותמים על ההצהרה; לפי נוהל 2026 הבוחן לוחץ עליה בטאבלט. מה שחותמים עליו על נייר הוא ה-Feedback Form."],"src":"RSA Standard Procedures (Feb 2026) p.8"},{"id":"sim07","deck":"sim","type":"sim","q":["Thank you. Now I'd like to ask you some questions on the Rules of the Road. If you are unclear on any question, just ask me to repeat the question.","תודה. עכשיו אשאל אותך כמה שאלות על חוקי הדרך. אם שאלה לא ברורה, פשוט בקשי ממני לחזור עליה."],"say":"Thank you. Now I'd like to ask you some questions on the Rules of the Road. If you are unclear on any question, just ask me to repeat the question.","he":"תודה. עכשיו אשאל אותך כמה שאלות על חוקי הדרך. אם שאלה לא ברורה, פשוט בקשי ממני לחזור עליה.","a":["Listen to the whole question. It is fine to say \"Could you repeat that, please?\". You may answer slowly; the tester should allow time and speak so you can follow.","להקשיב לכל השאלה. אפשר להגיד \"Could you repeat that, please?\". מותר לענות לאט; הבוחן אמור לתת זמן ולדבר בצורה שאפשר להבין."],"ans":["\"Could you repeat that, please?\"","\"Could you repeat that, please?\""],"phase":["In the test-centre room (the desk)","בחדר במרכז המבחנים (ליד השולחן)"],"phaseKey":"room","conf":"official","confLabel":["RSA wording (verbatim)","ניסוח רשמי של ה-RSA (מילה במילה)"],"src":"RSA Standard Procedures (Feb 2026) p.9"},{"id":"sim08","deck":"sim","type":"sim","q":["(Rules of the Road questions – no fixed script for the wording of each question)","(שאלות על חוקי הדרך – אין ניסוח קבוע לכל שאלה)"],"say":"(Rules of the Road questions – no fixed script for the wording of each question)","he":"(שאלות על חוקי הדרך – אין ניסוח קבוע לכל שאלה)","a":["14 questions in total: 6 verbal questions, 6 road signs and 2 hand signals; a question that is \"developed\" (follow-up) counts as one. If you cannot answer, the tester moves smoothly to the next question (and may probe briefly if you seem tongue-tied). If English is hard, the tester uses the sign card as a visual aid; an interpreter is possible only if you arranged it with the RSA in advance.","סה\"כ 14 שאלות: 6 שאלות בעל פה, 6 תמרורים ו-2 סימני יד; שאלת המשך נחשבת לשאלה אחת. אם אין לך תשובה – הבוחן עובר הלאה (ואולי ינסה בקצרה אם נראה שאת יודעת ופשוט \"תקועה\"). אם קשה באנגלית הבוחן משתמש ב-sign card כעזר חזותי; מתורגמן אפשרי רק אם תיאמת מראש עם ה-RSA."],"phase":["Oral part: Rules of the Road, signs, hand signals","החלק בעל פה: חוקי הדרך, תמרורים, סימני יד"],"phaseKey":"oral","conf":"official","confLabel":["RSA wording (verbatim)","ניסוח רשמי של ה-RSA (מילה במילה)"],"n":["Number and split are from the RSA procedure. Which specific questions you get is the tester's choice.","המספר והחלוקה מנוהל ה-RSA. אילו שאלות בדיוק – לפי בחירת הבוחן."],"src":"RSA Standard Procedures (Feb 2026) p.10-11"},{"id":"sim09","deck":"sim","type":"sim","q":["What is the sequence of the traffic lights?","מה סדר האורות ברמזור?"],"say":"What is the sequence of the traffic lights?","he":"מה סדר האורות ברמזור?","a":["Obligatory topic #1: Traffic lights. Answer: green, amber, red. Irish lights have no red+amber phase before green.","נושא חובה: רמזורים. תשובה: ירוק, כתום, אדום. ברמזור אירי אין שלב אדום+כתום לפני ירוק."],"phase":["Oral part: Rules of the Road, signs, hand signals","החלק בעל פה: חוקי הדרך, תמרורים, סימני יד"],"phaseKey":"oral","conf":"instructor","confLabel":["Reported by instructors","דווח על ידי מורים"],"n":["The RSA lists the six obligatory topics but not the exact questions; this wording is the one instructors report.","ה-RSA מפרט את ששת נושאי החובה אך לא את השאלות המדויקות; זה הניסוח שמורים מדווחים עליו."],"ref":["r13"],"src":"drivingtesttips.ie/Irish-Driving-Test-Questions.php; RSA Standard Procedures (Feb 2026) p.10 (obligatory topics)"},{"id":"sim10","deck":"sim","type":"sim","q":["What is the difference between a pelican crossing and a zebra crossing?","מה ההבדל בין מעבר pelican למעבר zebra?"],"say":"What is the difference between a pelican crossing and a zebra crossing?","he":"מה ההבדל בין מעבר pelican למעבר zebra?","a":["Obligatory topic #2: Pedestrian crossings. Pelican = controlled by lights; zebra = stripes and flashing beacons, controlled by the presence of pedestrians.","נושא חובה: מעברי חציה. Pelican – נשלט ברמזור; zebra – פסים ופנסים מהבהבים, נשלט על ידי נוכחות הולכי רגל."],"phase":["Oral part: Rules of the Road, signs, hand signals","החלק בעל פה: חוקי הדרך, תמרורים, סימני יד"],"phaseKey":"oral","conf":"instructor","confLabel":["Reported by instructors","דווח על ידי מורים"],"ref":["r16","r17","r18"],"src":"drivingtesttips.ie/Irish-Driving-Test-Questions.php; RSA Standard Procedures (Feb 2026) p.10"},{"id":"sim11","deck":"sim","type":"sim","q":["When should you dip your headlights?","מתי מעמעמים אורות?"],"say":"When should you dip your headlights?","he":"מתי מעמעמים אורות?","a":["Obligatory topic #3: Headlights (dipping). Meeting traffic, following close behind another vehicle, continuously lit roads, snow/fog/heavy rain, dusk/dawn, and generally to avoid inconveniencing others.","נושא חובה: אורות (dipping). כשנפגשים עם תנועה, נוסעים קרוב מאחורי רכב, בכבישים מוארים, בשלג/ערפל/גשם חזק, בדמדומים, ובאופן כללי כדי לא להפריע."],"phase":["Oral part: Rules of the Road, signs, hand signals","החלק בעל פה: חוקי הדרך, תמרורים, סימני יד"],"phaseKey":"oral","conf":"instructor","confLabel":["Reported by instructors","דווח על ידי מורים"],"ref":["r08"],"src":"drivingtesttips.ie/Irish-Driving-Test-Questions.php; RSA Standard Procedures (Feb 2026) p.10"},{"id":"sim12","deck":"sim","type":"sim","q":["What does a continuous white line in the centre of the road mean?","מה פירוש קו לבן רצוף באמצע הכביש?"],"say":"What does a continuous white line in the centre of the road mean?","he":"מה פירוש קו לבן רצוף באמצע הכביש?","a":["Obligatory topic #4: Road markings. Keep to the left; do not cross except for access or in an emergency.","נושא חובה: סימוני כביש. להישאר משמאל; לא לחצות, חוץ מגישה לחצר או מצב חירום."],"phase":["Oral part: Rules of the Road, signs, hand signals","החלק בעל פה: חוקי הדרך, תמרורים, סימני יד"],"phaseKey":"oral","conf":"instructor","confLabel":["Reported by instructors","דווח על ידי מורים"],"ref":["r02","r04","r06"],"src":"drivingtesttips.ie/Irish-Driving-Test-Questions.php; RSA Standard Procedures (Feb 2026) p.10"},{"id":"sim13","deck":"sim","type":"sim","q":["Who has priority at a roundabout? / What is the rule at a junction of equal importance?","למי יש זכות קדימה בכיכר? / מה הכלל בצומת בין כבישים שווי חשיבות?"],"say":"Who has priority at a roundabout? / What is the rule at a junction of equal importance?","he":"למי יש זכות קדימה בכיכר? / מה הכלל בצומת בין כבישים שווי חשיבות?","a":["Obligatory topic #5: Right of way. Give way to traffic already on the roundabout (from your right). At an unmarked junction of equal importance, give way to traffic from your right.","נושא חובה: זכות קדימה. לתת זכות קדימה לתנועה שכבר בכיכר (מימין). בצומת שווה חשיבות ללא תמרורים – לתת זכות קדימה לתנועה מימין."],"phase":["Oral part: Rules of the Road, signs, hand signals","החלק בעל פה: חוקי הדרך, תמרורים, סימני יד"],"phaseKey":"oral","conf":"instructor","confLabel":["Reported by instructors","דווח על ידי מורים"],"ref":["r07","r37"],"src":"drivingtesttips.ie/Irish-Driving-Test-Questions.php; RSA Standard Procedures (Feb 2026) p.10"},{"id":"sim14","deck":"sim","type":"sim","q":["(Shows a road sign) What is this sign, and what does it mean?","(מראה תמרור) איזה תמרור זה ומה פירושו?"],"say":"(Shows a road sign) What is this sign, and what does it mean?","he":"(מראה תמרור) איזה תמרור זה ומה פירושו?","a":["Obligatory topic #6: Road signs – 6 signs. Say the type/shape/colour first (warning = yellow diamond, regulatory = round with red border, information = rectangular), then the meaning and what you must do.","נושא חובה: תמרורים – 6 תמרורים. קודם להגיד סוג/צורה/צבע (אזהרה = מעוין צהוב, חובה/איסור = עגול עם מסגרת אדומה, מידע = מלבן), ואז את המשמעות ומה צריך לעשות."],"phase":["Oral part: Rules of the Road, signs, hand signals","החלק בעל פה: חוקי הדרך, תמרורים, סימני יד"],"phaseKey":"oral","conf":"unverified","confLabel":["Unverified","לא מאומת"],"n":["The RSA does not publish the exact words for the sign questions; \"identify signs by shape and colour\" is from an instructor blog.","ה-RSA לא מפרסם את הניסוח המדויק לשאלות התמרורים; \"זיהוי לפי צורה וצבע\" הוא מבלוג של מורה."],"src":"drivinglessontallaght.ie/blog/rsa-driving-test-questions-ireland (signs identified by shape and colour); RSA Standard Procedures (Feb 2026) p.10"},{"id":"sim15","deck":"sim","type":"sim","q":["(Asks for a hand signal) Can you show me the signal for …?","(מבקש סימן יד) את יכולה להראות לי את הסימן ל…?"],"say":"(Asks for a hand signal) Can you show me the signal for …?","he":"(מבקש סימן יד) את יכולה להראות לי את הסימן ל…?","a":["2 hand-signal questions. Signals to drivers behind (right turn, left turn, slowing/stopping) and signals to a Garda/traffic controller (straight on, turn right, turn left). Use the hand signals page of the Hand-signals deck.","שתי שאלות על סימני יד. סימנים לנהגים מאחור (ימינה, שמאלה, האטה/עצירה) וסימנים לשוטר/מכוון תנועה (ישר, ימינה, שמאלה). לתרגל בחבילת סימני היד."],"phase":["Oral part: Rules of the Road, signs, hand signals","החלק בעל פה: חוקי הדרך, תמרורים, סימני יד"],"phaseKey":"oral","conf":"unverified","confLabel":["Unverified","לא מאומת"],"n":["Number (2) is official; the wording of the request is not published. the project brief lists the same signals.","המספר (2) רשמי; ניסוח הבקשה לא פורסם. בבריף הפרויקט אותם סימנים."],"src":"RSA Standard Procedures (Feb 2026) p.10-11"},{"id":"sim16","deck":"sim","type":"sim","q":["Thank you, that's the end of the oral part of the test. We will now go out to your vehicle for the practical part.","תודה, זה סוף החלק בעל פה של המבחן. עכשיו נצא אל הרכב שלך לחלק המעשי."],"say":"Thank you, that's the end of the oral part of the test. We will now go out to your vehicle for the practical part.","he":"תודה, זה סוף החלק בעל פה של המבחן. עכשיו נצא אל הרכב שלך לחלק המעשי.","a":["Walk out with the tester. If the tester says \"We will be accompanied on the test by my Supervisor / an Official of the RSA who will take no part in conducting the test\", that is normal; refusing the observer means the test is not conducted.","לצאת עם הבוחן. אם הבוחן אומר \"We will be accompanied on the test by my Supervisor / an Official of the RSA who will take no part in conducting the test\" – זה רגיל; סירוב לנוכחות המשקיף = המבחן לא מתבצע."],"phase":["Oral part: Rules of the Road, signs, hand signals","החלק בעל פה: חוקי הדרך, תמרורים, סימני יד"],"phaseKey":"oral","conf":"official","confLabel":["RSA wording (verbatim)","ניסוח רשמי של ה-RSA (מילה במילה)"],"src":"RSA Standard Procedures (Feb 2026) p.11"},{"id":"sim17","deck":"sim","type":"sim","q":["(At the vehicle: no fixed script) – the tester notes the registration and Manual/Automatic and looks at the car.","(ליד הרכב: אין תסריט קבוע) – הבוחן רושם מספר רישוי וידני/אוטומטי ובודק את הרכב."],"say":"(At the vehicle: no fixed script) – the tester notes the registration and Manual/Automatic and looks at the car.","he":"(ליד הרכב: אין תסריט קבוע) – הבוחן רושם מספר רישוי וידני/אוטומטי ובודק את הרכב.","a":["Stand by the driver's door and answer questions. The tester checks: L-plates front and rear, insurance disc, tax disc and NCT, both brake lights, tyres, windscreen, footwear, front passenger door, seat belt and head restraint. A dash-cam must be off; the tester may ask you to show it is off, and may ask you to switch the engine off if you started it.","לעמוד ליד דלת הנהג ולענות. הבוחן בודק: שלט L קדמי ואחורי, דיסק ביטוח, דיסק מס ו-NCT, שני אורות הבלימה, צמיגים, שמשה, הנעלה, דלת הנוסע הקדמית, חגורה ומשענת ראש. דאש-קאם חייב להיות כבוי; הבוחן עשוי לבקש להראות שהוא כבוי ולבקש לכבות מנוע אם התנעת."],"phase":["At the car: technical checks","ליד הרכב: בדיקות טכניות"],"phaseKey":"car","conf":"official-para","confLabel":["RSA procedure (paraphrased)","נוהל ה-RSA (פרפרזה)"],"src":"RSA Standard Procedures (Feb 2026) p.11-14"},{"id":"sim18","deck":"sim","type":"sim","q":["I'd like you to tell me how you would check the tyres.","אני רוצה שתגידי לי איך היית בודקת את הצמיגים."],"say":"I'd like you to tell me how you would check the tyres.","he":"אני רוצה שתגידי לי איך היית בודקת את הצמיגים.","a":["You explain verbally – you are asked about any 3 of the 10 items. Say: tread depth (minimum 1.6 mm), general condition (no cuts, bulges, uneven wear), pressure (as recommended in the handbook/sticker).","מסבירים בעל פה – נשאלים על 3 מתוך 10 הפריטים. להגיד: עומק חריצים (מינימום 1.6 מ\"מ), מצב כללי (בלי חתכים, בליטות, שחיקה לא אחידה), לחץ אוויר (לפי הספר/המדבקה)."],"phase":["At the car: technical checks","ליד הרכב: בדיקות טכניות"],"phaseKey":"car","conf":"official-para","confLabel":["RSA procedure (paraphrased)","נוהל ה-RSA (פרפרזה)"],"n":["The RSA says the applicant is \"asked to verbally explain how they would perform a check on any 3\" of: tyres, lights, reflectors, indicators, engine oil, coolant, wipers and windscreen washer fluid, steering, brakes, horn. The sentence the tester uses is not published; the phrase here is typical, not verbatim.","ה-RSA אומר שהנבחן \"מתבקש להסביר בעל פה כיצד יבצע בדיקה\" ב-3 פריטים מתוך: צמיגים, אורות, מחזירי אור, מחווני כיוון, שמן מנוע, נוזל קירור, מגבים ונוזל שמשה, היגוי, בלמים, צופר. המשפט המדויק של הבוחן לא פורסם; הניסוח כאן אופייני, לא מילה במילה."],"ref":["ck01","ck02","ck03"],"src":"RSA Standard Procedures (Feb 2026) p.11-12; wording typical per instructors (advancedrivingschool.ie/tester-s-terminology)"},{"id":"sim19","deck":"sim","type":"sim","q":["How would you check the lights / the reflectors / the indicators?","איך היית בודקת את האורות / המחזירים / מחווני הכיוון?"],"say":"How would you check the lights / the reflectors / the indicators?","he":"איך היית בודקת את האורות / המחזירים / מחווני הכיוון?","a":["Lights: dipped, main beam, side, rear, number-plate, brake lights – walk round or use a reflection. Reflectors: red, at the rear, clean and intact. Indicators: each side in turn, amber at front, side and rear, dashboard arrow flashes normally.","אורות: נמוכים, גבוהים, צד, אחוריים, לוחית רישוי, בלימה – מסתובבים סביב הרכב או משתמשים בהשתקפות. מחזירי אור: אדומים, מאחור, נקיים ושלמים. מחווני כיוון: כל צד בתורו, כתום קדימה/צד/אחור, החץ בלוח המחוונים מהבהב רגיל."],"phase":["At the car: technical checks","ליד הרכב: בדיקות טכניות"],"phaseKey":"car","conf":"official-para","confLabel":["RSA procedure (paraphrased)","נוהל ה-RSA (פרפרזה)"],"ref":["ck04","ck05","ck06"],"src":"RSA Standard Procedures (Feb 2026) p.11-12"},{"id":"sim20","deck":"sim","type":"sim","q":["How would you check the engine oil / the coolant / the washer fluid? (open the bonnet)","איך היית בודקת את שמן המנוע / נוזל הקירור / נוזל השמשה? (פתחי את מכסה המנוע)"],"say":"How would you check the engine oil / the coolant / the washer fluid? (open the bonnet)","he":"איך היית בודקת את שמן המנוע / נוזל הקירור / נוזל השמשה? (פתחי את מכסה המנוע)","a":["If oil, coolant or wipers/washer fluid is chosen you open the bonnet and close it again securely. Power-steering and brake fluid may be checked the same way. Oil: level ground, engine off a few minutes, dipstick wiped and read between MIN and MAX. Coolant: expansion tank between MIN and MAX, engine cold.","אם נבחר שמן, נוזל קירור או מגבים/נוזל שמשה – פותחים את מכסה המנוע וסוגרים אותו היטב. אפשר לבדוק כך גם נוזל הגה ונוזל בלמים. שמן: משטח ישר, מנוע כבוי כמה דקות, מקל מדידה מנוגב ונקרא בין MIN ל-MAX. נוזל קירור: מיכל ההתפשטות בין MIN ל-MAX, מנוע קר."],"phase":["At the car: technical checks","ליד הרכב: בדיקות טכניות"],"phaseKey":"car","conf":"official-para","confLabel":["RSA procedure (paraphrased)","נוהל ה-RSA (פרפרזה)"],"ref":["ck07","ck08","ck09","ck10","ck11"],"src":"RSA Standard Procedures (Feb 2026) p.12"},{"id":"sim21","deck":"sim","type":"sim","q":["How would you know if there was a fault with the footbrake? … with the handbrake? / How would you check the steering? / the horn?","איך היית יודעת שיש תקלה בבלם הרגל? … בבלם היד? / איך היית בודקת את ההגה? / את הצופר?"],"say":"How would you know if there was a fault with the footbrake? … with the handbrake? / How would you check the steering? / the horn?","he":"איך היית יודעת שיש תקלה בבלם הרגל? … בבלם היד? / איך היית בודקת את ההגה? / את הצופר?","a":["This one is described in the RSA text: \"how would you know if there was a fault with (a) the footbrake or (b) the handbrake\". Footbrake: pedal sinks or feels spongy, car pulls to one side. Handbrake: travels too far, does not hold on a slope. Steering: too loose or too stiff, pulls to one side, vibrates. Horn: press briefly (not 23:30–07:00 in a built-up area).","הניסוח הזה מתואר בטקסט של ה-RSA: \"איך היית יודעת שיש תקלה ב-(א) בלם הרגל או (ב) בלם היד\". בלם רגל: הדוושה שוקעת או \"ספוגית\", הרכב נמשך הצידה. בלם יד: עולה גבוה מדי, לא מחזיק בשיפוע. הגה: רפוי או כבד מדי, נמשך הצידה, רוטט. צופר: ללחוץ קצר (לא 23:30–07:00 באזור בנוי)."],"phase":["At the car: technical checks","ליד הרכב: בדיקות טכניות"],"phaseKey":"car","conf":"official-para","confLabel":["RSA procedure (paraphrased)","נוהל ה-RSA (פרפרזה)"],"ref":["ck12","ck13","ck14","ck15"],"src":"RSA Standard Procedures (Feb 2026) p.12"},{"id":"sim22","deck":"sim","type":"sim","q":["Please start up the engine. Now, before you move off, I want you to show me how you would operate some of the secondary controls.","בבקשה התניעי את המנוע. עכשיו, לפני שאת יוצאת לדרך, אני רוצה שתראי לי איך את מפעילה כמה מהבקרות המשניות."],"say":"Please start up the engine. Now, before you move off, I want you to show me how you would operate some of the secondary controls.","he":"בבקשה התניעי את המנוע. עכשיו, לפני שאת יוצאת לדרך, אני רוצה שתראי לי איך את מפעילה כמה מהבקרות המשניות.","a":["Start the engine, then wait for the instruction for each control.","להתניע ולחכות להוראה לכל בקרה."],"ans":["\"Certainly.\"","\"Certainly.\""],"phase":["In the car, before moving off","ברכב, לפני שיוצאים לדרך"],"phaseKey":"cockpit","conf":"official","confLabel":["RSA wording (verbatim)","ניסוח רשמי של ה-RSA (מילה במילה)"],"src":"RSA Standard Procedures (Feb 2026) p.15"},{"id":"sim23","deck":"sim","type":"sim","q":["Would you switch on the rear window heater, please? (and 2 more)","את יכולה להפעיל את המפשיר של החלון האחורי, בבקשה? (ועוד שתיים)"],"say":"Would you switch on the rear window heater, please? (and 2 more)","he":"את יכולה להפעיל את המפשיר של החלון האחורי, בבקשה? (ועוד שתיים)","a":["You are asked to switch on/off or adjust any 3 of these 10: wiper(s); lights, including dipping the headlights; windscreen washer; fan; air vents; rear window heater (rear demister); air-conditioner (if fitted); temperature control; rear fog lights; air intake control. If the wipers do not work the test is not conducted. Find them all in YOUR car beforehand.","מבקשים להפעיל/לכבות או לכוונן 3 מתוך 10: מגבים; אורות כולל אורות נמוכים; נוזל שמשה; מאוורר; פתחי אוויר; מפשיר חלון אחורי; מזגן (אם יש); בקרת טמפרטורה; אור ערפל אחורי; בקרת כניסת אוויר. אם המגבים לא עובדים – המבחן לא מתקיים. חשוב למצוא את כולם ברכב שלך מראש."],"phase":["In the car, before moving off","ברכב, לפני שיוצאים לדרך"],"phaseKey":"cockpit","conf":"official-para","confLabel":["RSA procedure (paraphrased)","נוהל ה-RSA (פרפרזה)"],"n":["The 10 controls are the RSA list. The request itself (\"Would you switch on …\") is a typical paraphrase. Our Secondary-controls deck also has hazards, main beam, indicators and horn: useful to know, but not on the RSA's list of 10.","10 הבקרות הן הרשימה של ה-RSA. הבקשה עצמה (\"Would you switch on …\") היא פרפרזה אופיינית. בחבילת הבקרות המשניות שלנו יש גם אורות מצוקה, אורות גבוהים, מחווני כיוון וצופר: טוב לדעת, אבל לא ברשימת ה-10 של ה-RSA."],"ref":["sc01","sc03","sc04","sc05","sc07","sc09"],"src":"RSA Standard Procedures (Feb 2026) p.15"},{"id":"sim24","deck":"sim","type":"sim","q":["Thank you. Now, would you please ensure that the seat, seat-belt, head restraint and mirrors are properly adjusted and that your door is properly closed.","תודה. עכשיו, בבקשה ודאי שהמושב, החגורה, משענת הראש והמראות מכוונים כראוי ושהדלת סגורה היטב."],"say":"Thank you. Now, would you please ensure that the seat, seat-belt, head restraint and mirrors are properly adjusted and that your door is properly closed.","he":"תודה. עכשיו, בבקשה ודאי שהמושב, החגורה, משענת הראש והמראות מכוונים כראוי ושהדלת סגורה היטב.","a":["Do it visibly: seat, belt flat and untwisted, head restraint at ear/head height, interior and exterior mirrors, door shut. You may ask the tester to adjust the left exterior mirror for you.","לעשות זאת באופן גלוי: מושב, חגורה שטוחה בלי פיתול, משענת ראש בגובה האוזניים/הראש, מראות פנימית וחיצוניות, דלת סגורה. מותר לבקש מהבוחן לכוונן את המראה השמאלית."],"ans":["\"Ready.\"","\"Ready.\""],"phase":["In the car, before moving off","ברכב, לפני שיוצאים לדרך"],"phaseKey":"cockpit","conf":"official","confLabel":["RSA wording (verbatim)","ניסוח רשמי של ה-RSA (מילה במילה)"],"ref":["ck18","ck16"],"src":"RSA Standard Procedures (Feb 2026) p.15"},{"id":"sim25","deck":"sim","type":"sim","q":["Now, you should drive in your normal manner. I will tell you in good time when to turn left or right, otherwise follow the course of the road. If you have any doubts about my directions, ask me to repeat or clarify them. You may start when you are ready.","עכשיו, תנהגי בצורה הרגילה שלך. אגיד לך בזמן מתי לפנות שמאלה או ימינה, ואחרת פשוט עקבי אחרי הדרך. אם יש לך ספק לגבי ההוראות שלי, בקשי שאחזור או אבהיר. את יכולה להתחיל כשאת מוכנה."],"say":"Now, you should drive in your normal manner. I will tell you in good time when to turn left or right, otherwise follow the course of the road. If you have any doubts about my directions, ask me to repeat or clarify them. You may start when you are ready.","he":"עכשיו, תנהגי בצורה הרגילה שלך. אגיד לך בזמן מתי לפנות שמאלה או ימינה, ואחרת פשוט עקבי אחרי הדרך. אם יש לך ספק לגבי ההוראות שלי, בקשי שאחזור או אבהיר. את יכולה להתחיל כשאת מוכנה.","a":["Mirrors, signal if needed, safety glance over your shoulder, then move off when clear. \"Follow the course of the road\" means: no turn instruction = keep going along the road you are on.","מראות, איתות אם צריך, safety glance מעבר לכתף, ואז יוצאים כשפנוי. \"Follow the course of the road\" = אין הוראת פנייה, ממשיכים בכביש שבו את נמצאת."],"phase":["In the car, before moving off","ברכב, לפני שיוצאים לדרך"],"phaseKey":"cockpit","conf":"official","confLabel":["RSA wording (verbatim)","ניסוח רשמי של ה-RSA (מילה במילה)"],"ref":["mv03","mv18"],"src":"RSA Standard Procedures (Feb 2026) p.15"},{"id":"sim26","deck":"sim","type":"sim","q":["At the next junction turn right.","בצומת הבא פני ימינה."],"say":"At the next junction turn right.","he":"בצומת הבא פני ימינה.","a":["The RSA rule: the tester always says WHERE before WHAT, in good time, and may add directions to avoid confusion. So you hear the place first (\"at the next junction…\") and then the action. Signal early, mirrors, position, observe.","כלל ה-RSA: הבוחן תמיד אומר קודם \"איפה\" ואז \"מה\", בזמן, ויכול להוסיף הנחיות למניעת בלבול. לכן שומעים קודם את המקום (\"at the next junction…\") ואז את הפעולה. לאותת מוקדם, מראות, מיקום, תצפית."],"ans":["If unsure: \"Sorry, could you repeat that, please?\"","אם לא בטוחה: \"Sorry, could you repeat that, please?\""],"phase":["The drive and the manoeuvres","הנסיעה והתמרונים"],"phaseKey":"drive","conf":"official","confLabel":["RSA wording (verbatim)","ניסוח רשמי של ה-RSA (מילה במילה)"],"n":["This sentence is the RSA's own example of the \"where before what\" rule.","המשפט הזה הוא הדוגמה של ה-RSA לכלל \"איפה לפני מה\"."],"src":"RSA Standard Procedures (Feb 2026) p.15"},{"id":"sim27","deck":"sim","type":"sim","q":["At the end of the road turn left.  /  Take the next road on the right.  /  At the roundabout take the second exit.","בסוף הכביש פני שמאלה.  /  פני בכביש הבא ימינה.  /  בכיכר צאי ביציאה השנייה."],"say":"At the end of the road turn left.  /  Take the next road on the right.  /  At the roundabout take the second exit.","he":"בסוף הכביש פני שמאלה.  /  פני בכביש הבא ימינה.  /  בכיכר צאי ביציאה השנייה.","a":["Same pattern: place first, action second. The first two were given to us as typical phrasings; they follow the RSA rule but are not quoted in any RSA document I could read. Do exactly what was said, no extra manoeuvre; if the junction you expected is not obvious, ask to repeat.","אותו דפוס: קודם המקום, אחר כך הפעולה. שני הראשונים נמסרו לנו כניסוחים אופייניים; הם תואמים את כלל ה-RSA אך לא מצוטטים במסמך של ה-RSA שקראתי. לבצע בדיוק מה שנאמר; אם הצומת לא ברור – לבקש שיחזור."],"phase":["The drive and the manoeuvres","הנסיעה והתמרונים"],"phaseKey":"drive","conf":"unverified","confLabel":["Unverified","לא מאומת"],"n":["I could not reach Reddit, boards.ie or YouTube to confirm candidates' reports (blocked/rate-limited), so these variants are UNVERIFIED wording.","לא הצלחתי לגשת ל-Reddit, boards.ie או YouTube כדי לאמת דיווחי נבחנים (חסום/הגבלת קצב), לכן הניסוחים האלה לא מאומתים."],"src":"the project brief (candidate-style phrasings); pattern per RSA Standard Procedures (Feb 2026) p.15"},{"id":"sim28","deck":"sim","type":"sim","q":["Where convenient, please pull in and stop on the left.","כשנוח, בבקשה היכנסי לשול ועצרי בצד שמאל."],"say":"Where convenient, please pull in and stop on the left.","he":"כשנוח, בבקשה היכנסי לשול ועצרי בצד שמאל.","a":["This is the RSA's phrase before the turnabout (and also the style used for any pull-in). Mirror, signal left, stop parallel and reasonably close to the kerb in a safe spot (clear view, away from driveways/junctions), handbrake, cancel the signal.","זה הביטוי של ה-RSA לפני ה-turnabout (וגם הסגנון לכל עצירה בצד). מראה, איתות שמאלה, לעצור במקביל וקרוב למדרכה במקום בטוח (ראות טובה, רחוק ממבואות וצמתים), בלם יד, לבטל איתות."],"phase":["The drive and the manoeuvres","הנסיעה והתמרונים"],"phaseKey":"drive","conf":"official","confLabel":["RSA wording (verbatim)","ניסוח רשמי של ה-RSA (מילה במילה)"],"n":["Your brief mentions \"pull in on the left at a safe place\": the official words are \"Where convenient please pull in and stop on the left\". \"At a safe place\" is an instructor paraphrase.","בבריף מופיע \"pull in on the left at a safe place\": הניסוח הרשמי הוא \"Where convenient please pull in and stop on the left\". \"At a safe place\" הוא פרפרזה של מורים."],"src":"RSA Standard Procedures (Feb 2026) p.17; smartdrivingacademy.ie/articles/driving-test-manoeuvres-ireland.html"},{"id":"sim29","deck":"sim","type":"sim","q":["I would like you to turn your car around on the road to face the opposite way. You may go over and back more than once if necessary. You may start when you are ready.","אני רוצה שתסובבי את הרכב על הכביש כך שיפנה לכיוון ההפוך. מותר לעבור הלוך וחזור יותר מפעם אחת אם צריך. את יכולה להתחיל כשאת מוכנה."],"say":"I would like you to turn your car around on the road to face the opposite way. You may go over and back more than once if necessary. You may start when you are ready.","he":"אני רוצה שתסובבי את הרכב על הכביש כך שיפנה לכיוון ההפוך. מותר לעבור הלוך וחזור יותר מפעם אחת אם צריך. את יכולה להתחיל כשאת מוכנה.","a":["This is the turnabout. It does not have to be a three-point turn: take as many moves as the road needs. Full all-round observation before every move, slow speed, no kerb, give way to traffic. On completion the tester tells you to pull in and stop (or drive on), then: \"When you are ready you can move off.\"","זה ה-turnabout. לא חייב להיות סיבוב של 3 נקודות: כמה תנועות שהכביש דורש. תצפית מלאה מסביב לפני כל תנועה, מהירות איטית, בלי לגעת במדרכה, לתת זכות קדימה. בסיום הבוחן יבקש לעצור (או להמשיך), ואז: \"When you are ready you can move off.\""],"ans":["Refusing the turnabout (or the reverse) ends the test with no result.","סירוב לבצע turnabout (או reverse) מסיים את המבחן בלי תוצאה."],"phase":["The drive and the manoeuvres","הנסיעה והתמרונים"],"phaseKey":"drive","conf":"official","confLabel":["RSA wording (verbatim)","ניסוח רשמי של ה-RSA (מילה במילה)"],"ref":["mv06"],"src":"RSA Standard Procedures (Feb 2026) p.17; smartdrivingacademy.ie/articles/driving-test-manoeuvres-ireland.html"},{"id":"sim30","deck":"sim","type":"sim","q":["Before you come to the next road on the left, please pull in and stop. This road on the left is the one I want you to reverse your vehicle into. Will you drive past it and stop on the left, and I will give you further directions.","לפני שתגיעי לכביש הבא משמאל, בבקשה עצרי בצד. הכביש הזה משמאל הוא זה שאני רוצה שתתחילי לנסוע אחורה לתוכו. בבקשה עברי אותו ועצרי בצד שמאל, ואתן לך הנחיות נוספות."],"say":"Before you come to the next road on the left, please pull in and stop. This road on the left is the one I want you to reverse your vehicle into. Will you drive past it and stop on the left, and I will give you further directions.","he":"לפני שתגיעי לכביש הבא משמאל, בבקשה עצרי בצד. הכביש הזה משמאל הוא זה שאני רוצה שתתחילי לנסוע אחורה לתוכו. בבקשה עברי אותו ועצרי בצד שמאל, ואתן לך הנחיות נוספות.","a":["Drive past the side road and stop on the left, parallel and close to the kerb, far enough past the corner that you can see into the side road.","לנסוע מעבר לכביש הצדדי ולעצור בצד שמאל, במקביל וקרוב למדרכה, רחוק מספיק אחרי הפינה כדי לראות לתוך הכביש הצדדי."],"phase":["The drive and the manoeuvres","הנסיעה והתמרונים"],"phaseKey":"drive","conf":"official","confLabel":["RSA wording (verbatim)","ניסוח רשמי של ה-RSA (מילה במילה)"],"n":["Official text: \"road on the left/right\". Cars reverse along the LEFT kerb. If the tester cannot stop you before the junction, an extra stop is done later on the route.","בנוסח הרשמי: \"road on the left/right\". במכונית מבצעים reverse לאורך המדרכה השמאלית. אם הבוחן לא הספיק לעצור אותך לפני הצומת – תהיה עצירה נוספת בהמשך המסלול."],"src":"RSA Standard Procedures (Feb 2026) p.17; smartdrivingacademy.ie/articles/driving-test-manoeuvres-ireland.html"},{"id":"sim31","deck":"sim","type":"sim","q":["Reverse into this road on the left. You should continue reversing, while it is safe to do so, keeping reasonably close to the left. I'll tell you when you have gone back far enough. You may start when you are ready.","סעי אחורה לתוך הכביש הזה משמאל. המשיכי לנסוע אחורה כל עוד זה בטוח, תוך שמירה על קרבה סבירה לשמאל. אגיד לך מתי נסעת מספיק אחורה. את יכולה להתחיל כשאת מוכנה."],"say":"Reverse into this road on the left. You should continue reversing, while it is safe to do so, keeping reasonably close to the left. I'll tell you when you have gone back far enough. You may start when you are ready.","he":"סעי אחורה לתוך הכביש הזה משמאל. המשיכי לנסוע אחורה כל עוד זה בטוח, תוך שמירה על קרבה סבירה לשמאל. אגיד לך מתי נסעת מספיק אחורה. את יכולה להתחיל כשאת מוכנה.","a":["Look all round (both shoulders and the rear window, not only mirrors), go slowly, keep a steady distance from the kerb through the corner, stop for any pedestrian or car. About three car lengths; the tester says when to stop. Then: \"When you are ready you can move off.\" You may ask the tester to help adjust the left door mirror and put it back afterwards.","להסתכל מסביב (שתי הכתפיים וחלון אחורי, לא רק מראות), לנסוע לאט, לשמור מרחק קבוע מהמדרכה לאורך הפינה, לעצור לכל הולך רגל או רכב. בערך שלושה אורכי רכב; הבוחן אומר מתי לעצור. אחר כך: \"When you are ready you can move off.\" מותר לבקש מהבוחן לכוונן את מראת הדלת השמאלית ולהחזיר אחר כך."],"phase":["The drive and the manoeuvres","הנסיעה והתמרונים"],"phaseKey":"drive","conf":"official","confLabel":["RSA wording (verbatim)","ניסוח רשמי של ה-RSA (מילה במילה)"],"n":["Your brief quotes \"I'd like you to reverse around this corner\". That is not the RSA wording: the official script is the two sentences on the previous card and this one. Expect the official wording; the paraphrase would mean the same.","בבריף מצוטט \"I'd like you to reverse around this corner\". זה לא הניסוח של ה-RSA: התסריט הרשמי הוא שני המשפטים בכרטיס הקודם ובכרטיס הזה. לצפות לניסוח הרשמי; הפרפרזה משמעותה זהה."],"ref":["mv05"],"src":"RSA Standard Procedures (Feb 2026) p.17; smartdrivingacademy.ie/articles
