<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b7a4b">
<title>RSA Driving Test Trainer / אימון למבחן הנהיגה</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#1b2a24;--mut:#62736b;--pri:#0b7a4b;--pri2:#0a5f3b;--acc:#f4b400;--bad:#c62828;--ok:#1b8f4a;--line:#dbe4df;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:17px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew","Arial Hebrew",Arial,sans-serif;line-height:1.45}
#app{max-width:620px;margin:0 auto;min-height:100vh;padding-bottom:40px}
.main{padding:12px 14px}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--pri);color:#fff;box-shadow:0 2px 6px #0003}
.top .ttl{flex:1;font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib,.lang{min-width:44px;height:44px;border:0;border-radius:12px;background:#ffffff26;color:#fff;font-size:1.15rem}
.lang{font-weight:800;background:var(--acc);color:#222;font-size:1rem;min-width:54px}
.chip{background:#ffffff26;border-radius:20px;padding:4px 10px;font-weight:700;white-space:nowrap}
.panel{background:var(--card);border-radius:var(--r);padding:14px;margin:0 0 12px;box-shadow:0 1px 4px #0001}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.big{font-size:1.25rem;font-weight:800}
.muted{color:var(--mut)}.small{font-size:.8rem}.center{text-align:center}
.bar{height:10px;background:#e3ebe7;border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#34b36b,#f4b400);border-radius:6px;transition:width .5s}
.road{position:relative;height:54px;margin-top:8px;background:#4a4f55;border-radius:10px;overflow:hidden}
.road .lane{position:absolute;left:0;right:0;top:50%;height:0;border-top:3px dashed #f5f5f5}
.road .car{position:absolute;top:14px;transition:left 1s ease}
.road .mile{position:absolute;top:2px;font-size:.9rem;color:#fff}.road .mile.end{right:4px;font-size:1.2rem}
.actions{display:grid;gap:10px;margin:0 0 14px}
.btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:56px;padding:12px 16px;border:2px solid var(--line);background:#fff;border-radius:var(--r);text-align:start;font-size:1rem}
.btn small{color:var(--mut);font-size:.8rem}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}.btn.primary small{color:#d6f3e4}
.btn.danger{border-color:#e6b3b3;color:var(--bad)}
.btn.wide{width:100%;align-items:center;margin-top:12px}
.btn:active,.opt:active,.deck:active{transform:scale(.98)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.deck{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:start;padding:12px;min-height:116px;background:#fff;border:2px solid var(--line);border-radius:var(--r)}
.deck .ico{font-size:1.6rem}.deck b{font-size:.95rem}.deck small{color:var(--mut);font-size:.75rem}.deck .bar{width:100%;margin-top:auto}
.h{margin:8px 0 6px;font-size:1.2rem}
.card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:0 2px 8px #0002;margin-top:8px}
.ctop{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}.ctop .sp{flex:1}
.tag{background:#e8f3ed;color:var(--pri2);border-radius:12px;padding:2px 9px;font-size:.72rem;font-weight:600}.tag.book{background:#fff3cd;color:#7a5b00}
.mini{min-width:44px;height:40px;padding:0 10px;border:2px solid var(--line);border-radius:12px;background:#fff;font-weight:700}
.q{font-size:1.18rem;font-weight:700;margin:4px 0 6px}.q.small{font-size:.95rem}
.phase{font-size:.78rem;font-weight:700;color:var(--pri2);margin-bottom:4px}
.say{font-size:1.15rem;font-weight:700;background:#eef3fb;border-inline-start:4px solid #1565c0;padding:10px 12px;border-radius:10px;margin:4px 0 8px;text-align:start}
.conf{display:inline-block;margin-top:8px;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:12px;background:#e8f3ed;color:var(--pri2)}
.conf-official-para{background:#fff3cd;color:#7a5b00}.conf-instructor{background:#fde7d3;color:#8a3b00}.conf-unverified{background:#fdeaea;color:var(--bad)}
.qen{font-size:.85rem;color:var(--mut);margin-bottom:6px}
.svgbox{display:flex;justify-content:center;margin:8px 0}.svgbox svg{width:min(190px,60vw);height:auto;max-height:190px}
.opts{display:grid;gap:10px;margin-top:10px}
.opt{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:start;min-height:56px;padding:12px 14px;border:2px solid var(--line);background:#fff;border-radius:14px;font-size:1rem}
.opt .s{font-size:.78rem;color:var(--mut)}
.opt.ok{border-color:var(--ok);background:#e5f6ec}.opt.bad{border-color:var(--bad);background:#fdeaea}.opt.sel{border-color:var(--pri);background:#e8f3ed}
.opt:disabled{opacity:1}
.fb{margin:12px 0 6px;padding:10px 12px;border-radius:12px;font-weight:700}.fb.good{background:#e5f6ec;color:#12683a;animation:pop .35s}.fb.bad{background:#fdeaea;color:var(--bad)}
.answer{background:#f6faf8;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.alabel{font-size:.72rem;text-transform:uppercase;color:var(--mut);letter-spacing:.04em}
.aname{font-weight:800;margin:2px 0}.atext{white-space:pre-line}
.note{margin-top:8px;font-size:.9rem;background:#fff8e1;padding:8px;border-radius:10px}.note.ie{background:#e8f0fe}
.src{margin-top:8px;font-size:.72rem;color:var(--mut);direction:ltr;text-align:start}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.grades button{min-height:54px;border-radius:12px;border:0;font-weight:700;color:#fff;font-size:.85rem}
.g0{background:#c62828}.g1{background:#ef6c00}.g2{background:#2e7d32}.g3{background:#1565c0}
.prog{display:flex;align-items:center;gap:10px;font-size:.85rem}.prog .bar{flex:1}
.combo{font-weight:800;color:var(--mut)}.combo.hot{color:#e65100;animation:pop .4s}
.trophy{font-size:3rem}
.rev{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:8px 0}
.rev summary{cursor:pointer;font-weight:600;min-height:40px;display:flex;align-items:center;gap:8px}
.thumb svg{width:44px;height:44px}
.search{width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;font:inherit;margin:6px 0 10px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}.kpis div{background:#fff;border-radius:12px;padding:8px 2px}.kpis b{display:block;font-size:1.05rem}.kpis small{font-size:.65rem;color:var(--mut)}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.badge{background:#eceff1;border-radius:14px;padding:10px;text-align:center;opacity:.6;display:flex;flex-direction:column;gap:2px}.badge.got{background:#fff8e1;opacity:1;box-shadow:0 1px 4px #0002}
.badge .bi{font-size:1.8rem}.badge small{font-size:.7rem;color:var(--mut)}
.drow{display:flex;justify-content:space-between;margin-top:6px;font-size:.9rem}
.hist{padding-inline-start:20px}
.set{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.set input[type=checkbox]{width:26px;height:26px}
.seg{display:flex;gap:6px}.seg button{min-width:52px;min-height:44px;border:2px solid var(--line);background:#fff;border-radius:12px}.seg .on{background:var(--pri);color:#fff;border-color:var(--pri)}
.code{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px;font-family:monospace;font-size:.75rem;margin:10px 0}
.warn{background:#fff3cd;padding:10px;border-radius:10px;font-size:.85rem}
#toasts{position:fixed;left:0;right:0;bottom:16px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:50;pointer-events:none}
.toast{background:#222;color:#fff;padding:10px 16px;border-radius:22px;max-width:92vw;font-weight:600;animation:pop .3s}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.6s ease-in forwards}
.shake{animation:shake .4s}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(720deg);opacity:.9}}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(.85);opacity:.4}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.confetti{display:none}}
@media (min-width:520px){.grid{grid-template-columns:1fr 1fr 1fr}}
@media (max-width:360px){html{font-size:15px}.top .ttl{display:none}}

.exrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;margin:10px 0 4px}.exrow figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:3px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 4px}.exrow svg{width:64px;height:64px}.exrow figcaption{font-size:.7rem;color:var(--mut);text-align:center;line-height:1.2}

</style>
</head>
<body>
<div id="app"></div>
<div id="toasts" aria-live="polite"></div>
<noscript>This trainer needs JavaScript. / האתר צריך JavaScript.</noscript>
<script id="data" type="application/json">{"cards":[{"id":"r01","deck":"room","type":"room","q":["When can you overtake on the left?","מתי מותר לעקוף משמאל?"],"a":["Normally you overtake on the RIGHT. You may overtake on the left only when: (1) you want to go straight ahead and the driver in front has moved out and signalled right; (2) you have signalled that you are turning left; (3) traffic in both lanes is moving slowly but the left lane is moving faster than the right lane.","בדרך כלל עוקפים מימין (נוסעים בשמאל!). עקיפה משמאל מותרת רק כש: (1) את ממשיכה ישר והנהג שלפניך זז החוצה ואותת ימינה; (2) הפעלת איתות שמאלה ואת מתכוונת לפנות שמאלה; (3) התנועה בשני הנתיבים איטית אבל הנתיב השמאלי מהיר יותר מהימני."],"s":["Only in 3 cases: car ahead turning right, you turning left, slow traffic where the left lane moves faster","רק ב-3 מקרים: הרכב שלפניך פונה ימינה, את פונה שמאלה, תנועה איטית שבה הנתיב השמאלי מהיר יותר"],"w":[["Whenever the car in front is going slowly","בכל פעם שהרכב שלפניך נוסע לאט"],["Any time on a dual carriageway","בכל זמן בכביש מפוצל"],["Whenever there is a gap on the left","בכל פעם שיש רווח משמאל"]],"n":["In the candidate's study book this is Q1 plus a Q2 whose heading is garbled (\"When you have signalled that you intend to turn left\") – together they are the three cases above.","בספר הלימוד של המועמדת זו שאלה 1 ושאלה 2 עם כותרת משובשת (\"When you have signalled that you intend to turn left\") – יחד הן שלושת המקרים שלמעלה."],"ie":["Ireland drives on the left, so normal overtaking is on the right (opposite to Israel).","באירלנד נוסעים בצד שמאל ולכן עוקפים בדרך כלל מימין (הפוך מישראל)."],"src":"Book Q1-Q2; RoR p.57, Bank","book":[1,2]},{"id":"r02","deck":"room","type":"room","q":["What does a solid (continuous) white line in the centre of the road mean?","מה פירוש קו לבן רצוף באמצע הכביש?"],"a":["All traffic must keep to the left of the line. You must not cross it except for access or in an emergency. (Single or double continuous lines mean the same.)","כל התנועה חייבת להישאר משמאל לקו. אסור לחצות אותו, חוץ מכניסה/יציאה לחצר או מצב חירום. (קו בודד או כפול – אותו דבר.)"],"s":["Stay to the left; do not cross except for access or emergency","להישאר משמאל; לא לחצות, חוץ מגישה/חירום"],"w":[["You may cross it to overtake if the road is clear","מותר לחצות כדי לעקוף אם הכביש פנוי"],["It only applies at night","זה חל רק בלילה"],["It marks a bus lane","זה מסמן נתיב אוטובוסים"]],"src":"Book Q3; RoR p.75, Bank","book":[3]},{"id":"r03","deck":"room","type":"room","q":["What does a broken yellow line along the side of the road mean?","מה פירוש קו צהוב מקוטע בצד הכביש?"],"a":["The road has a hard shoulder, normally for pedestrians and cyclists. You may pull in briefly to let faster traffic overtake, if no pedestrians, cyclists, junctions or entrances are nearby, but do not keep driving in it.","יש בכביש שול (hard shoulder) המיועד בדרך כלל להולכי רגל ורוכבי אופניים. מותר להיכנס אליו לרגע כדי לאפשר לרכב מהיר לעקוף, אם אין שם הולכי רגל/אופניים/צמתים/כניסות – אבל לא להמשיך לנסוע בו."],"s":["A hard shoulder – may use it briefly to let traffic pass","שול – מותר להשתמש בו לרגע כדי לתת לרכב לעקוף"],"w":[["No parking at any time","אסור לחנות בכל שעה"],["No parking during certain hours","אסור לחנות בשעות מסוימות"],["A bus lane","נתיב אוטובוסים"]],"src":"Book Q4; RoR p.75, Bank","book":[4]},{"id":"r04","deck":"room","type":"room","q":["What do double broken white lines along the centre of the road mean?","מה פירוש שני קווים לבנים מקווקווים באמצע הכביש?"],"a":["They warn that continuous white lines begin a short distance ahead. You must not cross them unless it is safe to do so.","הם מתריעים שבהמשך מתחילים קווים רצופים. אסור לחצות אותם אלא אם בטוח לעשות זאת."],"s":["Warning: continuous white lines coming up ahead","אזהרה: בהמשך מתחילים קווים לבנים רצופים"],"w":[["A bus lane begins ahead","בהמשך מתחיל נתיב אוטובוסים"],["Overtaking is always allowed","עקיפה תמיד מותרת"],["The road is a dual carriageway","הכביש הוא כביש מפוצל"]],"src":"Book Q5; RoR p.75, Bank","book":[5]},{"id":"r05","deck":"room","type":"room","q":["At a Stop sign that has no white line, where should you stop?","בתמרור עצור (STOP) שאין לידו קו לבן – איפה עוצרים?"],"a":["You must stop at the sign. At a Stop sign you must always come to a complete stop, even if the road looks empty.","עוצרים ליד התמרור עצמו. בתמרור עצור חייבים לעצור לגמרי, גם אם הכביש נראה ריק."],"s":["At the sign","ליד התמרור"],"w":[["Just past the sign, to see better","מעט אחרי התמרור כדי לראות טוב יותר"],["Only slow down if the road is clear","רק מאטים אם הכביש פנוי"],["15 metres before the sign","15 מטר לפני התמרור"]],"src":"Book Q6; RoR p.126, Bank","book":[6],"ex":[{"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003cpolygon points=\"92.5,67.6 67.6,92.5 32.4,92.5 7.5,67.6 7.5,32.4 32.4,7.5 67.6,7.5 92.5,32.4\" fill=\"#d71920\" stroke=\"#fff\" stroke-width=\"3\"/>\u003cpolygon points=\"92.5,67.6 67.6,92.5 32.4,92.5 7.5,67.6 7.5,32.4 32.4,7.5 67.6,7.5 92.5,32.4\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" transform=\"translate(50 50) scale(.9) translate(-50 -50)\"/>\u003ctext x=\"50\" y=\"60\" text-anchor=\"middle\" font-family=\"Arial,Helvetica,sans-serif\" font-weight=\"700\" font-size=\"27\" fill=\"#fff\" >STOP\u003c/text>\u003c/svg>","l":["Stop sign","תמרור עצור"]},{"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003crect width=\"100\" height=\"100\" fill=\"#4a4a4a\"/>\u003crect x=\"0\" y=\"62\" width=\"100\" height=\"7\" fill=\"#fff\"/>\u003cg transform=\"translate(58 6) scale(.4)\">\u003cpolygon points=\"92.5,67.6 67.6,92.5 32.4,92.5 7.5,67.6 7.5,32.4 32.4,7.5 67.6,7.5 92.5,32.4\" fill=\"#d71920\" stroke=\"#fff\" stroke-width=\"3\"/>\u003cpolygon points=\"92.5,67.6 67.6,92.5 32.4,92.5 7.5,67.6 7.5,32.4 32.4,7.5 67.6,7.5 92.5,32.4\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" transform=\"translate(50 50) scale(.9) translate(-50 -50)\"/>\u003ctext x=\"50\" y=\"60\" text-anchor=\"middle\" font-family=\"Arial,Helvetica,sans-serif\" font-weight=\"700\" font-size=\"27\" fill=\"#fff\" >STOP\u003c/text>\u003c/g>\u003crect x=\"76\" y=\"44\" width=\"3\" height=\"18\" fill=\"#bbb\"/>\u003ctext x=\"30\" y=\"88\" text-anchor=\"middle\" font-family=\"Arial,Helvetica,sans-serif\" font-weight=\"700\" font-size=\"14\" fill=\"#fff\">STOP\u003c/text>\u003c/svg>","l":["Stop line on the road","קו עצירה על הכביש"]}]},{"id":"r06","deck":"room","type":"room","q":["Where there is a continuous and a broken white line along the centre of the road, which one do you obey?","כשיש באמצע הכביש קו רצוף וקו מקוטע – לאיזה מהם מצייתים?"],"a":["You obey the line that is nearest to you.","מצייתים לקו הקרוב אליך."],"s":["The line nearest to you","הקו הקרוב אליך"],"w":[["Always the continuous line","תמיד הקו הרצוף"],["Always the broken line","תמיד הקו המקוטע"],["The one nearest the kerb","הקו הקרוב יותר למדרכה"]],"src":"Book Q7; RoR p.75, Bank","book":[7]},{"id":"r07","deck":"room","type":"room","q":["Who has priority at a roundabout?","למי יש זכות קדימה בכיכר?"],"a":["You must give way (yield) to traffic already on the roundabout – traffic coming from your right (roundabouts go clockwise). Keep moving if the way is clear.","חייבים לתת זכות קדימה (Yield) לתנועה שכבר נמצאת בכיכר – התנועה שמגיעה מימין (הכיכרות נוסעות עם כיוון השעון). אם הדרך פנויה ממשיכים בלי לעצור."],"s":["Traffic already on the roundabout (from your right)","התנועה שכבר בכיכר (מימין)"],"w":[["Traffic entering from the left","תנועה שנכנסת משמאל"],["The largest vehicle","הרכב הגדול ביותר"],["Whoever arrives first at the entry","מי שמגיע ראשון לכניסה"]],"src":"Book Q8; RoR p.136, Bank","book":[8]},{"id":"r08","deck":"room","type":"room","q":["When driving, when should you use dipped headlights?","מתי משתמשים באורות נמוכים (dipped)?"],"a":["When meeting other traffic; when following close behind another vehicle; on continuously lit roads; in dense fog, snow or heavy rain; when daylight is fading; and generally to avoid inconveniencing other traffic.","כשנפגשים עם תנועה; כשנוסעים קרוב מאחורי רכב; בכבישים מוארים ברציפות; בערפל כבד, שלג או גשם חזק; כשהאור דועך; ובאופן כללי כדי לא להפריע לנהגים אחרים."],"s":["Meeting traffic, following another car, lit roads, fog/snow/heavy rain, fading light","פגישה עם תנועה, נסיעה אחרי רכב, כבישים מוארים, ערפל/שלג/גשם, דמדומים"],"w":[["Only in total darkness","רק בחושך מוחלט"],["Only on motorways","רק בכבישים מהירים"],["Never in built-up areas","אף פעם לא בתוך עיר"]],"src":"Book Q9; RoR p.64","book":[9]},{"id":"r09","deck":"room","type":"room","q":["What should you do if you are dazzled by another vehicle's headlights?","מה עושים כשמסנוורים אותך אורות של רכב אחר?"],"a":["Slow down and stop if necessary. Watch for pedestrians and cyclists on your side. If the dazzle is from an oncoming vehicle, look towards the left verge until it has passed. If it is from behind and reflected in your mirror, use the mirror's night-driving mode.","מאטים ועוצרים אם צריך. שימו לב להולכי רגל ואופניים בצד שלכם. אם הסנוור מרכב שמגיע ממול – מביטים לכיוון שולי הכביש השמאליים עד שהוא עובר. אם הסנוור מרכב מאחור דרך המראה – מפעילים מצב לילה במראה."],"s":["Slow down (stop if needed), look to the left verge","מאטים (ועוצרים אם צריך), מביטים לשול השמאלי"],"w":[["Flash your headlights back","מהבהבים אורות בחזרה"],["Look straight at the lights to see the road","מסתכלים ישר על האורות כדי לראות את הכביש"],["Speed up to get past quickly","מאיצים כדי לעבור מהר"]],"src":"Book Q10; RoR p.65, Bank","book":[10]},{"id":"r10","deck":"room","type":"room","q":["What restrictions are there on using the horn?","אילו הגבלות יש על שימוש בצופר?"],"a":["Do not use the horn in a built-up area between 11.30 at night and 7 in the morning, unless there is a traffic emergency. Only use it to warn others of danger or make them aware of you; it never gives you right of way.","אסור להשתמש בצופר באזור בנוי בין 23:30 ל-7:00, אלא במצב חירום בכביש. משתמשים בו רק כדי להזהיר מסכנה או להודיע על נוכחותכם; הוא לא נותן זכות קדימה."],"s":["Not in built-up areas 11.30 pm – 7 am (except emergency)","לא באזור בנוי בין 23:30 ל-7:00 (חוץ ממצב חירום)"],"w":[["Not between 9 pm and 6 am","לא בין 21:00 ל-6:00"],["Not in a built-up area at any time","לא באזור בנוי בשום שעה"],["No restrictions","אין הגבלות"]],"ie":["In Israel honking is common; in Ireland it is for danger only.","בישראל צופרים הרבה; באירלנד הצופר רק להזהרה מסכנה."],"src":"Book Q11; RoR p.66, Bank","book":[11]},{"id":"r11","deck":"room","type":"room","q":["Within what distance from the kerb should you park?","עד איזה מרחק מהמדרכה צריך לחנות?"],"a":["Within 45 cm (about 18 inches) of the kerb – park close to and parallel with the kerb.","עד 45 ס\"מ (כ-18 אינץ') מהמדרכה – חונים קרוב למדרכה ובמקביל אליה."],"s":["Within 45 cm","עד 45 ס\"מ"],"w":[["Within 1 metre","עד מטר אחד"],["Within 15 cm","עד 15 ס\"מ"],["Within 2 metres","עד 2 מטר"]],"n":["The 45 cm figure comes from the candidate's study book and the instructors' question bank; the RSA Rules of the Road only say \"close to and parallel with the kerb\".","המספר 45 ס\"מ מופיע בספר הלימוד של המועמדת ובמאגר השאלות של המורים; ספר החוקים של ה-RSA אומר רק \"קרוב ובמקביל למדרכה\"."],"src":"Book Q12; Bank (45 cm not in RoR), RoR p.139","book":[12]},{"id":"r12","deck":"room","type":"room","q":["Where should you not overtake?","איפה אסור לעקוף?"],"a":["Near a pedestrian crossing; where a sign or road marking forbids it; approaching a junction; approaching a bend, dip, hump-back bridge, brow of a hill or on a narrow road; over or near a continuous white line; where it would obstruct a sign or an entrance; opposite another vehicle on a narrow road; at a taxi rank; if it would cause danger or inconvenience to another road user.","ליד מעבר חציה; איפה שתמרור או סימון אוסר; ליד או מעל קו לבן רצוף; בהתקרבות לצומת; בהתקרבות לעיקול, שקע בכביש, גשר גבנוני, פסגת גבעה או בכביש צר; כשזה יפריע לכניסה או יסתיר תמרור; מול רכב אחר בכביש צר; בתחנת מוניות; כשזה יסכן או יפריע למשתמש דרך אחר."],"s":["Near a bend, hill brow, hump-back bridge, junction or crossing, or over a continuous line","ליד עיקול, פסגת גבעה, גשר גבנוני, צומת או מעבר חציה, או מעל קו רצוף"],"w":[["On a straight road in daylight","בכביש ישר באור יום"],["On the left side of a dual carriageway","בצד שמאל של כביש מפוצל"],["Behind a vehicle that is signalling left","מאחורי רכב שמאותת שמאלה"]],"src":"Book Q13; RoR p.57, Bank","book":[13]},{"id":"r13","deck":"room","type":"room","q":["What is the sequence of traffic lights?","מה סדר האורות ברמזור?"],"a":["Green, Amber, Red (then back to green). At pedestrian (pelican) crossings the amber light flashes after the red.","ירוק, כתום, אדום (ואז שוב ירוק). במעבר חציה עם רמזור (pelican) הכתום מהבהב אחרי האדום."],"s":["Green – Amber – Red","ירוק – כתום – אדום"],"w":[["Red – Amber – Green","אדום – כתום – ירוק"],["Green – Red – Amber","ירוק – אדום – כתום"],["Red – Green – Amber","אדום – ירוק – כתום"]],"ie":["Unlike the UK and Israel, Irish lights go straight from red to green – there is NO red+amber phase before green (instructor sources; RoR does not list it). Do not start moving on red+amber habit.","בניגוד לבריטניה ולישראל, ברמזור אירי עוברים ישר מאדום לירוק – אין שלב אדום+כתום לפני הירוק (לפי מורים; הספר לא מציין זאת). לא להתחיל לנסוע מתוך הרגל של אדום+כתום."],"src":"Book Q14; RoR p.108-109, Bank","book":[14]},{"id":"r14","deck":"room","type":"room","q":["What does a clearway mean?","מה פירוש Clearway?"],"a":["An area of road that must be kept clear for moving traffic at the times shown on the plate (usually busy periods). You may stop only if you are waiting in a line of traffic – no parking, even where disc or metered parking is normally allowed.","קטע כביש שחייב להישאר פנוי לתנועה בשעות המצוינות על השלט (בדרך כלל שעות עומס). מותר לעצור רק אם ממתינים בתור התנועה – אסור לחנות, גם במקום שבדרך כלל מותרת בו חניה בתשלום/בדיסק."],"s":["Kept clear for traffic at set times – no parking, stop only in a queue","פנוי לתנועה בשעות מסוימות – אסור לחנות, עוצרים רק בתור"],"w":[["Parking allowed outside rush hour only for 30 min","מותר לחנות מחוץ לשעות עומס עד 30 דקות"],["A bus-only road","כביש לאוטובוסים בלבד"],["A road with no speed limit","כביש בלי הגבלת מהירות"]],"src":"Book Q15; RoR p.141, Bank","book":[15]},{"id":"r15","deck":"room","type":"room","q":["What rules apply to a yellow box junction?","אילו כללים חלים על צומת עם קופסה צהובה (yellow box)?"],"a":["You must not enter the yellow box unless you can clear it without stopping. Exception: when turning right you may enter and wait for a gap in oncoming traffic, as long as you do not block other traffic that has priority.","אסור להיכנס לקופסה הצהובה אלא אם אפשר לצאת ממנה בלי לעצור. חריג: בפנייה ימינה מותר להיכנס ולחכות לרווח בתנועה הנגדית, כל עוד לא חוסמים תנועה שיש לה זכות קדימה."],"s":["Do not enter unless your exit is clear (except waiting to turn right)","לא נכנסים אלא אם היציאה פנויה (חוץ מהמתנה לפנייה ימינה)"],"w":[["Stop inside the box and wait for the lights","עוצרים בתוך הקופסה וממתינים לרמזור"],["It is a parking area for 5 minutes","זה אזור חניה ל-5 דקות"],["Only buses may enter","רק אוטובוסים יכולים להיכנס"]],"src":"Book Q16; RoR (yellow box junctions), Bank","book":[16]},{"id":"r16","deck":"room","type":"room","q":["What is the difference between a pelican crossing and a zebra crossing?","מה ההבדל בין מעבר חציה pelican לבין zebra?"],"a":["A pelican crossing is controlled by traffic lights (a flashing amber light means yield to pedestrians on the crossing). A zebra crossing has black-and-white stripes and flashing amber beacons and is controlled by the presence of pedestrians; pedestrians already on it have priority – you must yield.","מעבר pelican נשלט ברמזור (כתום מהבהב = לתת זכות קדימה להולכי רגל שבמעבר). מעבר zebra הוא פסים שחור-לבן עם פנסי כתום מהבהבים, והוא נשלט על ידי נוכחות הולכי הרגל; להולכי רגל שכבר במעבר יש זכות קדימה – חייבים לתת להם."],"s":["Pelican = lights; zebra = stripes + flashing beacons, pedestrians have priority","Pelican = רמזור; zebra = פסים + פנסים מהבהבים, להולכי רגל זכות קדימה"],"w":[["Pelican has stripes, zebra has lights","ל-Pelican יש פסים, ל-zebra יש רמזור"],["They are the same thing","זה אותו דבר"],["Zebra is only for cyclists","zebra רק לרוכבי אופניים"]],"src":"Book Q17; RoR p.219, Bank","book":[17]},{"id":"r17","deck":"room","type":"room","q":["What does an island in the centre of a pedestrian crossing mean?","מה משמעות אי תנועה באמצע מעבר חציה?"],"a":["A zebra crossing with a central island is treated as two separate crossings. A pelican crossing that goes straight across counts as one crossing even with an island; if the two halves are staggered (not in a straight line) they count as two.","מעבר zebra עם אי באמצע נחשב לשני מעברים נפרדים. מעבר pelican ישר נחשב למעבר אחד גם עם אי; אם שני החלקים מוסטים (לא בקו ישר) – הם נחשבים לשניים."],"s":["Zebra with island = two crossings; straight pelican = one","Zebra עם אי = שני מעברים; Pelican ישר = אחד"],"w":[["Always one crossing","תמיד מעבר אחד"],["Vehicles may park on the island","מותר לחנות על האי"],["Pedestrians must wait on the island for 1 minute","הולכי הרגל חייבים לחכות באי דקה"]],"src":"Book Q18; Bank (consistent with RoR p.218-219)","book":[18]},{"id":"r18","deck":"room","type":"room","q":["What do the white zig-zag lines at a zebra crossing mean?","מה משמעות קווי הזיגזג הלבנים ליד מעבר חציה?"],"a":["No overtaking and no parking (or stopping) in the zig-zag area.","אסור לעקוף ואסור לחנות באזור הזיגזג."],"s":["No overtaking or parking","אסור לעקוף ולחנות"],"w":[["Speed limit reduces to 30 km/h","המהירות יורדת ל-30 קמ\"ש"],["Parking is allowed for 5 minutes","מותר לחנות 5 דקות"],["Yield to traffic from the right","לתת זכות קדימה לתנועה מימין"]],"src":"Book Q19; RoR p.143, p.219","book":[19]},{"id":"r19","deck":"room","type":"room","q":["What is the speed limit on (a) national roads (primary and secondary) and (b) motorways?","מהי מגבלת המהירות (א) בכבישים לאומיים (primary/secondary) ו-(ב) בכבישים מהירים (motorway)?"],"a":["(a) 100 km/h; (b) 120 km/h. These are maximums, not targets. Speed limits are in km/h.","(א) 100 קמ\"ש; (ב) 120 קמ\"ש. אלה מקסימום – לא יעד."],"s":["National roads 100 km/h, motorways 120 km/h","כביש לאומי 100 קמ\"ש, מהיר 120 קמ\"ש"],"w":[["80 km/h and 100 km/h","80 קמ\"ש ו-100 קמ\"ש"],["90 km/h and 110 km/h","90 קמ\"ש ו-110 קמ\"ש"],["100 km/h and 130 km/h","100 קמ\"ש ו-130 קמ\"ש"]],"ie":["Israel: 90 / 110 on intercity roads; Ireland: 100 (N roads) and 120 (motorway).","בישראל 90/110 בין-עירוני; באירלנד 100 (כביש N) ו-120 (מוטורווי)."],"src":"Book Q20; RoR p.117, Bank","book":[20]},{"id":"r20","deck":"room","type":"room","q":["What are the speed limits in built-up areas, on regional roads and on local roads?","מהן מגבלות המהירות באזור בנוי, בכבישים אזוריים ובכבישים מקומיים?"],"a":["Built-up areas (cities, towns): usually 50 km/h, unless special speed limits apply to designated roads and zones – generally 30 km/h or 60 km/h, shown by signs (e.g. housing estates 30). Outside built-up areas: regional roads 80 km/h, local roads 60 km/h.","אזור בנוי: בדרך כלל 50 קמ\"ש, אלא אם חלות מגבלות מיוחדות על כבישים ואזורים מוגדרים – בדרך כלל 30 או 60 קמ\"ש, לפי תמרורים (למשל שכונות מגורים 30). מחוץ לאזור בנוי: כבישים אזוריים (regional) 80, כבישים מקומיים (local) 60."],"s":["Built-up 50, regional 80, local 60 (special zones 30 or 60)","בנוי 50, אזורי 80, מקומי 60 (אזורים מיוחדים 30 או 60)"],"w":[["Built-up 60, regional 100, local 80","בנוי 60, אזורי 100, מקומי 80"],["Built-up 40, regional 60, local 50","בנוי 40, אזורי 60, מקומי 50"],["Built-up 50, regional 100, local 100","בנוי 50, אזורי 100, מקומי 100"]],"src":"Book Q21; RoR p.117 table, Bank","book":[21]},{"id":"r21","deck":"room","type":"room","q":["What is the minimum tread depth on tyres?","מהו עומק החריצים המינימלי בצמיגים?"],"a":["1.6 mm across the main treads, all the way round the tyre (car). (The RSA recommends changing tyres before they get that low.)","1.6 מ\"מ בחריצים הראשיים, בכל היקף הצמיג (רכב פרטי)."],"s":["1.6 mm","1.6 מ\"מ"],"w":[["0.6 mm","0.6 מ\"מ"],["3 mm","3 מ\"מ"],["2.5 mm","2.5 מ\"מ"]],"src":"Book Q22; RSA vehicle page, Bank","book":[22]},{"id":"r22","deck":"room","type":"room","q":["What are the rules regarding bus lanes?","מה הכללים לגבי נתיבי אוטובוסים?"],"a":["With-flow bus lane: same direction as the traffic beside it, shown by a bus sign on the information plate; used by buses, and also by bicycles, e-scooters and taxis; reserved during the times on the information sign (normally 7am–7pm or peak hours). Contra-flow bus lane: opposite direction; reserved for buses (generally no other traffic, day or night). Road marking: continuous white line and \"Lána Bus\".","נתיב עם הזרם (with-flow): באותו כיוון כמו התנועה לידו, מסומן בתמרור אוטובוס על לוחית המידע; לאוטובוסים וגם לאופניים, קורקינטים חשמליים ומוניות; שמור בשעות המצוינות בשלט (בדרך כלל 7:00–19:00 או שעות עומס). נתיב נגד הזרם (contra-flow): בכיוון ההפוך; שמור לאוטובוסים (בדרך כלל אין כניסה לאחרים, יום וליל). סימון: קו לבן רצוף וכתובת \"Lána Bus\"."],"s":["With-flow: buses + bikes + taxis in set hours; contra-flow: buses only","עם הזרם: אוטובוסים + אופניים + מוניות בשעות קבועות; נגד הזרם: אוטובוסים בלבד"],"w":[["Anyone may use it after 10 am","כל אחד יכול להשתמש בו אחרי 10:00"],["Only taxis may use bus lanes","רק מוניות יכולות להשתמש בנתיב אוטובוסים"],["Both types are open to all cars at weekends","שני הסוגים פתוחים לכל הרכבים בסופי שבוע"]],"src":"Book Q23; RoR p.84-85, Bank","book":[23]},{"id":"r23","deck":"room","type":"room","q":["How far away from a junction should you park?","באיזה מרחק מצומת צריך לחנות?"],"a":["More than 5 metres from the junction (unless parking spaces are clearly marked).","יותר מ-5 מטר מהצומת (אלא אם יש מקומות חניה מסומנים)."],"s":["More than 5 metres","יותר מ-5 מטר"],"w":[["At least 1 metre","לפחות מטר אחד"],["At least 15 metres","לפחות 15 מטר"],["Any distance if you have hazard lights on","כל מרחק אם האורות המהבהבים דולקים"]],"src":"Book Q24; RoR p.144, Bank","book":[24]},{"id":"r24","deck":"room","type":"room","q":["What position do you take for a right turn in a one-way street?","באיזה מקום בכביש מתמקמים לפנייה ימינה ברחוב חד-סטרי?"],"a":["As close as you safely can to the right-hand side of the street.","כמה שיותר קרוב לצד הימני של הרחוב (בבטחה)."],"s":["Right-hand side of the street","הצד הימני של הרחוב"],"w":[["Left-hand side of the street","הצד השמאלי של הרחוב"],["The middle of the road","אמצע הכביש"],["Wherever there is a gap","איפה שיש רווח"]],"ie":["Careful: this is the one case where you turn right from the RIGHT side.","שימו לב: זה המקרה היחיד שבו פונים ימינה מהצד הימני."],"src":"Book Q25; RoR p.130, Bank","book":[25]},{"id":"r25","deck":"room","type":"room","q":["What are hatched markings?","מהם סימוני hatched (קווים אלכסוניים)?"],"a":["Diagonal or chevron markings used for merging traffic, diverging traffic, and separating traffic travelling in opposite directions (central islands). You must not enter the area they cover (a fault if you do).","סימונים אלכסוניים/חצים שמשמשים למיזוג תנועה, לפיצול תנועה ולהפרדה בין כיוונים מנוגדים. אסור להיכנס לשטח שהם מכסים."],"s":["Diagonal/chevron areas – do not enter","שטח אלכסוני/חצים – לא להיכנס"],"w":[["Parking area for motorbikes","אזור חניה לאופנועים"],["A cycle lane","נתיב אופניים"],["An area where you may overtake","אזור שבו מותר לעקוף"]],"src":"Book Q26; RoR (hatched markings), Bank","book":[26]},{"id":"r26","deck":"room","type":"room","q":["What does a Yield sign mean?","מה פירוש תמרור Yield (תן זכות קדימה)?"],"a":["Usually near a junction or roundabout: you must give way to traffic on the major road ahead (or on the roundabout) and must not proceed until it is safe. Unlike Stop, you do not have to stop completely unless you need to wait.","בדרך כלל ליד צומת או כיכר: חובה לתת זכות קדימה לתנועה בדרך הראשית (או בכיכר) ולא להמשיך עד שבטוח. בניגוד ל-Stop אין חובה לעצור לגמרי, אלא אם צריך להמתין."],"s":["Give way to traffic on the major road/roundabout; stop only if needed","לתת זכות קדימה לתנועה בדרך הראשית/בכיכר; לעצור רק אם צריך"],"w":[["You must always stop completely","חובה תמיד לעצור לגמרי"],["You have priority over traffic on the main road","יש לך זכות קדימה על הדרך הראשית"],["Slow down only if pedestrians are present","מאטים רק אם יש הולכי רגל"]],"ie":["\"Géill Slí\" is the Irish for Yield; the sign is an inverted triangle with a red border.","\"Géill Slí\" = Yield בגאלית; התמרור הוא משולש הפוך עם מסגרת אדומה."],"src":"RoR p.70, p.126, Bank","book":[27],"ex":[{"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003cpolygon points=\"8,12 92,12 50,88\" fill=\"#fff\" stroke=\"#d71920\" stroke-width=\"9\" stroke-linejoin=\"round\"/>\u003ctext x=\"50\" y=\"38\" text-anchor=\"middle\" font-family=\"Arial,Helvetica,sans-serif\" font-weight=\"700\" font-size=\"14\" fill=\"#111\" >YIELD\u003c/text>\u003c/svg>","l":["Yield","תן זכות קדימה"]}]},{"id":"r27","deck":"room","type":"room","q":["What is a filter light?","מהו filter light?"],"a":["A green (or amber) arrow light. You may proceed in the direction of the arrow if it is safe and the way is clear – even if a red light is also showing.","חץ ירוק (או כתום) ברמזור. מותר להמשיך בכיוון החץ אם בטוח והדרך פנויה – גם כשדולק אור אדום."],"s":["An arrow light: you may go in that direction even on red, if clear","חץ ברמזור: מותר לנסוע בכיוונו גם כשאדום, אם הדרך פנויה"],"w":[["A light that tells you to stop in a bus lane","אור שמורה לעצור בנתיב אוטובוסים"],["A flashing light for cyclists only","אור מהבהב לרוכבי אופניים בלבד"],["A light that means \"slow down\"","אור שמשמעותו \"האט\""]],"src":"RoR p.109, Bank","book":[28]},{"id":"r28","deck":"room","type":"room","q":["You are approaching traffic lights and they change to amber. What do you do?","את מתקרבת לרמזור והוא הופך לכתום. מה עושים?"],"a":["Stop – you must not go beyond the stop line – unless you are so close to the line that stopping would be dangerous. Always approach lights at a speed that lets you stop.","עוצרים – אסור לעבור את קו העצירה – אלא אם אתה כל כך קרוב שהעצירה תהיה מסוכנת. תמיד מתקרבים לרמזור במהירות שמאפשרת לעצור."],"s":["Stop, unless it is unsafe to do so","לעצור, אלא אם זה לא בטוח"],"w":[["Speed up to get through","להאיץ ולעבור"],["Always continue – amber means clear the junction","תמיד להמשיך – כתום אומר לפנות את הצומת"],["Stop only if there are pedestrians","לעצור רק אם יש הולכי רגל"]],"ie":["In Israel many drivers go on amber; in Ireland amber means stop if safe.","בישראל רבים עוברים בכתום; באירלנד כתום = לעצור אם בטוח."],"src":"RoR p.109, Bank","book":[29]},{"id":"r29","deck":"room","type":"room","q":["What does a flashing amber traffic light mean?","מה פירוש אור כתום מהבהב?"],"a":["At a pelican crossing: you must yield to pedestrians on the crossing; proceed if the crossing is clear. (A flashing amber arrow at a junction: you may go only after giving way to traffic already coming through.)","במעבר חציה pelican: חייבים לתת זכות קדימה להולכי רגל שבמעבר; ממשיכים אם המעבר פנוי. (חץ כתום מהבהב בצומת: מותר להמשיך רק אחרי שנותנים זכות קדימה לתנועה שכבר עוברת.)"],"s":["Proceed if the crossing is clear, but pedestrians have priority","ממשיכים אם המעבר פנוי, אבל להולכי רגל יש זכות קדימה"],"w":[["Stop and wait for green","לעצור ולחכות לירוק"],["Cars have priority over pedestrians","לרכבים יש זכות קדימה על הולכי רגל"],["The lights are out of order","הרמזור מקולקל"]],"src":"RoR p.109, p.219, Bank","book":[30]},{"id":"r30","deck":"room","type":"room","q":["What do flashing red traffic lights mean?","מה פירוש אורות אדומים מהבהבים?"],"a":["Stop – for example at a level (railway) crossing: a train is approaching. A flashing red light always means stop; it has the same meaning as a steady red light.","עצור – למשל במעבר מסילת ברזל: רכבת מתקרבת. אור אדום מהבהב תמיד אומר עצור, כמו אדום קבוע."],"s":["Stop – train approaching","עצור – רכבת מתקרבת"],"w":[["Proceed with caution","להמשיך בזהירות"],["Give way to pedestrians","לתת זכות קדימה להולכי רגל"],["Road ahead closed for roadworks","כביש סגור לעבודות"]],"src":"RoR (level crossings), Bank","book":[31]},{"id":"r31","deck":"room","type":"room","q":["What does a continuous yellow line at the side of the road mean?","מה פירוש קו צהוב רצוף בצד הכביש?"],"a":["No parking during the times shown on the nearby information plate.","אסור לחנות בשעות המצוינות על השלט הסמוך."],"s":["No parking during the times on the plate","אסור לחנות בשעות שבשלט"],"w":[["No parking at any time","אסור לחנות בכל שעה"],["Parking only for disabled drivers","חניה לנכים בלבד"],["Hard shoulder for cyclists","שול לאופניים"]],"src":"RoR p.142, Bank","book":[32]},{"id":"r32","deck":"room","type":"room","q":["What do double continuous yellow lines at the side of the road mean?","מה פירוש שני קווים צהובים רצופים בצד הכביש?"],"a":["No parking at any time.","אסור לחנות בכל שעה."],"s":["No parking at any time","אסור לחנות בכל שעה"],"w":[["No parking at night only","אסור לחנות בלילה בלבד"],["Loading allowed for 30 min","מותר להעמיס 30 דקות"],["No overtaking","אסור לעקוף"]],"src":"RoR p.142, Bank","book":[33]},{"id":"r33","deck":"room","type":"room","q":["Give examples of where you would not park.","תן דוגמאות למקומות שבהם אסור לחנות."],"a":["At a corner, bend, brow of a hill or hump-back bridge; opposite a continuous white line; where you would obstruct a sign or an entrance; opposite another vehicle on a narrow road; a taxi rank; near a junction (within 5 m); at a bus stop; on a footpath or cycle lane; 15 m before / 5 m after a pedestrian crossing.","בפינה, בעיקול, בפסגת גבעה או בגשר גבנוני; מול קו לבן רצוף; במקום שיסתיר תמרור או כניסה; מול רכב אחר בכביש צר; בתחנת מוניות; ליד צומת (בתוך 5 מ'); בתחנת אוטובוס; על מדרכה או בנתיב אופניים; 15 מ' לפני / 5 מ' אחרי מעבר חציה."],"s":["At a corner, bend or brow of a hill; near a junction; opposite a continuous white line; at a taxi rank or bus stop","בפינה, בעיקול או בפסגת גבעה; ליד צומת; מול קו לבן רצוף; בתחנת מוניות או אוטובוס"],"w":[["Only on a motorway hard shoulder","רק בשול של כביש מהיר"],["On the footpath outside a shop for a few minutes","על המדרכה מול חנות לכמה דקות"],["Only where there is a double yellow line","רק איפה שיש קו צהוב כפול"]],"src":"RoR p.143-144, Bank","book":[33]},{"id":"r34","deck":"room","type":"room","q":["Within what distance from a pedestrian crossing should you not park?","עד איזה מרחק ממעבר חציה אסור לחנות?"],"a":["15 metres before or 5 metres after the crossing.","15 מטר לפני או 5 מטר אחרי מעבר החציה."],"s":["15 m before or 5 m after","15 מ' לפני או 5 מ' אחרי"],"w":[["5 m before or 15 m after","5 מ' לפני או 15 מ' אחרי"],["10 m on both sides","10 מ' משני הצדדים"],["5 m on both sides","5 מ' משני הצדדים"]],"src":"Book Q34; RoR p.143, Bank","book":[34]},{"id":"r35","deck":"room","type":"room","q":["What procedure must you adopt if crossing a dual carriageway with a narrow central median?","מה עושים כשחוצים כביש מפוצל שבו המדרכה/האי האמצעי צר?"],"a":["If the median is too narrow for your vehicle, you must wait until you can complete the crossing in one go (do not stop with the car sticking out into a lane).","אם האי האמצעי צר מדי לרכב שלך, חייבים לחכות עד שאפשר להשלים את החציה בבת אחת (לא לעצור כשהרכב בולט לנתיב)."],"s":["Wait until you can cross the whole road in one movement","לחכות עד שאפשר לחצות את כל הכביש ברצף"],"w":[["Stop on the median with the car half out","לעצור על האי כשהרכב בולט החוצה"],["Sound your horn and cross","לצפור ולחצות"],["Cross only in the left-hand lane","לחצות רק בנתיב השמאלי"]],"src":"Book Q35; Bank","book":[35]},{"id":"r36","deck":"room","type":"room","q":["What are the differences between a motorway and a dual carriageway?","מה ההבדלים בין motorway לבין dual carriageway?"],"a":["Motorway: exits to the left only, no traffic lights, no junctions, no roundabouts; 120 km/h limit may apply. A dual carriageway is a divided road that can have junctions, roundabouts and lights. Learner permit holders cannot use motorways.","Motorway: יציאות משמאל בלבד, בלי רמזורים, בלי צמתים, בלי כיכרות; ייתכן 120 קמ\"ש. Dual carriageway: כביש מפוצל שיכול להכיל צמתים, כיכרות ורמזורים. נהג עם permit ללמוד לא יכול להיכנס למוטורווי."],"s":["Motorway: left exits only, no lights/junctions/roundabouts, up to 120 km/h","Motorway: יציאות משמאל בלבד, בלי רמזורים/צמתים/כיכרות, עד 120 קמ\"ש"],"w":[["Motorway has traffic lights and roundabouts","ל-Motorway יש רמזורים וכיכרות"],["Motorway has exits on both sides","ל-Motorway יש יציאות בשני הצדדים"],["There is no difference","אין הבדל"]],"ie":["Learner permit holders may not drive on motorways in Ireland.","מי שיש לו רק permit ללמוד לא רשאי לנסוע בכביש מהיר (motorway)."],"src":"Book Q36; Bank, RSA booklet (learner permit rules)","book":[36]},{"id":"r37","deck":"room","type":"room","q":["Who has priority at an unmarked crossroads with roads of equal importance?","למי יש זכות קדימה בצומת ללא תמרורים בין כבישים בעלי חשיבות שווה?"],"a":["The traffic on your right has right of way – give priority to traffic approaching from your right. Proceed with caution: right of way is never absolute.","לתנועה מימין יש זכות קדימה – תן זכות קדימה לתנועה שמגיעה מימינך. ממשיכים בזהירות: זכות קדימה אינה מוחלטת."],"s":["Traffic approaching from your right","התנועה שמגיעה מימין"],"w":[["Traffic approaching from your left","התנועה שמגיעה משמאל"],["The vehicle going fastest","הרכב הנוסע הכי מהר"],["The vehicle turning left","הרכב הפונה שמאלה"]],"src":"Book Q37; RoR p.127, Bank","book":[37]},{"id":"r38","deck":"room","type":"room","q":["What are the road markings for \"No Entry\"?","מהם סימוני הכביש ל\"אין כניסה\"?"],"a":["A continuous white line and a broken white line with the words \"NO ENTRY\" painted between/along them.","קו לבן רצוף וקו לבן מקוטע עם הכתובת \"NO ENTRY\"."],"s":["A continuous and a broken white line with the words NO ENTRY","קו רצוף וקו מקוטע עם הכתובת NO ENTRY"],"w":[["A double yellow line","קו צהוב כפול"],["A red zig-zag line","קו זיגזג אדום"],["Two continuous white lines with the word STOP","שני קווים לבנים רצופים עם הכתובת STOP"]],"src":"Book Q38; RoR (road markings), Bank","book":[38]},{"id":"r39","deck":"room","type":"room","q":["What would you look out for on country roads?","על מה מחפשים/מתכוננים בכבישים כפריים?"],"a":["Pedestrians, animals, muddy surfaces, concealed entrances, slow-moving farm machinery (and sharp bends / narrow roads).","הולכי רגל, בעלי חיים, משטח בוצי, כניסות מוסתרות, מכונות חקלאיות איטיות (וגם עיקולים חדים/כבישים צרים)."],"s":["Pedestrians, animals, mud, hidden entrances, slow farm machinery","הולכי רגל, בעלי חיים, בוץ, כניסות מוסתרות, מכונות חקלאיות איטיות"],"w":[["Speed cameras and bus lanes","מצלמות מהירות ונתיבי אוטובוסים"],["Yellow box junctions","צמתי yellow box"],["Pelican crossings","מעברי pelican"]],"src":"Book Q39; Bank","book":[39]},{"id":"r40","deck":"room","type":"room","q":["When being overtaken, what must you not do?","כשעוקפים אותך – מה אסור לעשות?"],"a":["Do not increase your speed. Continue at the same pace (unless it becomes unsafe), keep as near to the left as is safe, and be alert in case the overtaking vehicle pulls in suddenly.","אסור להגביר מהירות. ממשיכים באותה מהירות (אלא אם נהיה לא בטוח), נשארים קרוב לשמאל ככל שבטוח, וערניים למקרה שהרכב העוקף יחתוך פתאום."],"s":["Increase your speed","להגביר מהירות"],"w":[["Keep to the left","להישאר בצד שמאל"],["Stay at the same speed","להישאר באותה מהירות"],["Be alert for the overtaking vehicle pulling in","להיות ערני לרכב העוקף שחוזר פנימה"]],"n":["MCQ is phrased \"what must you NOT do\" – the answer is the forbidden action.","בשאלה \"מה אסור לעשות\" – התשובה הנכונה היא הפעולה האסורה."],"src":"Book Q40; RoR p.57, Bank","book":[40]},{"id":"r41","deck":"room","type":"room","q":["Where would you never make a U-turn?","איפה לעולם לא עושים פרסה (U-turn)?"],"a":["In a one-way street; where there is a continuous white line or lines; where a sign forbids it. Only make a U-turn when traffic conditions make it completely safe.","ברחוב חד-סטרי; איפה שיש קו לבן רצוף/קווים רצופים; איפה שתמרור אוסר. עושים פרסה רק כשהתנועה מאפשרת זאת בבטחה מלאה."],"s":["One-way street, continuous white line, or where a sign forbids it","רחוב חד-סטרי, קו לבן רצוף, או איפה שתמרור אוסר"],"w":[["On a quiet road at night","בכביש שקט בלילה"],["At a roundabout exit","ביציאה מכיכר"],["On a hill","על גבעה"]],"src":"Book Q41; RoR (U-turns), Bank","book":[41]},{"id":"r42","deck":"room","type":"room","q":["What is meant by tailgating?","מה זה tailgating?"],"a":["Driving too close to the vehicle in front – not keeping a safe distance. (Keep at least a two-second gap in dry weather.)","נסיעה קרובה מדי לרכב שלפניך – בלי לשמור מרחק בטוח. (שומרים לפחות פער של שתי שניות ביובש.)"],"s":["Driving too close to the vehicle in front","נסיעה קרובה מדי לרכב שלפניך"],"w":[["Following a vehicle at night with full beams","נסיעה אחרי רכב בלילה באורות גבוהים"],["Overtaking on the left","עקיפה משמאל"],["Towing a trailer","משיכת קרוואן"]],"src":"Book Q42; RoR p.115, Bank","book":[42]},{"id":"r43","deck":"room","type":"room","q":["What human factors can affect your driving?","אילו גורמים אנושיים משפיעים על הנהיגה?"],"a":["Alcohol, drugs (prescription and non-prescription), tiredness and fatigue, road rage, attitude (and stress).","אלכוהול, סמים (גם תרופות מרשם ושאינן מרשם), עייפות, זעם בכביש (road rage), יחס/גישה (ולחץ)."],"s":["Alcohol, drugs, tiredness, road rage, attitude","אלכוהול, סמים/תרופות, עייפות, road rage, גישה"],"w":[["Only alcohol","רק אלכוהול"],["The colour of the car","צבע הרכב"],["The size of the engine","גודל המנוע"]],"src":"Book Q43; RoR (Section 8), Bank","book":[43]},{"id":"r44","deck":"room","type":"room","q":["What is coasting and why is it dangerous?","מהו coasting ולמה זה מסוכן?"],"a":["Coasting is when the vehicle is not being driven by the engine – the clutch pedal is held down and/or the gear lever is in neutral. It is dangerous because it reduces the driver's control of the vehicle. (Coasting is also marked as a fault under Vehicle Controls.)","Coasting הוא כשהרכב לא מונע על ידי המנוע – דוושת המצמד לחוצה ו/או ההילוך בניוטרל. זה מסוכן כי פוחתת השליטה ברכב. (גם נרשם כליקוי ב-Vehicle Controls.)"],"s":["Driving with clutch down / in neutral – less control","נסיעה עם מצמד לחוץ/בניוטרל – פחות שליטה"],"w":[["Driving very slowly in first gear","נסיעה איטית מאוד בהילוך ראשון"],["Using cruise control on a hill","שימוש ב-cruise control בעלייה"],["Following another car closely","נסיעה צמודה לרכב אחר"]],"src":"Book Q44; Bank, RSA-M (Vehicle Controls)","book":[44]},{"id":"r45","deck":"room","type":"room","q":["Who is responsible for seat belts?","מי אחראי על חגורות הבטיחות?"],"a":["For passengers under 17, the driver is responsible. For passengers aged 17 and over, the person themselves. Not wearing a belt is an offence (\"No Seatbelt, No Excuse\").","על נוסעים מתחת לגיל 17 – הנהג אחראי. על נוסעים בני 17 ומעלה – האדם עצמו. אי חגירה היא עבירה."],"s":["Driver for under-17s; each person themselves from 17","הנהג עד גיל 17; מגיל 17 כל אחד אחראי לעצמו"],"w":[["Always the driver","תמיד הנהג"],["Always the passenger","תמיד הנוסע"],["Nobody – only front seats need belts","אף אחד – רק במושבים הקדמיים צריך"]],"src":"Book Q45; RoR (seat belts), Bank","book":[45]},{"id":"r46","deck":"room","type":"room","q":["When following the road ahead on a multi-lane dual carriageway, which lane would you normally use?","בכביש מפוצל מרובה נתיבים – באיזה נתיב נוסעים בדרך כלל?"],"a":["Lane 1 – the left-hand driving lane – unless road markings indicate otherwise. Use the right-hand lane to overtake or when turning right.","נתיב 1 – הנתיב השמאלי – אלא אם הסימונים אומרים אחרת. הנתיב הימני לעקיפה או לפנייה ימינה."],"s":["The left-hand lane (lane 1)","הנתיב השמאלי (נתיב 1)"],"w":[["The right-hand lane","הנתיב הימני"],["The middle lane","הנתיב האמצעי"],["Whichever is emptiest","זה שהכי פנוי"]],"src":"Book Q46; Bank, RoR (lane discipline)","book":[46]},{"id":"r47","deck":"room","type":"room","q":["What is the \"2-second rule\"?","מהו \"כלל שתי השניות\"?"],"a":["A measure of safe following distance: stay at least 2 seconds behind the vehicle in front. When it passes a fixed point (lamp post), say \"Only a fool breaks the two-second rule\"; you should not reach the point before you finish. Double it (4 seconds) in the wet; more in snow, fog or ice.","מדד למרחק בטוח: לפחות 2 שניות מאחורי הרכב שלפניך. כשהוא עובר נקודה קבועה (עמוד תאורה) אומרים \"Only a fool breaks the two-second rule\" – לא צריך להגיע לנקודה לפני שמסיימים. בגשם – כפול (4 שניות); בשלג, ערפל וקרח – יותר."],"s":["At least 2 seconds behind the car in front (4 in the wet)","לפחות 2 שניות מאחורי הרכב שלפניך (4 בגשם)"],"w":[["1 second in all weather","שנייה אחת בכל מזג אוויר"],["2 seconds in the wet, 1 in the dry","2 שניות בגשם, 1 ביובש"],["10 seconds at all times","10 שניות תמיד"]],"src":"Book Q47; RoR p.115, Bank","book":[47]},{"id":"r48","deck":"room","type":"room","q":["Who may accompany a learner driver?","מי רשאי ללוות נהג לומד (learner)?"],"a":["A driver who has held a full, valid licence in the same category for at least two years. The learner must be accompanied at all times, including driving to and from the test centre.","נהג שמחזיק ברישיון מלא ותקף באותה קטגוריה לפחות שנתיים. הלומד חייב להיות מלווה בכל נסיעה – כולל הנסיעה למבחן ובחזרה."],"s":["A driver with a full licence in the same category for 2+ years","נהג עם רישיון מלא באותה קטגוריה לפחות שנתיים"],"w":[["Any adult over 21","כל מבוגר מעל גיל 21"],["Anyone with a licence for 6 months","כל מי שיש לו רישיון חצי שנה"],["Nobody, once you have passed the theory test","אף אחד, אחרי מבחן התאוריה"]],"src":"RSA checklist 2026 + RSA booklet (You must be accompanied)"},{"id":"r49","deck":"room","type":"room","q":["Can a learner permit holder drive on a motorway?","האם מי שיש לו learner permit יכול לנסוע בכביש מהיר (motorway)?"],"a":["No. A learner permit allows driving on all public roads except motorways.","לא. permit ללמוד מתיר נהיגה בכל הכבישים הציבוריים חוץ מכבישים מהירים."],"s":["No – not on motorways","לא – לא בכבישים מהירים"],"w":[["Yes, with an accompanying driver","כן, עם נהג מלווה"],["Yes, but only in the left lane","כן, אבל רק בנתיב השמאלי"],["Yes, but not above 80 km/h","כן, אבל לא מעל 80 קמ\"ש"]],"src":"RSA booklet (Your car learner permit)"},{"id":"r50","deck":"room","type":"room","q":["What are the drink-drive limits?","מהן מגבלות האלכוהול לנהג?"],"a":["50 mg of alcohol per 100 ml of blood for fully licensed drivers; 20 mg for learner drivers, newly qualified drivers (first 2 years) and professional drivers (bus, goods vehicle, PSV). Never drink and drive.","50 מ\"ג אלכוהול ל-100 מ\"ל דם לנהגים עם רישיון מלא; 20 מ\"ג לנהגים לומדים, נהגים חדשים (שנתיים ראשונות) ונהגים מקצועיים. לעולם אל תשתו ותנהגו."],"s":["50 mg per 100 ml – and 20 mg for learners and novice drivers","50 מ\"ג ל-100 מ\"ל – ו-20 מ\"ג ללומדים ולנהגים חדשים"],"w":[["80 mg for everyone","80 מ\"ג לכולם"],["0 mg for everyone","0 מ\"ג לכולם"],["50 mg for learners and 20 mg for others","50 מ\"ג ללומדים ו-20 לאחרים"]],"src":"RoR (Section 2; drink-driving)"},{"id":"r51","deck":"room","type":"room","q":["How long must you display N-plates after passing your test?","כמה זמן חייבים להציג שלט N אחרי שעוברים את המבחן?"],"a":["For 2 years from qualification (and apply for your full licence within 2 years of the test pass date). Until you hold the full licence you must still be accompanied.","שנתיים מרגע ההסמכה (ולהגיש בקשה לרישיון מלא בתוך שנתיים מתאריך המעבר). עד שיש רישיון מלא עדיין חייבים ליווי."],"s":["2 years","שנתיים"],"w":[["6 months","חצי שנה"],["1 year","שנה"],["5 years","5 שנים"]],"src":"RSA booklet (If you pass your driving test), RoR (N-plates)"},{"id":"r52","deck":"room","type":"room","q":["When does a car need a valid NCT disc?","מתי רכב צריך מדבקת NCT תקפה?"],"a":["Passenger cars over four years old must have a valid NCT (National Car Test) certificate and display the disc on the windscreen.","רכב פרטי שגילו מעל ארבע שנים חייב באישור NCT תקף ולהציג את המדבקה על השמשה."],"s":["Cars over 4 years old","רכב בן יותר מארבע שנים"],"w":[["Cars over 10 years old","רכב בן יותר מ-10 שנים"],["All cars every year","כל הרכבים כל שנה"],["Only cars used as taxis","רק רכבים שמשמשים כמוניות"]],"ie":["Israel: annual \"test\". Ireland: the NCT starts when the car is 4 years old; how often after that depends on the car's age (check ncts.ie).","בישראל טסט שנתי. באירלנד ה-NCT מתחיל כשהרכב בן 4 שנים; התדירות אחר כך תלויה בגיל הרכב (לבדוק ב-ncts.ie)."],"src":"RoR (NCT), RSA vehicle page"},{"id":"r53","deck":"room","type":"room","q":["What does the law say about mobile phones while driving?","מה החוק אומר על טלפון נייד בזמן נהיגה?"],"a":["You must not drive while using a hand-held mobile phone (fixed charge and up to 5 penalty points). Texting, emailing or reading messages while driving means a compulsory court appearance. Only exception: calling 999/112 in a genuine emergency.","אסור לנהוג תוך כדי שימוש בטלפון נייד ביד (קנס קבוע ועד 5 נקודות). שליחה/קריאה של הודעות או מייל תוך כדי נהיגה – חובת התייצבות בבית משפט. חריג יחיד: שיחה ל-999/112 במצב חירום אמיתי."],"s":["No hand-held phones; no texting; only 999/112 in an emergency","אין טלפון ביד; אין הודעות; רק 999/112 במצב חירום"],"w":[["Hand-held is fine at traffic lights","ביד מותר ברמזור"],["Texting is allowed if the car is slow","הודעות מותרות אם הרכב איטי"],["Only forbidden on motorways","אסור רק בכבישים מהירים"]],"src":"RoR (Using a mobile phone)"},{"id":"r54","deck":"room","type":"room","q":["What is the roundabout \"golden rule\" for lanes?","מהו \"כלל הזהב\" לבחירת נתיב בכיכר?"],"a":["Think of the roundabout as a clock. Exits from 6 to 12 o'clock (left turn / straight ahead): approach in the left-hand lane. Exits after 12 o'clock (turning right / going round): approach in the right-hand lane. Always follow road markings and signs if they say otherwise.","חושבים על הכיכר כעל שעון. יציאות מ-6 עד 12 (שמאלה / ישר): מתקרבים בנתיב השמאלי. יציאות אחרי 12 (ימינה / סיבוב): מתקרבים בנתיב הימני. תמיד ממלאים אחר סימונים ותמרורים אם הם אומרים אחרת."],"s":["Exits 6–12 o'clock: left lane; after 12 o'clock: right lane","יציאות 6–12: נתיב שמאלי; אחרי 12: נתיב ימני"],"w":[["Always the right-hand lane","תמיד הנתיב הימני"],["Always the left-hand lane","תמיד הנתיב השמאלי"],["Use whichever lane is emptier","הנתיב הפנוי יותר"]],"src":"RoR p.135-137, RSA-M (Position at Roundabouts)"},{"id":"r55","deck":"room","type":"room","q":["How do you signal at a roundabout?","איך מאותתים בכיכר?"],"a":["Left exit: signal left on approach and keep it on. Straight ahead: approach in the left lane, signal left only after passing the exit before yours. Later exits: signal right on approach, keep it on until you have passed the exit before yours, then change to left and move over to the left to leave.","יציאה שמאלה: מאותתים שמאלה בהתקרבות וממשיכים. ישר: מתקרבים בנתיב שמאל, מאותתים שמאלה רק אחרי שעברנו את היציאה שלפני שלנו. יציאות מאוחרות: מאותתים ימינה בהתקרבות עד שעברנו את היציאה שלפני שלנו, אז מחליפים לשמאל ועוברים שמאלה כדי לצאת."],"s":["Left exit: signal left. Straight on: signal left after the exit before yours. Later exits: signal right, then left after the exit before yours","יציאה שמאלית: איתות שמאלה. ישר: איתות שמאלה אחרי היציאה שלפני שלך. יציאות מאוחרות: איתות ימינה ואז שמאלה אחרי היציאה שלפני שלך"],"w":[["Never signal on a roundabout","אף פעם לא מאותתים בכיכר"],["Signal right for every exit","מאותתים ימינה לכל יציאה"],["Signal left on approach for every exit","מאותתים שמאלה בגישה לכל יציאה"]],"src":"RoR p.136-137"},{"id":"r56","deck":"room","type":"room","q":["How much room should you give a cyclist when passing?","כמה מרווח צריך לתת לרוכב אופניים כשעוקפים?"],"a":["At least 1 metre in speed zones up to 50 km/h, and at least 1.5 metres in speed zones over 50 km/h.","לפחות מטר אחד באזורי מהירות עד 50 קמ\"ש, ולפחות 1.5 מטר באזורי מהירות מעל 50 קמ\"ש."],"s":["1 m (up to 50 km/h); 1.5 m (over 50 km/h)","מטר (עד 50 קמ\"ש); 1.5 מ' (מעל 50 קמ\"ש)"],"w":[["0.5 m in all zones","חצי מטר בכל האזורים"],["2 m in all zones","2 מטר בכל האזורים"],["1.5 m up to 50 km/h and 1 m above","1.5 מ' עד 50 קמ\"ש ומטר מעל"]],"src":"RoR p.54"},{"id":"r57","deck":"room","type":"room","q":["Who has priority at a T-junction?","למי יש זכות קדימה בצומת T?"],"a":["Traffic already on the road you are joining. Traffic on the road that ends at the junction must wait for it to pass before turning left or right.","לתנועה שכבר נמצאת בכביש שאליו מצטרפים. התנועה בכביש שמסתיים בצומת חייבת להמתין לפני שפונים שמאלה או ימינה."],"s":["Traffic already on the road you are joining","התנועה שכבר בכביש שאליו מצטרפים"],"w":[["Traffic leaving the side road","התנועה שיוצאת מהרחוב הצדדי"],["The vehicle that arrived first","הרכב שהגיע ראשון"],["The vehicle turning right","הרכב הפונה ימינה"]],"src":"RoR p.127"},{"id":"r58","deck":"room","type":"room","q":["You are turning right and oncoming traffic is going straight – who has priority?","את פונה ימינה והתנועה הנגדית ממשיכה ישר – למי יש זכות קדימה?"],"a":["Traffic coming straight through from the opposite direction. If a vehicle from the opposite direction wants to turn left into the same road while you turn right, the vehicle turning left has right of way – you wait.","לתנועה הנגדית שממשיכה ישר. אם רכב מהכיוון ההפוך פונה שמאלה לאותו כביש בזמן שאתה פונה ימינה – לפונה שמאלה יש זכות קדימה, ואתה ממתין."],"s":["Oncoming traffic going straight (and oncoming left-turners)","התנועה הנגדית שנוסעת ישר (ופונים שמאלה מולך)"],"w":[["You – the turning vehicle has priority","את – לפונה יש זכות קדימה"],["The faster vehicle","הרכב המהיר יותר"],["The vehicle that signalled first","מי שאותת ראשון"]],"src":"RoR p.127"},{"id":"r59","deck":"room","type":"room","q":["When must you always yield to pedestrians?","מתי חייבים תמיד לתת זכות קדימה להולכי רגל?"],"a":["Pedestrians already crossing at a junction; on a zebra crossing; on a pelican crossing when the amber light is flashing; and when you are moving off from a stationary position (stop sign, parking space). To avoid doubt, a vehicle should always yield to pedestrians.","להולכי רגל שכבר חוצים בצומת; במעבר zebra; במעבר pelican כשהכתום מהבהב; וכשיוצאים ממצב עמידה (תמרור עצור, מקום חניה). ליתר ביטחון – תמיד לתת זכות קדימה להולכי רגל."],"s":["Pedestrians crossing at a junction, zebra, flashing-amber pelican, and when moving off","הולכי רגל בצומת, ב-zebra, ב-pelican בכתום מהבהב, וביציאה ממצב עמידה"],"w":[["Only on zebra crossings","רק ב-zebra"],["Only if they signal to you","רק אם הם מסמנים לך"],["Never – cars have priority at junctions","אף פעם – לרכבים עדיפות בצמתים"]],"src":"RoR p.127"},{"id":"r60","deck":"room","type":"room","q":["The traffic lights at a junction are out of order. What do you do?","הרמזור בצומת מקולקל. מה עושים?"],"a":["Stop at the control (stop) line first and only proceed when it is safe, yielding to all other traffic that has right of way.","עוצרים קודם בקו העצירה וממשיכים רק כשבטוח, תוך מתן זכות קדימה לכל תנועה שיש לה."],"s":["Stop at the line, then go only when safe, yielding to others","לעצור בקו, להמשיך רק כשבטוח ולתת זכות קדימה"],"w":[["Treat it as a roundabout","להתייחס כאל כיכר"],["Proceed – the road you are on has priority","להמשיך – לכביש שלך יש זכות קדימה"],["Flash your lights and drive through","להבהב ולעבור"]],"src":"RoR p.109"},{"id":"r61","deck":"room","type":"room","q":["What does a red light mean and where do you stop?","מה פירוש אור אדום ואיפה עוצרים?"],"a":["Stop. You must not go beyond the stop line at that light or, if there is no stop line, beyond the light itself.","עצור. אסור לעבור את קו העצירה ברמזור, ואם אין קו – אסור לעבור את הרמזור עצמו."],"s":["Stop behind the stop line (or the light if no line)","לעצור לפני קו העצירה (או לפני הרמזור אם אין קו)"],"w":[["Stop with the front wheels on the line","לעצור כשהגלגלים הקדמיים על הקו"],["Slow down and go if the junction is clear","להאט ולעבור אם הצומת פנוי"],["Stop only if there is cross traffic","לעצור רק אם יש תנועה חוצה"]],"ie":["No right turn on red in Ireland.","באירלנד אין פנייה ימינה באדום."],"src":"RoR p.108"},{"id":"r62","deck":"room","type":"room","q":["Does a green light give you right of way?","האם אור ירוק נותן זכות קדימה?"],"a":["No. Green means you may go on if the way is clear. Take special care when turning left or right, and give way to pedestrians who are crossing. A green light is not a right of way.","לא. ירוק אומר שמותר להמשיך אם הדרך פנויה. זהירות מיוחדת בפנייה, ולתת זכות קדימה להולכי רגל שחוצים. ירוק אינו זכות קדימה."],"s":["No – go only if the way is clear","לא – ממשיכים רק אם הדרך פנויה"],"w":[["Yes, always","כן, תמיד"],["Yes, over pedestrians","כן, על פני הולכי רגל"],["Only on national roads","רק בכבישים לאומיים"]],"src":"RoR p.108"},{"id":"r63","deck":"room","type":"room","q":["When may you use fog lights?","מתי מותר להשתמש בפנסי ערפל?"],"a":["Only in dense fog or falling snow. Switch them off at all other times.","רק בערפל כבד או בשלג שיורד. בכל מקרה אחר – מכבים אותם."],"s":["Only in dense fog or falling snow","רק בערפל כבד או שלג"],"w":[["Whenever it is raining","בכל פעם שיורד גשם"],["At night on unlit roads","בלילה בכבישים לא מוארים"],["When following a slow vehicle","כשנוסעים אחרי רכב איטי"]],"src":"RoR p.64"},{"id":"r64","deck":"room","type":"room","q":["When should you use main beam (full beam) headlights?","מתי משתמשים באורות גבוהים (main beam)?"],"a":["Outside the situations that call for dipped lights – e.g. on unlit roads with no traffic around. Dip them when meeting traffic, following another vehicle, and when you see red lights ahead (so you do not dazzle the driver in front).","מחוץ למצבים שבהם נדרשים אורות נמוכים – למשל בכביש חשוך בלי תנועה. מנמיכים כשנפגשים עם רכבים, כשנוסעים מאחורי רכב, וכשרואים אורות אדומים לפניך (כדי לא לסנוור)."],"s":["On unlit roads with no traffic; dip for other vehicles","בכביש חשוך בלי תנועה; מנמיכים בנוכחות רכבים"],"w":[["In built-up areas with street lighting","באזור בנוי עם תאורת רחוב"],["When following another car","כשנוסעים אחרי רכב אחר"],["In dense fog, always","בערפל כבד, תמיד"]],"src":"RoR p.64-65"},{"id":"r65","deck":"room","type":"room","q":["When should you use the horn?","מתי משתמשים בצופר?"],"a":["Only to warn other road users of oncoming danger, or to make them aware of your presence for safety reasons when reasonably necessary. The horn never gives you right of way.","רק כדי להזהיר משתמשי דרך אחרים מסכנה, או להודיע על נוכחותך מסיבות בטיחות כשצריך. הצופר לא נותן זכות קדימה."],"s":["To warn of danger – it gives no right of way","להזהיר מסכנה – הוא לא נותן זכות קדימה"],"w":[["To tell slow drivers to hurry up","כדי לומר לנהגים איטיים להזדרז"],["To say thank you","כדי להודות"],["To claim priority at a junction","כדי לתבוע זכות קדימה בצומת"]],"src":"RoR p.66"},{"id":"r66","deck":"room","type":"room","q":["Must you stop at a Stop sign if the road is clear?","האם חייבים לעצור בתמרור עצור גם כשהכביש ריק?"],"a":["Yes. You must stop completely at the sign (or the stop line) before entering the major road, no matter how quiet it looks. The Stop sign is the only regulatory sign shaped as a red octagon.","כן. חובה לעצור לגמרי ליד התמרור (או קו העצירה) לפני הכניסה לדרך הראשית, גם אם היא שקטה. תמרור עצור הוא התמרור היחיד בצורת מתומן אדום."],"s":["Yes – a complete stop, always","כן – עצירה מלאה, תמיד"],"w":[["No – slow down if clear","לא – מאטים אם פנוי"],["Only at night","רק בלילה"],["Only if other cars are present","רק אם יש רכבים אחרים"]],"ie":["Rolling through a stop is a fault; testers watch for a full stop.","לגלוש בתמרור עצור הוא ליקוי; הבוחנים מחפשים עצירה מלאה."],"src":"RoR p.70, p.126","ex":[{"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003cpolygon points=\"92.5,67.6 67.6,92.5 32.4,92.5 7.5,67.6 7.5,32.4 32.4,7.5 67.6,7.5 92.5,32.4\" fill=\"#d71920\" stroke=\"#fff\" stroke-width=\"3\"/>\u003cpolygon points=\"92.5,67.6 67.6,92.5 32.4,92.5 7.5,67.6 7.5,32.4 32.4,7.5 67.6,7.5 92.5,32.4\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" transform=\"translate(50 50) scale(.9) translate(-50 -50)\"/>\u003ctext x=\"50\" y=\"60\" text-anchor=\"middle\" font-family=\"Arial,Helvetica,sans-serif\" font-weight=\"700\" font-size=\"27\" fill=\"#fff\" >STOP\u003c/text>\u003c/svg>","l":["Stop: always a full stop","עצור: תמיד עצירה מלאה"]}]},{"id":"r67","deck":"room","type":"room","q":["Name places where you must never park.","ציין מקומות שבהם לעולם אסור לחנות."],"a":["At a corner, a bend, the brow of a hill or a hump-back bridge; where there is a sharp dip in the road; anywhere that blocks the view of a school warden. Also never park so that you interfere with traffic or endanger others.","בפינה, בעיקול, בפסגת גבעה או בגשר גבנוני; במקום שבו יש שקע חד בכביש; בכל מקום שחוסם את הראייה של שומר מעבר בית ספר. וגם לא לחנות באופן שמפריע לתנועה או מסכן אחרים."],"s":["Corner, bend, brow of a hill, hump-back bridge, a sharp dip, or where you block a school warden's view","פינה, עיקול, פסגת גבעה, גשר גבנוני, שקע חד, או מקום שחוסם את שדה הראייה של שומר מעבר בית ספר"],"w":[["Anywhere on a straight, quiet road","בכל מקום בכביש ישר ושקט"],["Next to the pavement on a residential street","ליד המדרכה ברחוב מגורים"],["Beside other parked cars in a car park","ליד רכבים חונים אחרים בחניון"]],"src":"RoR p.144"},{"id":"r68","deck":"room","type":"room","q":["What are the general rules when you park?","מהם הכללים הכלליים בחניה?"],"a":["Park facing the direction of traffic flow where possible; close to and parallel with the kerb; fully inside the bay if marked; apply the handbrake; switch off the engine; leave the car in first gear or reverse (P in an automatic); check for traffic and cyclists before opening the door.","חונים עם הפנים בכיוון התנועה אם אפשר; קרוב ובמקביל למדרכה; בתוך המשבצת אם יש סימון; מפעילים בלם יד; מכבים מנוע; משאירים בהילוך ראשון או אחורי (P באוטומט); בודקים תנועה ואופניים לפני פתיחת הדלת."],"s":["Face the flow of traffic, close and parallel to the kerb, handbrake on, engine off, in gear (P), lock up","עם כיוון התנועה, קרוב ומקביל למדרכה, בלם יד, מנוע כבוי, ברוורס/הילוך ראשון (P), לנעול"],"w":[["Leave the engine running with the hazards on","משאירים את המנוע דולק ואורות חירום"],["Leave it in neutral with the handbrake off","משאירים בניוטרל בלי בלם יד"],["Park facing oncoming traffic, about 1 metre from the kerb","חונים מול התנועה הנגדית, כמטר מהמדרכה"]],"src":"RoR p.139"},{"id":"r69","deck":"room","type":"room","q":["How do you reverse safely?","איך נוסעים אחורה בבטחה?"],"a":["Look carefully all around – in front, behind, over both shoulders, through the rear window and in the mirrors. Take special care near children (schools, car parks, your own driveway). Give way to other traffic and pedestrians. Ask for help if your view is restricted.","מסתכלים היטב לכל הכיוונים – קדימה, אחורה, מעל שני הכתפיים, דרך החלון האחורי ובמראות. זהירות מיוחדת ליד ילדים (בתי ספר, חניונים, חניה ביתית). נותנים זכות קדימה לתנועה ולהולכי רגל. מבקשים עזרה אם הראייה מוגבלת."],"s":["Look all round (shoulders, rear window, mirrors), take extra care near children, give way, ask for help if needed, go slowly","מסתכלים לכל הכיוונים (מעל הכתפיים, חלון אחורי, מראות), זהירות מיוחדת ליד ילדים, נותנים זכות קדימה, מבקשים עזרה אם צריך, לאט"],"w":[["Rely on the parking camera or mirrors only","מסתמכים רק על מצלמה או מראות"],["Reverse quickly to clear the area fast","נוסעים אחורה מהר כדי לפנות את המקום"],["Sound the horn and reverse - others must give way","מצפצפים ונוסעים אחורה - אחרים חייבים לתת זכות"]],"src":"RoR p.58, RSA-M (Reverse: \"direct observations\")"},{"id":"r70","deck":"room","type":"room","q":["What do lane-control signs (green arrow, red X) mean?","מה פירוש תמרורי בקרת נתיבים (חץ ירוק, X אדום)?"],"a":["Green arrow pointing down: the lane is open. Red X: the lane is closed – you must stop and must not pass; it has the same effect as a Stop sign. Green arrow pointing left/right: move into that lane (with normal lane-change checks).","חץ ירוק כלפי מטה: הנתיב פתוח. X אדום: הנתיב סגור – חייבים לעצור ואסור לעבור; כמו תמרור עצור. חץ ירוק שמאלה/ימינה: עוברים לנתיב הזה (בבדיקות רגילות)."],"s":["Green arrow = lane open; red X = lane closed (stop)","חץ ירוק = פתוח; X אדום = סגור (לעצור)"],"w":[["Red X = speed camera ahead","X אדום = מצלמת מהירות"],["Green arrow = taxis only","חץ ירוק = מוניות בלבד"],["Red X = reduce speed to 30","X אדום = להוריד ל-30"]],"src":"RoR p.70-71","ex":[{"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003crect x=\"8\" y=\"8\" width=\"84\" height=\"84\" rx=\"6\" fill=\"#111\"/>\u003crect x=\"40\" y=\"20\" width=\"20\" height=\"36\" fill=\"#2ecc40\"/>\u003cpolygon points=\"26,52 74,52 50,82\" fill=\"#2ecc40\"/>\u003c/svg>","l":["Lane open","נתיב פתוח"]},{"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003crect x=\"8\" y=\"8\" width=\"84\" height=\"84\" rx=\"6\" fill=\"#111\"/>\u003cpath d=\"M26 26 L74 74 M74 26 L26 74\" stroke=\"#d71920\" stroke-width=\"12\" stroke-linecap=\"round\"/>\u003c/svg>","l":["Lane closed: stop","נתיב סגור: עוצרים"]}]},{"id":"r71","deck":"room","type":"room","q":["Should you use cruise control in bad weather?","האם משתמשים ב-cruise control במזג אוויר גרוע?"],"a":["Avoid it in heavy rain, hail, snow, fog and icy conditions: it can reduce your control and slow your reaction to hazards.","נמנעים ממנו בגשם חזק, ברד, שלג, ערפל וקרח: הוא מפחית שליטה ומאט תגובה לסכנות."],"s":["Avoid it in heavy rain, snow, fog, ice","להימנע בגשם חזק, שלג, ערפל וקרח"],"w":[["Yes – it keeps speed steady","כן – הוא שומר מהירות קבועה"],["Only on motorways","רק בכבישים מהירים"],["Only in fog","רק בערפל"]],"src":"RoR p.116"},{"id":"r72","deck":"room","type":"room","q":["What is the effect of speed on a pedestrian hit by a car?","מה ההשפעה של מהירות על הולך רגל שנפגע מרכב?"],"a":["Hit at 60 km/h, 9 out of 10 pedestrians die; at 50 km/h, 5 out of 10; at 30 km/h, 1 out of 10.","בפגיעה ב-60 קמ\"ש 9 מתוך 10 הולכי רגל מתים; ב-50 קמ\"ש 5 מתוך 10; ב-30 קמ\"ש 1 מתוך 10."],"s":["60 km/h: 9/10 die; 50: 5/10; 30: 1/10","60 קמ\"ש: 9/10; 50: 5/10; 30: 1/10"],"w":[["60 km/h: 5/10 die; 50: 2/10; 30: 0/10","60 קמ\"ש: 5/10; 50: 2/10; 30: 0/10"],["Speed makes no difference","למהירות אין השפעה"],["60 km/h: 10/10 die; 50: 9/10; 30: 5/10","60 קמ\"ש: 10/10; 50: 9/10; 30: 5/10"]],"src":"RoR Section 1 (speed)"},{"id":"r73","deck":"room","type":"room","q":["What extra care is needed when overtaking a \"LONG VEHICLE\"?","איזו זהירות נוספת נדרשת בעקיפת רכב עם שלט \"LONG VEHICLE\"?"],"a":["The sign means the vehicle is at least 13 metres long, so you need extra road length to pass it and to return safely to the left-hand side.","השלט אומר שהרכב באורך 13 מטר לפחות, ולכן צריך מרחק כביש נוסף כדי לעקוף אותו ולחזור בבטחה לצד שמאל."],"s":["It is 13 m+ long – allow extra distance to overtake","אורכו 13 מ'+ – צריך מרחק נוסף לעקיפה"],"w":[["It is carrying dangerous goods","הוא נושא חומרים מסוכנים"],["It must not be overtaken at all","אסור לעקוף אותו בכלל"],["It is limited to 50 km/h","מוגבל ל-50 קמ\"ש"]],"src":"RoR p.56","ex":[{"svg":"\u003csvg viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003crect x=\"4\" y=\"30\" width=\"92\" height=\"40\" rx=\"4\" fill=\"#ffd400\" stroke=\"#d71920\" stroke-width=\"5\"/>\u003ctext x=\"50\" y=\"56\" text-anchor=\"middle\" font-family=\"Arial,Helvetica,sans-serif\" font-weight=\"700\" font-size=\"11\" fill=\"#111\">LONG VEHICLE\u003c/text>\u003c/svg>","l":["Long vehicle (13 m+)","רכב ארוך (13 מ׳+)"]}]},{"id":"r74","deck":"room","type":"room","q":["How do you turn right from a major road onto a minor road?","איך פונים ימינה מכביש ראשי לכביש משני?"],"a":["Check mirrors and blind spot early, signal right, move to just left of the middle of the road (or into the right-turn lane), leave room for others to pass on the left, don't turn the wheel until ready, finish the turn into the left side of the new road when there is a safe gap. Don't cut the corner and don't make a \"swan neck\".","בודקים מראות ושטח מת מוקדם, מאותתים ימינה, מתמקמים מעט שמאלה מאמצע הכביש (או בנתיב פנייה ימינה), משאירים מקום לעקיפה משמאל, לא מסובבים הגה עד שמוכנים, ומסיימים את הפנייה לצד שמאל של הכביש החדש כשיש רווח. לא חותכים פינה ולא עושים \"צוואר ברבור\"."],"s":["Mirrors and blind spot early, signal right, position just left of the middle (or right-turn lane), give way to oncoming traffic, turn into the left lane","מראות ושטח מת מוקדם, איתות ימינה, מיקום ממש משמאל לאמצע (או בנתיב פנייה ימינה), נותנים זכות לתנועה נגדית, פונים לנתיב השמאלי"],"w":[["Move to the far left, then swing wide into the junction","נצמדים לשמאל ואז פונים בקשת רחבה"],["Cut across in front of oncoming traffic without stopping","חותכים מול התנועה הנגדית בלי לעצור"],["Signal only once the wheel is already turning","מאותתים רק כשכבר מסובבים את ההגה"]],"src":"RoR p.128, RSA-M (Position turning right)"},{"id":"r75","deck":"room","type":"room","q":["Two cars facing each other both want to turn right at a crossroads. What should you do?","שני רכבים מולם מתכוונים לפנות ימינה בצומת. מה עושים?"],"a":["If possible turn \"back to back\" (each passes behind the other) so you can both see oncoming traffic. If that is not possible you may turn \"near-side to near-side\" (start the turn while facing each other).","אם אפשר – פונים \"גב אל גב\" (כל אחד עובר מאחורי השני) כדי לראות את התנועה הנגדית. אם אי אפשר – מותר \"קדמית אל קדמית\" (מתחילים את הפנייה כשהרכבים פונים זה לזה)."],"s":["Turn back to back if possible; otherwise near-side to near-side","גב אל גב אם אפשר; אחרת קדמית אל קדמית"],"w":[["The larger car goes first","הרכב הגדול עובר ראשון"],["Both wait for the lights to change","שניהם ממתינים לשינוי הרמזור"],["Flash lights and turn together","להבהב ולפנות יחד"]],"src":"RoR p.130"},{"id":"r76","deck":"room","type":"room","q":["What are the rules for loading bays and disabled parking bays?","מהם הכללים לאזורי העמסה ולחניות נכים?"],"a":["Loading bay: for goods vehicles loading or unloading for a maximum of 30 minutes (word \"LOADING\" on the road). Disabled bay: only with a valid permit, and only for the permit holder's convenience; wheelchair users need the extra-wide bay.","אזור העמסה: לרכבי משא להעמסה/פריקה עד 30 דקות (הכתובת \"LOADING\" על הכביש). חניית נכים: רק עם תו תקף ורק לנוחות בעל התו; משתמשי כיסא גלגלים זקוקים למקום הרחב."],"s":["Loading bay: goods vehicles only, max 30 minutes. Disabled bay: valid permit holder only","מפרץ פריקה: רכבי משא בלבד, עד 30 דקות. חניית נכים: רק בעל תו נכה תקף"],"w":[["Any car may use a loading bay for up to 2 hours","כל רכב יכול לחנות במפרץ פריקה עד שעתיים"],["Disabled bays are free for anyone when empty","חניות נכים פנויות לכולם כשהן ריקות"],["Loading bays are for short stays by any car","מפרצי פריקה הם לעצירות קצרות של כל רכב"]],"svg":"\u003csvg viewBox=\"0 0 200 100\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-hidden=\"true\">\u003crect x=\"4\" y=\"6\" width=\"86\" height=\"88\" rx=\"8\" fill=\"#0b4ea2\" stroke=\"#fff\" stroke-width=\"3\"/>\u003ctext x=\"26\" y=\"46\" text-anchor=\"middle\" font-family=\"Arial,Helvetica,sans-serif\" font-weight=\"700\" font-size=\"34\" fill=\"#fff\" >P\u003c/text>\u003cg transform=\"translate(62 58) scale(1)\" fill=\"none\" stroke=\"#fff\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"-2\" cy=\"-26\" r=\"5\" fill=\"#fff\" stroke=\"none\"/>\u003cpath d=\"M-4 -18 V2 H12 L18 16\" stroke-width=\"5\"/>\u003cpath d=\"M-4 -10 H8\" stroke-width=\"4\"/>\u003cpath d=\"M-10 -6 A15 15 0 1 0 12 12\" stroke-width=\"4\"/>\u003c/g>\u003crect x=\"104\" y=\"4\" width=\"92\" height=\"92\" rx=\"4\" fill=\"#4a4f55\"/>\u003crect x=\"114\" y=\"14\" width=\"72\" height=\"72\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3\" stroke-dasharray=\"9 6\"/>\u003ctext x=\"150\" y=\"55\" text-anchor=\"middle\" font-family=\"Arial,Helvetica,sans-serif\" font-weight=\"700\" font-size=\"13\" fill=\"#fff\" >LOADING\u003c/text>\u003cpath d=\"M124 76 H176\" stroke=\"#ffd400\" stroke-width=\"2\" stroke-dasharray=\"4 4\"/>\u003c/svg>","src":"RoR p.143-144"},{"id":"r77","deck":"room","type":"room","q":["What affects your total stopping distance?","מה משפיע על מרחק העצירה הכולל?"],"a":["Four things: your perception time, your reaction time, your vehicle's reaction time, and the vehicle's braking capability (brakes, tyres, weight, suspension, road surface). Alcohol, drugs and tiredness lengthen the first two.","ארבעה דברים: זמן הקליטה שלך, זמן התגובה שלך, זמן התגובה של הרכב, ויכולת הבלימה של הרכב (בלמים, צמיגים, משקל, מתלים, משטח הכביש). אלכוהול, סמים ועייפות מאריכים את שני הראשונים."],"s":["Perception time, reaction time, vehicle reaction time and braking capability","זמן קליטה, זמן תגובה, זמן תגובת הרכב ויכולת הבלימה"],"w":[["Only your speed","רק המהירות שלך"],["Only the weather and the road surface","רק מזג האוויר ומשטח הכביש"],["The colour and age of the car","הצבע והגיל של הרכב"]],"src":"RoR p.122-123"},{"id":"r78","deck":"room","type":"room","q":["If you double your speed, what happens to your braking distance?","אם מכפילים את המהירות – מה קורה למרחק הבלימה?"],"a":["It increases nearly four times.","הוא גדל כמעט פי ארבעה."],"s":["Nearly four times longer","כמעט פי ארבעה"],"w":[["Twice as long","פי שניים"],["Stays the same","נשאר זהה"],["Ten times longer","פי עשרה"]],"src":"RoR p.124"},{"id":"r79","deck":"room","type":"room","q":["Who else must you yield to at a junction?","למי עוד חייבים לתת זכות קדימה בצומת?"],"a":["Traffic already turning at the junction; traffic in another lane when you want to change lanes; and traffic on a public road when you are coming out of a private entrance. Remember: stop, look, listen and look again before entering the road.","לתנועה שכבר פונה בצומת; לתנועה בנתיב אחר כשרוצים להחליף נתיב; ולתנועה בכביש ציבורי כשיוצאים מכניסה פרטית. זוכרים: עוצרים, מסתכלים, מקשיבים ומסתכלים שוב לפני הכניסה לכביש."],"s":["Traffic already turning at the junction, traffic in another lane when you change lanes, traffic on a public road when leaving a private entrance","תנועה שכבר פונה בצומת, תנועה בנתיב אחר
